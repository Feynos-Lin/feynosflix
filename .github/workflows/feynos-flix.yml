          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.automirrored.filled.KeyboardArrowRight
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.navigation.NavHostController
          import coil.compose.AsyncImage
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.launch

          val Bg = Color(0xFF0A0A0D)
          val Surf = Color(0xFF1C1C22)
          val Purple = Color(0xFF8E5CFF)
          val Muted = Color(0xFFA3A3AE)

          @Composable
          fun FlixTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Purple,
                      onPrimary = Color.White,
                      secondary = Purple,
                      background = Bg,
                      surface = Bg,
                      onBackground = Color.White,
                      onSurface = Color.White,
                      surfaceVariant = Surf,
                      onSurfaceVariant = Muted,
                      secondaryContainer = Color(0xFF3A2A5C),
                      onSecondaryContainer = Color.White
                  ),
                  content = content
              )
          }

          val LocalNav = staticCompositionLocalOf<NavHostController> { error("No navigation") }

          sealed interface Res<out T> {
              data object Loading : Res<Nothing>
              data class Ok<T>(val v: T) : Res<T>
              data class Err(val e: Throwable) : Res<Nothing>
          }

          @Suppress("UNCHECKED_CAST")
          fun <T> Res<T>.orNull(): T? = (this as? Res.Ok<T>)?.v

          /** Small in-memory cache so revisiting a screen shows its last data instantly. */
          object MemCache {
              private val map = object : LinkedHashMap<String, Any>(64, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, Any>?): Boolean = size > 60
              }

              @Synchronized
              fun get(k: String): Any? = map[k]

              @Synchronized
              fun put(k: String, v: Any) {
                  map[k] = v
              }
          }

          /**
           * Loads data off the UI, reloading when [keys] change or the app asks for a refresh.
           * Refreshes happen silently: whatever is already on screen stays there until new data arrives.
           * With [cacheKey], the last result is also shown immediately the next time the screen opens.
           */
          @Composable
          fun <T> rememberLoad(vararg keys: Any?, cacheKey: String? = null, block: suspend () -> T): State<Res<T>> {
              val acc = Session.account?.key
              val ck = cacheKey?.let { "$acc|$it" }
              val state = remember(*keys, acc) {
                  @Suppress("UNCHECKED_CAST")
                  val cached = ck?.let { MemCache.get(it) } as? Res.Ok<T>
                  mutableStateOf<Res<T>>(cached ?: Res.Loading)
              }
              val tick = Session.tick
              LaunchedEffect(*keys, acc, tick) {
                  try {
                      val ok = Res.Ok(block())
                      state.value = ok
                      if (ck != null) MemCache.put(ck, ok)
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      if (state.value !is Res.Ok) state.value = Res.Err(e)
                  }
              }
              return state
          }

          @Composable
          fun <T> Loaded(r: Res<T>, content: @Composable (T) -> Unit) {
              when (r) {
                  is Res.Ok -> content(r.v)
                  is Res.Err -> ErrorBox(r.e.message ?: "Something went wrong")
                  else -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      CircularProgressIndicator(color = Purple)
                  }
              }
          }

          @Composable
          fun ErrorBox(msg: String) {
              Column(
                  Modifier.fillMaxSize().padding(24.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Icon(Icons.Filled.CloudOff, null, tint = Muted, modifier = Modifier.size(48.dp))
                  Spacer(Modifier.height(12.dp))
                  Text(msg, color = Muted, textAlign = TextAlign.Center)
                  Spacer(Modifier.height(12.dp))
                  OutlinedButton(onClick = { Session.tick++ }) { Text("Try again") }
              }
          }

          fun toast(ctx: Context, msg: String) = Toast.makeText(ctx, msg, Toast.LENGTH_SHORT).show()

          fun runtime(ticks: Long): String {
              val m = (ticks / 600_000_000L).toInt().coerceAtLeast(1)
              return if (m >= 60) "${m / 60}h ${m % 60}m" else "${m}m"
          }

          fun clock(ms: Long): String {
              val s = (ms / 1000).coerceAtLeast(0)
              val h = s / 3600
              val m = (s % 3600) / 60
              val sec = s % 60
              return if (h > 0) String.format("%d:%02d:%02d", h, m, sec) else String.format("%d:%02d", m, sec)
          }

          fun enc(s: String): String = Uri.encode(s.ifEmpty { "_" })

          fun browseRoute(title: String, kind: String, arg: String, types: String?): String =
              "browse/${enc(title)}/$kind/${enc(arg)}/${enc(types ?: "_")}"

          fun libTypes(v: Item): String? = when (v.collectionType) {
              "movies" -> "Movie"
              "tvshows" -> "Series"
              "boxsets" -> "BoxSet"
              "homevideos" -> "Video"
              "musicvideos" -> "MusicVideo"
              else -> null
          }

          fun play(ctx: Context, id: String, startMs: Long = -1L) {
              ctx.startActivity(Intent(ctx, PlayerActivity::class.java).putExtra("id", id).putExtra("startMs", startMs))
          }

          fun playOffline(ctx: Context, id: String) {
              ctx.startActivity(Intent(ctx, PlayerActivity::class.java).putExtra("offline", id))
          }

          fun openUrl(ctx: Context, url: String) {
              try {
                  ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
              } catch (e: Exception) {
                  toast(ctx, "No app can open this link")
              }
          }

          /** Play a movie/episode directly; for a series, play what's next (or episode 1). */
          fun playSmart(ctx: Context, scope: CoroutineScope, item: Item, nav: NavHostController) {
              when {
                  item.isPlayable -> play(ctx, item.id)
                  item.type == "Series" -> scope.launch {
                      val ep = runCatching { Jf.nextUp(item.id, 1, true).firstOrNull() ?: Jf.firstEpisode(item.id) }.getOrNull()
                      if (ep != null) play(ctx, ep.id) else toast(ctx, "No episodes found")
                  }
                  else -> nav.navigate("detail/${item.id}")
              }
          }

          @Composable
          fun ProgressLine(p: Float, modifier: Modifier = Modifier) {
              Box(modifier.fillMaxWidth().height(3.dp).background(Color.White.copy(alpha = 0.25f))) {
                  Box(Modifier.fillMaxWidth(p.coerceIn(0f, 1f)).fillMaxHeight().background(Purple))
              }
