# Feynos Flix — a Netflix-style Jellyfin client for Android.
# This one file contains the whole app. Each push (or a manual run from the
# Actions tab) builds a signed APK and publishes it as a GitHub release, which
# the app itself checks so it can update in place.
name: Build Feynos Flix

on:
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/feynos-flix.yml' ]
  workflow_dispatch:
    inputs:
      notes:
        description: 'What changed in this build (shown in the release and the in-app update prompt)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: feynos-flix
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Write build config and resources
        run: |
          set -e
          mkdir -p flix flix/app flix/app/src/main flix/app/src/main/res/drawable flix/app/src/main/res/mipmap-anydpi-v26 flix/app/src/main/res/values flix/app/src/main/res/xml
          cat > 'flix/app/build.gradle.kts' <<'FEYNOS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          val buildNum = (System.getenv("BUILD_NUMBER") ?: "1").toInt()
          val repoName = System.getenv("GITHUB_REPOSITORY") ?: ""

          android {
              namespace = "com.feynos.flix"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.feynos.flix"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = buildNum
                  versionName = "1.0.$buildNum"
                  buildConfigField("String", "GITHUB_REPO", "\"$repoName\"")
              }

              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
                      storePassword = System.getenv("KEYSTORE_PASS") ?: "feynosflix"
                      keyAlias = "feynos"
                      keyPassword = System.getenv("KEYSTORE_PASS") ?: "feynosflix"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                      "-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi",
                      "-opt-in=coil.annotation.ExperimentalCoilApi"
                  )
              }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.navigation:navigation-compose:2.8.5")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("com.github.junrar:junrar:7.5.5")
          }
          FEYNOS_EOF
          cat > 'flix/app/proguard-rules.pro' <<'FEYNOS_EOF'
          -dontwarn org.conscrypt.**
          -dontwarn org.bouncycastle.**
          -dontwarn org.openjsse.**
          -dontwarn javax.annotation.**
          -dontwarn okhttp3.internal.platform.**
          -dontwarn org.slf4j.**
          -dontwarn com.github.junrar.**
          -keep class com.github.junrar.** { *; }
          FEYNOS_EOF
          cat > 'flix/app/src/main/AndroidManifest.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:name=".FlixApp"
                  android:label="Feynos Flix"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:enableOnBackInvokedCallback="true"
                  android:theme="@style/Theme.Flix">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode" />

                  <activity
                      android:name=".ReaderActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          FEYNOS_EOF
          cat > 'flix/app/src/main/res/drawable/ic_launcher_foreground.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FF9B6BFF" android:pathData="M37,31h35v10h-25v9h20v9h-20v18h-10z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M58,63l0,14l12,-7z" />
          </vector>
          FEYNOS_EOF
          cat > 'flix/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          FEYNOS_EOF
          cat > 'flix/app/src/main/res/values/colors.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#FF0A0A0D</color>
              <color name="icon_bg">#FF160B2B</color>
          </resources>
          FEYNOS_EOF
          cat > 'flix/app/src/main/res/values/themes.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Flix" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          FEYNOS_EOF
          cat > 'flix/app/src/main/res/xml/file_paths.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="updates" path="updates/" />
          </paths>
          FEYNOS_EOF
          cat > 'flix/build.gradle.kts' <<'FEYNOS_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          FEYNOS_EOF
          cat > 'flix/gradle.properties' <<'FEYNOS_EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          FEYNOS_EOF
          cat > 'flix/settings.gradle.kts' <<'FEYNOS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FeynosFlix"
          include(":app")
          FEYNOS_EOF

      - name: Write App.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/App.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.app.Application
          import android.content.Context
          import android.content.SharedPreferences
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import coil.ImageLoader
          import coil.ImageLoaderFactory
          import coil.disk.DiskCache
          import coil.memory.MemoryCache
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          /** Long-lived scope for fire-and-forget calls (playback reports) that must outlive a screen. */
          val appScope = CoroutineScope(SupervisorJob() + Dispatchers.Main)

          class FlixApp : Application(), ImageLoaderFactory {
              override fun onCreate() {
                  super.onCreate()
                  Prefs.init(this)
                  Session.restore()
                  Downloads.init(this)
                  HomeCache.init(this)
                  Books.init(this)
              }

              override fun newImageLoader(): ImageLoader = ImageLoader.Builder(this)
                  .crossfade(true)
                  .respectCacheHeaders(false)
                  .memoryCache { MemoryCache.Builder(this).maxSizePercent(0.25).build() }
                  .diskCache { DiskCache.Builder().directory(cacheDir.resolve("images")).maxSizeBytes(512L * 1024 * 1024).build() }
                  .build()
          }

          data class Account(
              val server: String,
              val userId: String,
              val userName: String,
              val token: String,
              val serverName: String,
              val imageTag: String?
          ) {
              val key: String get() = "$server|$userId"

              fun toJson(): JSONObject = JSONObject()
                  .put("server", server).put("userId", userId).put("userName", userName)
                  .put("token", token).put("serverName", serverName).put("imageTag", imageTag ?: JSONObject.NULL)

              companion object {
                  fun from(o: JSONObject) = Account(
                      o.getString("server"), o.getString("userId"), o.optString("userName"),
                      o.getString("token"), o.optString("serverName"),
                      if (o.isNull("imageTag")) null else o.optString("imageTag")
                  )
              }
          }

          object Session {
              var accounts by mutableStateOf<List<Account>>(emptyList())
                  private set
              var account by mutableStateOf<Account?>(null)
                  private set
              var showProfiles by mutableStateOf(false)
              var tick by mutableIntStateOf(0)

              fun restore() {
                  accounts = Prefs.accounts
                  account = accounts.firstOrNull { it.key == Prefs.activeKey } ?: accounts.firstOrNull()
                  showProfiles = accounts.size > 1
              }

              fun select(a: Account) {
                  account = a
                  Prefs.activeKey = a.key
                  showProfiles = false
                  tick++
              }

              fun add(a: Account) {
                  accounts = accounts.filter { it.key != a.key } + a
                  Prefs.accounts = accounts
                  select(a)
              }

              fun remove(a: Account) {
                  accounts = accounts.filter { it.key != a.key }
                  Prefs.accounts = accounts
                  if (account?.key == a.key) {
                      account = null
                      Prefs.activeKey = null
                      showProfiles = accounts.isNotEmpty()
                  }
              }
          }

          val QUALITIES = listOf(
              0 to "Auto (best available)",
              80_000_000 to "80 Mbps",
              40_000_000 to "40 Mbps (4K)",
              20_000_000 to "20 Mbps (1080p high)",
              10_000_000 to "10 Mbps (1080p)",
              6_000_000 to "6 Mbps (720p)",
              3_000_000 to "3 Mbps",
              1_500_000 to "1.5 Mbps (data saver)"
          )

          fun qualityLabel(b: Int): String = QUALITIES.firstOrNull { it.first == b }?.second ?: "${b / 1_000_000} Mbps"

          object Prefs {
              private lateinit var sp: SharedPreferences

              fun init(ctx: Context) {
                  sp = ctx.getSharedPreferences("feynos_flix", Context.MODE_PRIVATE)
              }

              val deviceId: String
                  get() = sp.getString("deviceId", null)
                      ?: UUID.randomUUID().toString().also { sp.edit().putString("deviceId", it).apply() }

              var accounts: List<Account>
                  get() = try {
                      val a = JSONArray(sp.getString("accounts", "[]") ?: "[]")
                      (0 until a.length()).map { Account.from(a.getJSONObject(it)) }
                  } catch (e: Exception) {
                      emptyList()
                  }
                  set(v) {
                      val arr = JSONArray()
                      v.forEach { arr.put(it.toJson()) }
                      sp.edit().putString("accounts", arr.toString()).apply()
                  }

              var activeKey: String?
                  get() = sp.getString("active", null)
                  set(v) { sp.edit().putString("active", v).apply() }

              var maxBitrate: Int
                  get() = sp.getInt("maxBitrate", 0)
                  set(v) { sp.edit().putInt("maxBitrate", v).apply() }

              var autoPlayNext: Boolean
                  get() = sp.getBoolean("autoNext", true)
                  set(v) { sp.edit().putBoolean("autoNext", v).apply() }

              var autoSkipIntro: Boolean
                  get() = sp.getBoolean("autoSkip", false)
                  set(v) { sp.edit().putBoolean("autoSkip", v).apply() }

              var subsOn: Boolean
                  get() = sp.getBoolean("subsOn", false)
                  set(v) { sp.edit().putBoolean("subsOn", v).apply() }

              var subScale: Float
                  get() = sp.getFloat("subScale", 1f)
                  set(v) { sp.edit().putFloat("subScale", v).apply() }

              var audioLang: String
                  get() = sp.getString("audioLang", "") ?: ""
                  set(v) { sp.edit().putString("audioLang", v).apply() }

              var subLang: String
                  get() = sp.getString("subLang", "") ?: ""
                  set(v) { sp.edit().putString("subLang", v).apply() }

              var checkUpdates: Boolean
                  get() = sp.getBoolean("checkUpdates", true)
                  set(v) { sp.edit().putBoolean("checkUpdates", v).apply() }

              var comicMode: Int
                  get() = sp.getInt("comicMode", -1)
                  set(v) { sp.edit().putInt("comicMode", v).apply() }

              var comicSpread: Int
                  get() = sp.getInt("comicSpread", 0)
                  set(v) { sp.edit().putInt("comicSpread", v).apply() }

              var epubTheme: Int
                  get() = sp.getInt("epubTheme", 2)
                  set(v) { sp.edit().putInt("epubTheme", v).apply() }

              var epubSize: Int
                  get() = sp.getInt("epubSize", 100)
                  set(v) { sp.edit().putInt("epubSize", v).apply() }

              var epubFont: Int
                  get() = sp.getInt("epubFont", 0)
                  set(v) { sp.edit().putInt("epubFont", v).apply() }

              var epubLine: Int
                  get() = sp.getInt("epubLine", 1)
                  set(v) { sp.edit().putInt("epubLine", v).apply() }

              var epubMargin: Int
                  get() = sp.getInt("epubMargin", 1)
                  set(v) { sp.edit().putInt("epubMargin", v).apply() }

              fun bitrateOf(b: Int): Int = if (b <= 0) 200_000_000 else b
          }
          FEYNOS_EOF

      - name: Write Books.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/Books.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.content.Context
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException
          import java.time.Instant
          import java.util.concurrent.TimeUnit
          import java.util.zip.ZipFile

          enum class BookKind { Epub, ComicZip, ComicRar, Pdf, SevenZip, Unsupported }

          /** Where the reader gets its file: the server (cached on the phone while you read) or a finished download. */
          class BookSource(val id: String, val offline: DlEntry?)

          class ReadPos(val a: Int, val b: Double, val percent: Float, val total: Int, val at: Long)

          object Books {
              private lateinit var ctx: Context
              private lateinit var dir: File
              private const val CACHE_LIMIT = 2L * 1024 * 1024 * 1024

              private val http = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .build()

              fun init(c: Context) {
                  ctx = c.applicationContext
                  dir = File(ctx.cacheDir, "books").apply { mkdirs() }
              }

              // ---------- format detection (by file contents, not by name) ----------

              fun kindOf(f: File): BookKind {
                  val head = ByteArray(8)
                  val n = try {
                      f.inputStream().use { it.read(head) }
                  } catch (e: Exception) {
                      -1
                  }
                  if (n < 4) return BookKind.Unsupported
                  fun b(i: Int) = head[i].toInt() and 0xFF
                  return when {
                      b(0) == 0x50 && b(1) == 0x4B -> try {
                          ZipFile(f).use { z -> if (z.getEntry("META-INF/container.xml") != null) BookKind.Epub else BookKind.ComicZip }
                      } catch (e: Exception) {
                          BookKind.Unsupported
                      }
                      b(0) == 0x52 && b(1) == 0x61 && b(2) == 0x72 && b(3) == 0x21 -> BookKind.ComicRar
                      b(0) == 0x25 && b(1) == 0x50 && b(2) == 0x44 && b(3) == 0x46 -> BookKind.Pdf
                      b(0) == 0x37 && b(1) == 0x7A && b(2) == 0xBC && b(3) == 0xAF -> BookKind.SevenZip
                      else -> BookKind.Unsupported
                  }
              }

              fun unsupportedMessage(kind: BookKind): String = when (kind) {
                  BookKind.SevenZip -> "This comic is a 7z archive (CB7), which isn't supported yet. Converting it to CBZ will make it work."
                  else -> "This file type can't be opened here. Supported: EPUB, PDF, CBZ and CBR. (MOBI and AZW3 books can be converted to EPUB.)"
              }

              // ---------- getting the file ----------

              fun cacheRoot(): File = ctx.cacheDir

              fun cached(id: String): File? = File(dir, "$id.book").takeIf { it.exists() && it.length() > 0 }

              /** Returns the book file, downloading it first if it isn't on the phone yet. [onProgress] gets 0..1, or -1 when the size is unknown. */
              suspend fun fetch(id: String, onProgress: (Float) -> Unit): File {
                  cached(id)?.let {
                      it.setLastModified(System.currentTimeMillis())
                      return it
                  }
                  return withContext(Dispatchers.IO) {
                      val part = File(dir, "$id.part")
                      val req = Request.Builder().url(Jf.downloadUrl(id)).header("Authorization", Jf.authHeader(Jf.token)).build()
                      http.newCall(req).execute().use { r ->
                          if (!r.isSuccessful) throw IOException("The server couldn't send this book (${r.code})")
                          val body = r.body ?: throw IOException("Empty download")
                          val total = body.contentLength()
                          var read = 0L
                          var last = -2
                          body.byteStream().use { input ->
                              part.outputStream().use { out ->
                                  val buf = ByteArray(128 * 1024)
                                  while (true) {
                                      val n = input.read(buf)
                                      if (n < 0) break
                                      out.write(buf, 0, n)
                                      read += n
                                      val pct = if (total > 0) (read * 100 / total).toInt() else -1
                                      if (pct != last) {
                                          last = pct
                                          withContext(Dispatchers.Main) { onProgress(if (pct < 0) -1f else pct / 100f) }
                                      }
                                  }
                              }
                          }
                      }
                      val dest = File(dir, "$id.book")
                      dest.delete()
                      if (!part.renameTo(dest)) throw IOException("Couldn't save the book")
                      trim(keep = dest)
                      dest
                  }
              }

              private fun trim(keep: File) {
                  val files = dir.listFiles { f -> f.name.endsWith(".book") }?.sortedBy { it.lastModified() } ?: return
                  var total = files.sumOf { it.length() }
                  for (f in files) {
                      if (total <= CACHE_LIMIT) break
                      if (f == keep) continue
                      total -= f.length()
                      f.delete()
                  }
              }

              fun clearCache() {
                  dir.listFiles()?.forEach { it.delete() }
              }

              // ---------- reading position ----------

              private fun sp() = ctx.getSharedPreferences("reading", Context.MODE_PRIVATE)
              private fun key(id: String) = "${Session.account?.userId}:$id"

              fun position(id: String): ReadPos? {
                  val s = sp().getString(key(id), null) ?: return null
                  return try {
                      val o = JSONObject(s)
                      ReadPos(o.optInt("a"), o.optDouble("b", 0.0), o.optDouble("p", 0.0).toFloat(), o.optInt("t"), o.optLong("at"))
                  } catch (e: Exception) {
                      null
                  }
              }

              fun percent(id: String): Float = position(id)?.percent ?: 0f

              /** Books you've started, most recently read first. */
              fun recent(limit: Int = 20): List<String> {
                  val prefix = "${Session.account?.userId}:"
                  return sp().all.entries
                      .filter { it.key.startsWith(prefix) }
                      .mapNotNull { e ->
                          try {
                              val o = JSONObject(e.value as String)
                              val p = o.optDouble("p", 0.0)
                              if (p in 0.005..0.985) e.key.removePrefix(prefix) to o.optLong("at") else null
                          } catch (ex: Exception) {
                              null
                          }
                      }
                      .sortedByDescending { it.second }
                      .take(limit)
                      .map { it.first }
              }

              fun save(id: String, a: Int, b: Double, percent: Float, total: Int) {
                  val o = JSONObject().put("a", a).put("b", b).put("p", percent.toDouble()).put("t", total).put("at", System.currentTimeMillis())
                  sp().edit().putString(key(id), o.toString()).apply()
              }

              fun forget(id: String) {
                  sp().edit().remove(key(id)).apply()
              }

              /** Packs (a, b) into the "playback position" field Jellyfin keeps for every item, so progress follows you between devices. */
              private fun pack(a: Int, b: Double): Long = (a.toLong() * 1000L + (b.coerceIn(0.0, 1.0) * 999).toLong()) * 10_000L

              fun unpack(ticks: Long): Pair<Int, Double> {
                  val v = ticks / 10_000L
                  return (v / 1000).toInt() to (v % 1000) / 999.0
              }

              fun syncToServer(id: String, a: Int, b: Double, finished: Boolean) {
                  appScope.launchIo {
                      val body = JSONObject()
                          .put("PlaybackPositionTicks", if (finished) 0L else pack(a, b))
                          .put("Played", finished)
                          .put("LastPlayedDate", Instant.now().toString())
                      try {
                          Jf.post("/UserItems/$id/UserData", mapOf("userId" to Jf.uid), body)
                      } catch (e: Exception) {
                          try {
                              Jf.post("/Users/${Jf.uid}/Items/$id/UserData", body = body)
                          } catch (e2: Exception) {
                          }
                      }
                  }
              }

              /** The position to open at: whichever of the phone's and the server's is newer. */
              fun resolve(id: String, serverTicks: Long, serverPlayedAt: Long): Pair<Int, Double>? {
                  val local = position(id)
                  if (serverTicks > 0 && (local == null || serverPlayedAt > local.at + 5_000)) return unpack(serverTicks)
                  return local?.let { it.a to it.b }
              }

              fun parseDate(s: String?): Long = try {
                  if (s == null) 0L else Instant.parse(s).toEpochMilli()
              } catch (e: Exception) {
                  0L
              }
          }

          fun CoroutineScope.launchIo(block: suspend () -> Unit) {
              launch(Dispatchers.IO) { block() }
          }
          FEYNOS_EOF

