          import coil.compose.AsyncImage
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.launch

          val Bg = Color(0xFF0A0A0D)
          val Surf = Color(0xFF1C1C22)
          val Purple = Color(0xFF8E5CFF)
          val Muted = Color(0xFFA3A3AE)

          @Composable
          fun FlixTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Purple,
                      onPrimary = Color.White,
                      secondary = Purple,
                      background = Bg,
                      surface = Bg,
                      onBackground = Color.White,
                      onSurface = Color.White,
                      surfaceVariant = Surf,
                      onSurfaceVariant = Muted,
                      secondaryContainer = Color(0xFF3A2A5C),
                      onSecondaryContainer = Color.White
                  ),
                  content = content
              )
          }

          val LocalNav = staticCompositionLocalOf<NavHostController> { error("No navigation") }

          sealed interface Res<out T> {
              data object Loading : Res<Nothing>
              data class Ok<T>(val v: T) : Res<T>
              data class Err(val e: Throwable) : Res<Nothing>
          }

          @Suppress("UNCHECKED_CAST")
          fun <T> Res<T>.orNull(): T? = (this as? Res.Ok<T>)?.v

          /** Small in-memory cache so revisiting a screen shows its last data instantly. */
          object MemCache {
              private val map = object : LinkedHashMap<String, Any>(64, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, Any>?): Boolean = size > 60
              }

              @Synchronized
              fun get(k: String): Any? = map[k]

              @Synchronized
              fun put(k: String, v: Any) {
                  map[k] = v
              }
          }

          /**
           * Loads data off the UI, reloading when [keys] change or the app asks for a refresh.
           * Refreshes happen silently: whatever is already on screen stays there until new data arrives.
           * With [cacheKey], the last result is also shown immediately the next time the screen opens.
           */
          @Composable
          fun <T> rememberLoad(vararg keys: Any?, cacheKey: String? = null, block: suspend () -> T): State<Res<T>> {
              val acc = Session.account?.key
              val ck = cacheKey?.let { "$acc|$it" }
              val state = remember(*keys, acc) {
                  @Suppress("UNCHECKED_CAST")
                  val cached = ck?.let { MemCache.get(it) } as? Res.Ok<T>
                  mutableStateOf<Res<T>>(cached ?: Res.Loading)
              }
              val tick = Session.tick
              LaunchedEffect(*keys, acc, tick) {
                  try {
                      val ok = Res.Ok(block())
                      state.value = ok
                      if (ck != null) MemCache.put(ck, ok)
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      if (state.value !is Res.Ok) state.value = Res.Err(e)
                  }
              }
              return state
          }

          @Composable
          fun <T> Loaded(r: Res<T>, content: @Composable (T) -> Unit) {
              when (r) {
                  is Res.Ok -> content(r.v)
                  is Res.Err -> ErrorBox(r.e.message ?: "Something went wrong")
                  else -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      CircularProgressIndicator(color = Purple)
                  }
              }
          }

          @Composable
          fun ErrorBox(msg: String) {
              Column(
                  Modifier.fillMaxSize().padding(24.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Icon(Icons.Filled.CloudOff, null, tint = Muted, modifier = Modifier.size(48.dp))
                  Spacer(Modifier.height(12.dp))
                  Text(msg, color = Muted, textAlign = TextAlign.Center)
                  Spacer(Modifier.height(12.dp))
                  OutlinedButton(onClick = { Session.tick++ }) { Text("Try again") }
              }
          }

          fun toast(ctx: Context, msg: String) = Toast.makeText(ctx, msg, Toast.LENGTH_SHORT).show()

          fun runtime(ticks: Long): String {
              val m = (ticks / 600_000_000L).toInt().coerceAtLeast(1)
              return if (m >= 60) "${m / 60}h ${m % 60}m" else "${m}m"
          }

          fun clock(ms: Long): String {
              val s = (ms / 1000).coerceAtLeast(0)
              val h = s / 3600
              val m = (s % 3600) / 60
              val sec = s % 60
              return if (h > 0) String.format("%d:%02d:%02d", h, m, sec) else String.format("%d:%02d", m, sec)
          }

          fun enc(s: String): String = Uri.encode(s.ifEmpty { "_" })

          fun browseRoute(title: String, kind: String, arg: String, types: String?): String =
              "browse/${enc(title)}/$kind/${enc(arg)}/${enc(types ?: "_")}"

          fun libTypes(v: Item): String? = when (v.collectionType) {
              "movies" -> "Movie"
              "tvshows" -> "Series"
              "boxsets" -> "BoxSet"
              "homevideos" -> "Video"
              "musicvideos" -> "MusicVideo"
              else -> null
          }

          fun play(ctx: Context, id: String, startMs: Long = -1L) {
              ctx.startActivity(Intent(ctx, PlayerActivity::class.java).putExtra("id", id).putExtra("startMs", startMs))
          }

          fun playOffline(ctx: Context, id: String) {
              ctx.startActivity(Intent(ctx, PlayerActivity::class.java).putExtra("offline", id))
          }

          fun openUrl(ctx: Context, url: String) {
              try {
                  ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
              } catch (e: Exception) {
                  toast(ctx, "No app can open this link")
              }
          }

          /** Play a movie/episode directly; for a series, play what's next (or episode 1). */
          fun playSmart(ctx: Context, scope: CoroutineScope, item: Item, nav: NavHostController) {
              when {
                  item.isPlayable -> play(ctx, item.id)
                  item.type == "Series" -> scope.launch {
                      val ep = runCatching { Jf.nextUp(item.id, 1, true).firstOrNull() ?: Jf.firstEpisode(item.id) }.getOrNull()
                      if (ep != null) play(ctx, ep.id) else toast(ctx, "No episodes found")
                  }
                  else -> nav.navigate("detail/${item.id}")
              }
          }

          @Composable
          fun ProgressLine(p: Float, modifier: Modifier = Modifier) {
              Box(modifier.fillMaxWidth().height(3.dp).background(Color.White.copy(alpha = 0.25f))) {
                  Box(Modifier.fillMaxWidth(p.coerceIn(0f, 1f)).fillMaxHeight().background(Purple))
              }
          }

          @Composable
          fun PosterCard(item: Item, modifier: Modifier = Modifier.width(112.dp), onClick: (() -> Unit)? = null) {
              val nav = LocalNav.current
              Box(
                  modifier
                      .aspectRatio(2f / 3f)
                      .clip(RoundedCornerShape(6.dp))
                      .background(Surf)
                      .clickable { if (onClick != null) onClick() else nav.navigate("detail/${item.id}") }
              ) {
                  val p = Jf.poster(item)
                  if (p == null) {
                      Text(
                          item.name, Modifier.align(Alignment.Center).padding(8.dp),
                          textAlign = TextAlign.Center, fontSize = 13.sp, color = Color.White
                      )
                  } else {
                      AsyncImage(model = p, contentDescription = item.name, modifier = Modifier.fillMaxSize(), contentScale = ContentScale.Crop)
                  }
                  if (item.played) {
                      Icon(
                          Icons.Filled.CheckCircle, "Watched", tint = Purple,
                          modifier = Modifier.align(Alignment.TopEnd).padding(4.dp).size(18.dp).background(Color.Black.copy(alpha = 0.6f), CircleShape)
                      )
                  } else if (item.unplayed > 0) {
                      Text(
                          "${item.unplayed}",
                          modifier = Modifier.align(Alignment.TopEnd).padding(4.dp)
                              .background(Purple, RoundedCornerShape(4.dp)).padding(horizontal = 5.dp, vertical = 1.dp),
                          fontSize = 11.sp, color = Color.White, fontWeight = FontWeight.Bold
                      )
                  }
                  if (item.progress > 0f && !item.played) ProgressLine(item.progress, Modifier.align(Alignment.BottomCenter))
              }
          }

          @Composable
          fun WideCard(item: Item, modifier: Modifier = Modifier.width(230.dp)) {
              val ctx = LocalContext.current
              val nav = LocalNav.current
              Column(modifier) {
                  Box(
                      Modifier.fillMaxWidth().aspectRatio(16f / 9f).clip(RoundedCornerShape(6.dp)).background(Surf)
                          .clickable { if (item.isPlayable) play(ctx, item.id) else nav.navigate("detail/${item.id}") }
                  ) {
                      AsyncImage(model = Jf.thumb(item), contentDescription = item.name, modifier = Modifier.fillMaxSize(), contentScale = ContentScale.Crop)
                      Icon(
                          Icons.Filled.PlayArrow, "Play", tint = Color.White,
                          modifier = Modifier.align(Alignment.Center).size(44.dp)
                              .background(Color.Black.copy(alpha = 0.5f), CircleShape)
                              .border(1.dp, Color.White, CircleShape).padding(6.dp)
                      )
                      if (item.progress > 0f) ProgressLine(item.progress, Modifier.align(Alignment.BottomCenter))
                  }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f).padding(top = 4.dp)) {
                          Text(item.seriesName ?: item.name, fontSize = 14.sp, maxLines = 1, overflow = TextOverflow.Ellipsis, color = Color.White)
                          val sub = item.episodeLabel?.let { "$it  ${item.name}" }
                              ?: if (item.runTicks > 0 && item.positionTicks > 0) "${runtime(item.runTicks - item.positionTicks)} left" else ""
                          Text(sub, fontSize = 12.sp, color = Muted, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      }
                      IconButton(onClick = { nav.navigate("detail/${item.seriesId ?: item.id}") }) {
                          Icon(Icons.Filled.Info, "Details", tint = Muted)
                      }
                  }
              }
          }

          @Composable
          fun Top10Card(rank: Int, item: Item) {
              Box(Modifier.width(160.dp).height(170.dp)) {
                  Text(
                      "$rank",
                      modifier = Modifier.align(Alignment.BottomStart).offset(y = 22.dp),
                      fontSize = 120.sp,
                      fontWeight = FontWeight.Black,
                      color = Color(0xFF34343C)
                  )
                  PosterCard(item, Modifier.width(110.dp).align(Alignment.BottomEnd))
              }
          }

          enum class RowStyle { Poster, Wide, Top10 }

          class RowData(val title: String, val items: List<Item>, val style: RowStyle, val moreRoute: String? = null, val key: String = title)

          @Composable
          fun RowSection(r: RowData) {
              val nav = LocalNav.current
              Column(Modifier.padding(top = 18.dp)) {
                  val headerMod = r.moreRoute?.let { route -> Modifier.clickable { nav.navigate(route) } } ?: Modifier
                  Row(headerMod.fillMaxWidth().padding(horizontal = 16.dp, vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                      Text(r.title, fontSize = 18.sp, fontWeight = FontWeight.Bold, color = Color.White, modifier = Modifier.weight(1f))
                      if (r.moreRoute != null) Icon(Icons.AutoMirrored.Filled.KeyboardArrowRight, "See all", tint = Muted)
                  }
                  Spacer(Modifier.height(6.dp))
                  LazyRow(contentPadding = PaddingValues(horizontal = 16.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      when (r.style) {
                          RowStyle.Poster -> items(r.items) { PosterCard(it) }
                          RowStyle.Wide -> items(r.items) { WideCard(it) }
                          RowStyle.Top10 -> itemsIndexed(r.items) { i, it -> Top10Card(i + 1, it) }
                      }
                  }
              }
          }

          @Composable
          fun Avatar(acc: Account, size: Dp) {
              val colors = listOf(Purple, Color(0xFFE5484D), Color(0xFF3E9BFF), Color(0xFF30A46C), Color(0xFFF5A524))
              val c = colors[(acc.userName.hashCode() and 0x7fffffff) % colors.size]
              Box(Modifier.size(size).clip(RoundedCornerShape(size / 8)).background(c), contentAlignment = Alignment.Center) {
                  Text(acc.userName.take(1).uppercase(), color = Color.White, fontWeight = FontWeight.Bold, fontSize = (size.value * 0.45f).sp)
                  Jf.userImg(acc)?.let { AsyncImage(model = it, contentDescription = null, modifier = Modifier.fillMaxSize(), contentScale = ContentScale.Crop) }
              }
          }

          @Composable
          fun IconLabel(icon: ImageVector, label: String, onClick: () -> Unit) {
              Column(
                  Modifier.clip(RoundedCornerShape(8.dp)).clickable(onClick = onClick).padding(horizontal = 10.dp, vertical = 6.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Icon(icon, label, tint = Color.White, modifier = Modifier.size(26.dp))
                  Spacer(Modifier.height(2.dp))
                  Text(label, fontSize = 11.sp, color = Muted)
              }
          }

          @Composable
          fun SubTopBar(title: String, actions: @Composable RowScope.() -> Unit = {}) {
              val nav = LocalNav.current
              TopAppBar(
                  title = { Text(title, maxLines = 1, overflow = TextOverflow.Ellipsis) },
                  navigationIcon = {
                      IconButton(onClick = { nav.popBackStack() }) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back") }
                  },
                  actions = actions,
                  colors = TopAppBarDefaults.topAppBarColors(containerColor = Bg)
              )
          }

          @Composable
          fun OptionRow(label: String, selected: Boolean, onClick: () -> Unit) {
              Row(
                  Modifier.fillMaxWidth().clip(RoundedCornerShape(6.dp)).clickable(onClick = onClick).padding(horizontal = 8.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (selected) Icon(Icons.Filled.Check, null, tint = Purple, modifier = Modifier.size(20.dp)) else Spacer(Modifier.size(20.dp))
                  Spacer(Modifier.width(10.dp))
                  Text(label, color = if (selected) Color.White else Muted, fontWeight = if (selected) FontWeight.Bold else FontWeight.Normal)
              }
          }
          FEYNOS_EOF

      - name: Signing key (made once, then reused so in-app updates install cleanly)
        run: |
          set -e
          if [ ! -f .github/feynos-flix.jks ]; then
            mkdir -p .github
            keytool -genkeypair -v -keystore .github/feynos-flix.jks -storepass feynosflix -keypass feynosflix \
              -alias feynos -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Feynos Flix"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/feynos-flix.jks
            git commit -m "Add Feynos Flix signing key [skip ci]"
            git push
          fi

      - name: Build APK
        working-directory: flix
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/.github/feynos-flix.jks
          KEYSTORE_PASS: feynosflix
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare release
        env:
          NOTES_INPUT: ${{ github.event.inputs.notes }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          RUN: ${{ github.run_number }}
        run: |
          N="$NOTES_INPUT"
          [ -z "$N" ] && N="$HEAD_MSG"
          [ -z "$N" ] && N="Build $RUN"
          printf '%s\n' "$N" > release-notes.md
          cp flix/app/build/outputs/apk/release/app-release.apk "FeynosFlix-1.0.$RUN.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Feynos Flix 1.0.${{ github.run_number }}
          body_path: release-notes.md
          files: FeynosFlix-*.apk
          make_latest: true
