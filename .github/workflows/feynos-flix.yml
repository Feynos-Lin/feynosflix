                          Spacer(Modifier.height(16.dp))
                          Text("Movies and episodes you download appear here, ready to watch without a connection.", color = Muted, textAlign = TextAlign.Center)
                      }
                  } else {
                      LazyColumn(Modifier.fillMaxSize()) {
                          items(list) { e ->
