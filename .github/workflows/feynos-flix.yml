                                      modifier = Modifier.clip(RoundedCornerShape(8.dp)).clickable { user = name }.padding(4.dp)
                                  ) {
                                      Box(
                                          Modifier.size(64.dp).clip(RoundedCornerShape(8.dp))
                                              .background(if (user == name) Purple else Surf),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text(name.take(1).uppercase(), color = Color.White, fontSize = 26.sp, fontWeight = FontWeight.Bold)
                                          if (tag != null) {
                                              AsyncImage(
                                                  model = Jf.buildUrl(s, "/Users/${u.optString("Id")}/Images/Primary", mapOf("tag" to tag, "fillWidth" to 160)),
                                                  contentDescription = name, modifier = Modifier.fillMaxSize(), contentScale = ContentScale.Crop
                                              )
                                          }
                                      }
                                      Text(name, color = if (user == name) Color.White else Muted, fontSize = 12.sp, maxLines = 1)
                                  }
                              }
                          }
                          Spacer(Modifier.height(8.dp))
                      }
                      OutlinedTextField(
                          value = user, onValueChange = { user = it }, label = { Text("Username") }, singleLine = true,
                          modifier = Modifier.fillMaxWidth().widthIn(max = 520.dp)
                      )
                      Spacer(Modifier.height(8.dp))
                      OutlinedTextField(
                          value = pw, onValueChange = { pw = it }, label = { Text("Password") }, singleLine = true,
                          visualTransformation = PasswordVisualTransformation(),
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Password),
                          modifier = Modifier.fillMaxWidth().widthIn(max = 520.dp)
                      )
                      Spacer(Modifier.height(16.dp))
                      Button(
                          enabled = !busy && user.isNotBlank(),
                          onClick = {
                              busy = true
                              error = null
                              scope.launch {
                                  try {
                                      Session.add(Jf.login(s, serverName, user.trim(), pw))
                                      onDone()
                                  } catch (e: ApiException) {
                                      error = if (e.code == 401) "Wrong username or password." else e.message
                                  } catch (e: Exception) {
                                      error = e.message
                                  }
                                  busy = false
                              }
                          },
                          modifier = Modifier.fillMaxWidth().widthIn(max = 520.dp).height(48.dp),
                          shape = RoundedCornerShape(6.dp)
                      ) { Text(if (busy) "Signing in…" else "Sign in") }
                      Spacer(Modifier.height(10.dp))
                      OutlinedButton(
                          enabled = qcCode == null,
                          onClick = {
                              error = null
                              scope.launch {
                                  try {
                                      val o = Jf.qcInitiate(s)
                                      val secret = o.optString("Secret")
                                      qcCode = o.optString("Code")
                                      while (true) {
                                          delay(3000)
                                          if (Jf.qcCheck(s, secret)) {
                                              Session.add(Jf.qcAuth(s, serverName, secret))
                                              onDone()
                                              break
                                          }
                                      }
                                  } catch (e: Exception) {
                                      error = "Quick Connect isn't available: ${e.message}"
                                      qcCode = null
                                  }
                              }
                          },
                          modifier = Modifier.fillMaxWidth().widthIn(max = 520.dp).height(48.dp),
                          shape = RoundedCornerShape(6.dp)
                      ) { Text("Sign in with Quick Connect", color = Color.White) }
                      qcCode?.let {
                          Spacer(Modifier.height(14.dp))
                          Text("Your code", color = Muted)
                          Text(it, color = Color.White, fontSize = 34.sp, fontWeight = FontWeight.Black, letterSpacing = 6.sp)
                          Text(
                              "On a device that's already signed in, open Jellyfin → your profile → Quick Connect and enter this code.",
                              color = Muted, fontSize = 13.sp, textAlign = TextAlign.Center
                          )
                      }
                  }
                  error?.let {
                      Spacer(Modifier.height(14.dp))
                      Text(it, color = Color(0xFFE5484D), textAlign = TextAlign.Center)
                  }
                  if (onCancel != null) {
                      Spacer(Modifier.height(20.dp))
                      TextButton(onClick = onCancel) { Text("Cancel", color = Muted) }
                  }
              }
          }
          FEYNOS_EOF

