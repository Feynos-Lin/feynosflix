          fun fmtSize(b: Long): String = when {
              b >= 1L shl 30 -> String.format("%.1f GB", b / 1073741824.0)
              b >= 1L shl 20 -> String.format("%.0f MB", b / 1048576.0)
              else -> "${b / 1024} KB"
          }

          @Composable
          fun DownloadsScreen() {
              var tick by remember { mutableIntStateOf(0) }
              LaunchedEffect(Unit) {
                  while (true) {
                      delay(1500)
                      tick++
                  }
              }
              val list = Downloads.entries
              Column(Modifier.fillMaxSize().background(Bg).statusBarsPadding()) {
                  Text("Downloads", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Color.White, modifier = Modifier.padding(16.dp))
                  if (list.isEmpty()) {
