          // ======================= BROWSE (library, genre, person, my list) =======================

          @Composable
          fun BrowseScreen(title: String, kind: String, arg: String, types: String?) {
              val sorts = listOf(
                  "DateCreated" to "Recently added", "SortName" to "A–Z", "PremiereDate" to "Release date",
                  "CommunityRating" to "Top rated", "Random" to "Surprise me"
              )
              var sort by rememberSaveable { mutableStateOf(if (kind == "person") "PremiereDate" else "DateCreated") }
              var genre by rememberSaveable { mutableStateOf<String?>(null) }
              var sortMenu by remember { mutableStateOf(false) }
              val tick = Session.tick
              val list = remember(kind, arg, sort, genre, tick) { mutableStateListOf<Item>() }
              var total by remember(kind, arg, sort, genre, tick) { mutableIntStateOf(-1) }
              var loading by remember { mutableStateOf(false) }
              var err by remember { mutableStateOf<String?>(null) }
              val grid = rememberLazyGridState()
              val scope = rememberCoroutineScope()
              val genresR by rememberLoad(kind, arg) { if (kind == "lib") Jf.genres(types, arg) else emptyList() }
              val base: Map<String, Any?> = when (kind) {
                  "lib" -> mapOf("ParentId" to arg, "IncludeItemTypes" to types, "Recursive" to (types != null))
                  "genre" -> mapOf("Genres" to arg, "IncludeItemTypes" to types)
                  "person" -> mapOf("PersonIds" to arg, "IncludeItemTypes" to types)
                  else -> mapOf("Filters" to "IsFavorite", "IncludeItemTypes" to types)
              }

              fun loadMore() {
                  if (loading || (total >= 0 && list.size >= total)) return
                  loading = true
                  scope.launch {
                      try {
                          val extra = mutableMapOf<String, Any?>(
                              "SortBy" to "$sort,SortName",
                              "SortOrder" to (if (sort == "SortName") "Ascending" else "Descending"),
                              "StartIndex" to list.size,
                              "Limit" to 60
                          )
                          if (genre != null) extra["Genres"] = genre
                          extra["Fields"] = Jf.CARD
                          val (l, t) = Jf.query(base + extra)
                          list.addAll(l)
                          total = t
                          err = null
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          err = e.message ?: "Couldn't load"
                      } finally {
                          loading = false
                      }
                  }
              }

              LaunchedEffect(kind, arg, sort, genre, tick) {
                  loadMore()
                  snapshotFlow { grid.layoutInfo.visibleItemsInfo.lastOrNull()?.index ?: 0 }
                      .distinctUntilChanged()
                      .collect { last -> if (last >= list.size - 18) loadMore() }
              }

              Column(Modifier.fillMaxSize().background(Bg)) {
                  SubTopBar(title) {
                      Box {
                          IconButton(onClick = { sortMenu = true }) { Icon(Icons.Filled.FilterList, "Sort") }
                          DropdownMenu(expanded = sortMenu, onDismissRequest = { sortMenu = false }) {
                              sorts.forEach { (k, l) ->
                                  DropdownMenuItem(
                                      text = { Text(l) },
                                      onClick = { sort = k; sortMenu = false },
                                      trailingIcon = { if (sort == k) Icon(Icons.Filled.Check, null) }
                                  )
                              }
                          }
                      }
                  }
                  val gl = genresR.orNull() ?: emptyList()
                  if (gl.isNotEmpty()) {
                      LazyRow(contentPadding = PaddingValues(horizontal = 12.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          item { FilterChip(selected = genre == null, onClick = { genre = null }, label = { Text("All") }) }
                          items(gl) { g -> FilterChip(selected = genre == g, onClick = { genre = if (genre == g) null else g }, label = { Text(g) }) }
                      }
                  }
                  when {
                      list.isEmpty() && err != null -> ErrorBox(err ?: "")
                      list.isEmpty() && total == 0 -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("Nothing here yet.", color = Muted)
                      }
                      else -> LazyVerticalGrid(
                          columns = GridCells.Adaptive(110.dp),
                          state = grid,
                          contentPadding = PaddingValues(12.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalArrangement = Arrangement.spacedBy(10.dp),
                          modifier = Modifier.fillMaxSize()
                      ) {
                          items(list.size) { i -> PosterCard(list[i], Modifier.fillMaxWidth()) }
                          if (loading) {
                              item(span = { GridItemSpan(maxLineSpan) }) {
                                  Box(Modifier.fillMaxWidth().padding(16.dp), contentAlignment = Alignment.Center) {
                                      CircularProgressIndicator(Modifier.size(28.dp), color = Purple)
                                  }
                              }
                          }
                      }
                  }
              }
          }

