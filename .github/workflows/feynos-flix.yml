          @Composable
          fun DownloadRow(e: DlEntry, st: DlStatus) {
              val ctx = LocalContext.current
              val done = st.state == DownloadManager.STATUS_SUCCESSFUL
              val failed = st.state == DownloadManager.STATUS_FAILED
              var confirm by remember { mutableStateOf(false) }
              Row(
                  Modifier.fillMaxWidth().clickable(enabled = done) { playOffline(ctx, e.id) }.padding(horizontal = 16.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(Modifier.width(64.dp).aspectRatio(2f / 3f).clip(RoundedCornerShape(6.dp)).background(Surf)) {
                      e.poster?.let { AsyncImage(model = File(it), contentDescription = e.name, modifier = Modifier.fillMaxSize(), contentScale = ContentScale.Crop) }
                  }
                  Column(Modifier.weight(1f).padding(horizontal = 12.dp)) {
                      Text(e.name, maxLines = 2, overflow = TextOverflow.Ellipsis, color = Color.White, fontWeight = FontWeight.SemiBold)
                      e.subtitle?.let { Text(it, color = Muted, fontSize = 12.sp, maxLines = 1) }
                      val status = when {
                          done -> "Downloaded · ${fmtSize(st.total)}"
                          failed -> "Download failed — delete and try again"
                          st.total > 0 -> "Downloading ${st.done * 100 / st.total}% · ${fmtSize(st.done)} of ${fmtSize(st.total)}"
                          else -> "Waiting to download…"
                      }
                      Text(status, color = if (failed) Color(0xFFE5484D) else Muted, fontSize = 12.sp)
                      if (!done && !failed && st.total > 0) ProgressLine(st.done.toFloat() / st.total, Modifier.padding(top = 6.dp))
                  }
                  if (done) Icon(Icons.Filled.PlayCircle, "Play", tint = Color.White, modifier = Modifier.size(32.dp))
                  IconButton(onClick = { confirm = true }) { Icon(Icons.Filled.Delete, "Delete", tint = Muted) }
              }
              if (confirm) {
                  AlertDialog(
                      onDismissRequest = { confirm = false },
                      title = { Text("Delete download?") },
                      text = { Text(e.name) },
                      confirmButton = { TextButton(onClick = { Downloads.delete(e); confirm = false }) { Text("Delete") } },
                      dismissButton = { TextButton(onClick = { confirm = false }) { Text("Cancel") } }
                  )
              }
          }

