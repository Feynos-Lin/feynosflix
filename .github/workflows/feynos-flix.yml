          @Composable
          fun DetailContent(item: Item) {
              val nav = LocalNav.current
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val isSeries = item.type == "Series"
              val conf = LocalConfiguration.current
              val cols = (conf.screenWidthDp / 125).coerceAtLeast(3)

              var fav by remember(item) { mutableStateOf(item.favorite) }
              var watched by remember(item) { mutableStateOf(item.played) }
              val seasonsR by rememberLoad(item.id, cacheKey = "seasons:${item.id}") { if (isSeries) Jf.seasons(item.id) else emptyList() }
              val nextUpR by rememberLoad(item.id) { if (isSeries) Jf.nextUp(item.id, 1, true).firstOrNull() else null }
              val similarR by rememberLoad(item.id, cacheKey = "similar:${item.id}") { Jf.similar(item.id) }
              val seasons = seasonsR.orNull() ?: emptyList()
              val nextUp = nextUpR.orNull()
              var seasonIdx by rememberSaveable(item.id) { mutableIntStateOf(-1) }
              LaunchedEffect(seasons, nextUpR) {
                  if (seasonIdx < 0 && seasons.isNotEmpty() && nextUpR != Res.Loading) {
                      val sid = nextUpR.orNull()?.seasonId
                      val match = seasons.indexOfFirst { it.id == sid }
                      seasonIdx = if (match >= 0) match else seasons.indexOfFirst { (it.index ?: 0) > 0 }.coerceAtLeast(0)
                  }
              }
              val season = seasons.getOrNull(seasonIdx)
              val episodesR by rememberLoad(season?.id, cacheKey = "eps:${season?.id}") { if (season != null) Jf.episodes(item.id, season.id) else emptyList() }
              val tabs = buildList {
                  if (isSeries) add("Episodes")
                  add("More Like This")
                  if (item.people.isNotEmpty()) add("Cast & Crew")
              }
              var tab by rememberSaveable(item.id) { mutableIntStateOf(0) }
              var seasonMenu by remember { mutableStateOf(false) }

              LazyColumn(Modifier.fillMaxSize()) {
                  item { DetailHeader(item) }
                  item {
                      Column(Modifier.padding(horizontal = 16.dp)) {
                          Text(item.name, fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Color.White)
                          if (item.type == "Episode") {
                              Text(
                                  listOfNotNull(item.seriesName, item.episodeLabel).joinToString("  "),
                                  color = Purple, fontSize = 14.sp,
                                  modifier = Modifier.clickable { item.seriesId?.let { nav.navigate("detail/$it") } }.padding(vertical = 2.dp)
                              )
                          }
                          Spacer(Modifier.height(6.dp))
                          MetaRow(item, seasons.size)
                          Spacer(Modifier.height(12.dp))

                          val target: Item? = if (isSeries) nextUp else item
                          val resumeMs = (target?.positionTicks ?: 0L) / 10_000
                          Button(
                              onClick = { if (isSeries) playSmart(ctx, scope, item, nav) else play(ctx, item.id) },
                              modifier = Modifier.fillMaxWidth().height(46.dp),
                              shape = RoundedCornerShape(6.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color.White, contentColor = Color.Black)
                          ) {
                              Icon(Icons.Filled.PlayArrow, null)
                              Spacer(Modifier.width(6.dp))
                              val label = buildString {
                                  append(if (resumeMs > 0) "Resume" else "Play")
                                  if (isSeries && target != null) target.episodeLabel?.let { append(" ").append(it) }
                              }
                              Text(label, fontWeight = FontWeight.Bold)
                          }
                          if (resumeMs > 0 && target != null) {
                              Row(Modifier.padding(top = 6.dp), verticalAlignment = Alignment.CenterVertically) {
                                  ProgressLine(target.progress, Modifier.weight(1f))
                                  Text("  ${runtime(target.runTicks - target.positionTicks)} left", fontSize = 12.sp, color = Muted)
                              }
                              TextButton(onClick = { play(ctx, target.id, 0L) }) {
                                  Icon(Icons.Filled.Replay, null, tint = Color.White)
                                  Spacer(Modifier.width(6.dp))
                                  Text("Start from beginning", color = Color.White)
                              }
                          }
                          if (item.isPlayable) {
                              Spacer(Modifier.height(8.dp))
                              DownloadButton(item)
                          }
                          item.overview?.let {
                              Spacer(Modifier.height(12.dp))
                              Text(it, fontSize = 14.sp, color = Color.White.copy(alpha = 0.9f), lineHeight = 20.sp)
                          }
                          val cast = item.people.filter { it.type == "Actor" }.take(4).joinToString { it.name }
                          if (cast.isNotEmpty()) {
                              Spacer(Modifier.height(8.dp))
                              Text("Starring: $cast", fontSize = 12.sp, color = Muted, maxLines = 2, overflow = TextOverflow.Ellipsis)
                          }
                          val directors = item.people.filter { it.type == "Director" }.take(3).joinToString { it.name }
                          if (directors.isNotEmpty()) Text("Director: $directors", fontSize = 12.sp, color = Muted, maxLines = 1)
                          if (item.genres.isNotEmpty()) Text("Genres: ${item.genres.joinToString()}", fontSize = 12.sp, color = Muted, maxLines = 2)

                          Row(Modifier.padding(vertical = 10.dp), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                              IconLabel(if (fav) Icons.Filled.Check else Icons.Filled.Add, "My List") {
                                  scope.launch {
                                      runCatching { Jf.setFavorite(item.id, !fav) }
                                          .onSuccess { fav = !fav }
                                          .onFailure { toast(ctx, "Couldn't update My List") }
                                  }
                              }
                              IconLabel(if (watched) Icons.Filled.CheckCircle else Icons.Filled.RadioButtonUnchecked, if (watched) "Watched" else "Mark watched") {
                                  scope.launch {
                                      runCatching { Jf.setPlayed(item.id, !watched) }
                                          .onSuccess { watched = !watched; Session.tick++ }
                                          .onFailure { toast(ctx, "Couldn't update") }
                                  }
                              }
                              if (item.trailers.isNotEmpty()) IconLabel(Icons.Filled.Movie, "Trailer") { openUrl(ctx, item.trailers.first()) }
                          }
                      }
                  }
                  item {
                      TabRow(selectedTabIndex = tab.coerceIn(0, tabs.lastIndex), containerColor = Bg, contentColor = Color.White) {
                          tabs.forEachIndexed { i, t ->
                              Tab(selected = tab == i, onClick = { tab = i }, text = { Text(t, maxLines = 1) })
                          }
                      }
                  }
                  when (tabs.getOrNull(tab)) {
                      "Episodes" -> {
                          item {
                              Box(Modifier.padding(horizontal = 16.dp, vertical = 8.dp)) {
                                  OutlinedButton(onClick = { seasonMenu = true }, shape = RoundedCornerShape(6.dp)) {
                                      Text(season?.name ?: "Season", color = Color.White)
                                      Icon(Icons.Filled.ArrowDropDown, null, tint = Color.White)
                                  }
                                  DropdownMenu(expanded = seasonMenu, onDismissRequest = { seasonMenu = false }) {
                                      seasons.forEachIndexed { i, s ->
                                          DropdownMenuItem(text = { Text(s.name) }, onClick = { seasonIdx = i; seasonMenu = false })
                                      }
                                  }
                              }
                          }
                          when (val er = episodesR) {
                              is Res.Ok -> items(er.v) { EpisodeRow(it) }
                              is Res.Err -> item { Text(er.e.message ?: "Couldn't load episodes", color = Muted, modifier = Modifier.padding(16.dp)) }
                              else -> item {
                                  Box(Modifier.fillMaxWidth().padding(24.dp), contentAlignment = Alignment.Center) { CircularProgressIndicator(color = Purple) }
                              }
                          }
                      }
                      "More Like This" -> {
                          val sim = similarR.orNull() ?: emptyList()
                          if (sim.isEmpty() && similarR != Res.Loading) item { Text("Nothing similar found.", color = Muted, modifier = Modifier.padding(16.dp)) }
                          items(sim.chunked(cols)) { row ->
                              Row(Modifier.padding(horizontal = 16.dp, vertical = 4.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  row.forEach { PosterCard(it, Modifier.weight(1f)) }
                                  repeat(cols - row.size) { Spacer(Modifier.weight(1f)) }
                              }
                          }
                      }
                      "Cast & Crew" -> items(item.people) { PersonRow(it) }
                  }
                  item { Spacer(Modifier.navigationBarsPadding().height(24.dp)) }
              }
          }

