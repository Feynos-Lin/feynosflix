          // ======================= Trickplay (scrub thumbnails) =======================

          class Trick(
              val itemId: String, val msId: String, val width: Int, val w: Int, val h: Int,
              val tw: Int, val th: Int, val count: Int, val interval: Int
          ) {
              fun sheetUrl(i: Int): String =
                  Jf.url("/Videos/$itemId/Trickplay/$width/$i.jpg", mapOf("mediaSourceId" to msId, "api_key" to Jf.token))

              companion object {
                  fun from(item: Item): Trick? {
                      val tp = item.j.optJSONObject("Trickplay") ?: return null
                      val msId = tp.keys().asSequence().firstOrNull() ?: return null
                      val res = tp.optJSONObject(msId) ?: return null
                      val widthKey = res.keys().asSequence().mapNotNull { it.toIntOrNull() }.sortedBy { abs(it - 320) }.firstOrNull() ?: return null
                      val o = res.optJSONObject(widthKey.toString()) ?: return null
                      val t = Trick(
                          item.id, msId, widthKey, o.optInt("Width"), o.optInt("Height"), o.optInt("TileWidth"),
                          o.optInt("TileHeight"), o.optInt("ThumbnailCount"), o.optInt("Interval")
                      )
                      return if (t.w > 0 && t.h > 0 && t.tw > 0 && t.th > 0 && t.count > 0 && t.interval > 0) t else null
                  }
              }
          }

          object TrickCache {
              private val map = HashMap<String, Bitmap>()

              suspend fun get(ctx: Context, t: Trick, sheet: Int): Bitmap? {
                  val k = "${t.itemId}/$sheet"
                  map[k]?.let { return it }
                  val req = ImageRequest.Builder(ctx).data(t.sheetUrl(sheet)).allowHardware(false).build()
                  val b = (ctx.imageLoader.execute(req).drawable as? BitmapDrawable)?.bitmap ?: return null
                  if (map.size > 40) map.clear()
                  map[k] = b
                  return b
              }
          }

          @Composable
          fun TrickPreview(t: Trick, posMs: Long) {
              val ctx = LocalContext.current
              val idx = (posMs / t.interval).toInt().coerceIn(0, t.count - 1)
              val per = t.tw * t.th
              val sheet = idx / per
              val within = idx % per
              val bmp by produceState<Bitmap?>(null, sheet) { value = TrickCache.get(ctx, t, sheet) }
              val crop = remember(bmp, within) {
                  val b = bmp
                  if (b == null) null else {
                      val x = (within % t.tw) * t.w
                      val y = (within / t.tw) * t.h
                      if (x + t.w <= b.width && y + t.h <= b.height) Bitmap.createBitmap(b, x, y, t.w, t.h).asImageBitmap() else null
                  }
              }
              if (crop != null) {
                  Image(
                      bitmap = crop, contentDescription = null,
                      modifier = Modifier.width(180.dp).aspectRatio(t.w.toFloat() / t.h).clip(RoundedCornerShape(6.dp))
                          .border(2.dp, Color.White, RoundedCornerShape(6.dp)),
                      contentScale = ContentScale.Crop
                  )
              }
          }

          // ======================= Player logic =======================

          class TrackOpt(val label: String, val group: Tracks.Group?, val index: Int, val selected: Boolean, val serverIndex: Int? = null)

          private val SKIPPABLE = setOf("Intro", "Recap", "Preview", "Commercial")

          class PlayerController(private val ctx: Context, private val scope: CoroutineScope, private val onFinish: () -> Unit) {
              private val http = DefaultHttpDataSource.Factory()
                  .setAllowCrossProtocolRedirects(true)
                  .setUserAgent("FeynosFlix/${BuildConfig.VERSION_NAME}")
                  .setConnectTimeoutMs(20_000)
                  .setReadTimeoutMs(30_000)

              val player: ExoPlayer = ExoPlayer.Builder(ctx, DefaultRenderersFactory(ctx).setEnableDecoderFallback(true))
                  .setMediaSourceFactory(DefaultMediaSourceFactory(DefaultDataSource.Factory(ctx, http)))
                  .setSeekBackIncrementMs(10_000)
                  .setSeekForwardIncrementMs(10_000)
                  .setAudioAttributes(AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MOVIE).build(), true)
                  .setHandleAudioBecomingNoisy(true)
                  .build()

              var item by mutableStateOf<Item?>(null)
                  private set
              var plan by mutableStateOf<StreamPlan?>(null)
                  private set
              var title by mutableStateOf("")
              var subtitle by mutableStateOf("")
              var error by mutableStateOf<String?>(null)
              var segments by mutableStateOf<List<Segment>>(emptyList())
              var next by mutableStateOf<Item?>(null)
              var nextDismissed by mutableStateOf(false)
              var isPlaying by mutableStateOf(false)
              var buffering by mutableStateOf(true)
              var position by mutableLongStateOf(0L)
              var duration by mutableLongStateOf(0L)
              var tracksVersion by mutableIntStateOf(0)
              var speed by mutableFloatStateOf(1f)
              var maxBitrate by mutableIntStateOf(Prefs.maxBitrate)
              var trick by mutableStateOf<Trick?>(null)
              var offline by mutableStateOf<DlEntry?>(null)

              private var lastId: String? = null
              private var audioIndex: Int? = null
              private var subIndex: Int? = null
              private var triedTranscode = false
              private var switching = false
              private var progressJob: Job? = null
              private val skipped = mutableSetOf<Long>()

              init {
                  player.trackSelectionParameters = player.trackSelectionParameters.buildUpon().apply {
                      if (Prefs.audioLang.isNotBlank()) setPreferredAudioLanguage(Prefs.audioLang)
                      if (Prefs.subLang.isNotBlank()) setPreferredTextLanguage(Prefs.subLang)
                      setTrackTypeDisabled(C.TRACK_TYPE_TEXT, !Prefs.subsOn)
                  }.build()

                  player.addListener(object : Player.Listener {
                      override fun onIsPlayingChanged(playing: Boolean) {
                          isPlaying = playing
                          report("progress")
                      }

                      override fun onPlaybackStateChanged(state: Int) {
                          buffering = state == Player.STATE_BUFFERING
                          if (state == Player.STATE_READY && player.duration > 0) duration = player.duration
                          if (state == Player.STATE_ENDED) onEnded()
                      }

                      override fun onTracksChanged(tracks: Tracks) {
                          tracksVersion++
                      }

                      override fun onPlayerError(e: PlaybackException) {
                          onError(e)
                      }
                  })

                  scope.launch {
                      while (isActive) {
                          position = player.currentPosition
                          if (player.duration > 0) duration = player.duration
                          if (Prefs.autoSkipIntro) {
                              currentSkip()?.let { s -> if (skipped.add(s.startMs)) player.seekTo(s.endMs) }
                          }
                          delay(500)
                      }
                  }
              }

              fun currentSkip(): Segment? =
                  segments.firstOrNull { it.type in SKIPPABLE && position >= it.startMs && position < it.endMs - 1000 }

              val showNext: Boolean
                  get() {
                      if (next == null || nextDismissed || offline != null) return false
                      val outro = segments.firstOrNull { it.type == "Outro" }
                      if (outro != null && position >= outro.startMs) return true
                      return duration > 0 && (duration - position) in 1L..30_000L
                  }

              fun load(id: String, startMs: Long) {
                  lastId = id
                  scope.launch {
                      endSession()
                      error = null
                      next = null
                      nextDismissed = false
                      segments = emptyList()
                      trick = null
                      offline = null
                      triedTranscode = false
                      audioIndex = null
                      subIndex = null
                      skipped.clear()
                      try {
                          val it0 = Jf.item(id)
                          item = it0
                          title = if (it0.type == "Episode") it0.seriesName ?: it0.name else it0.name
                          subtitle = if (it0.type == "Episode") listOfNotNull(it0.episodeLabel, it0.name).joinToString("  ")
                          else listOfNotNull(it0.year?.toString(), it0.officialRating).joinToString(" · ")
                          trick = Trick.from(it0)
                          val start = if (startMs >= 0) startMs else it0.positionTicks / 10_000
                          startStream(start, false)
                          launch { segments = Jf.segments(id) }
                          if (it0.type == "Episode") launch { next = runCatching { Jf.nextEpisode(it0) }.getOrNull() }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          error = e.message ?: "Couldn't start playback"
                      } finally {
                          switching = false
                      }
                  }
              }

              fun playOffline(id: String) {
                  val e = Downloads.get(id)
                  if (e == null) {
                      error = "This download is no longer on the device."
                      return
                  }
                  offline = e
                  title = e.seriesName ?: e.name
                  subtitle = if (e.seriesName != null) e.name else (e.subtitle ?: "")
                  player.setMediaItem(MediaItem.fromUri(Uri.fromFile(File(e.path))), e.positionMs)
                  player.prepare()
                  player.playWhenReady = true
              }

              private suspend fun startStream(startMs: Long, forceTranscode: Boolean) {
                  val it0 = item ?: return
                  val old = plan
                  val p = Jf.plan(it0.id, startMs * 10_000, audioIndex, subIndex, old?.mediaSourceId, Prefs.bitrateOf(maxBitrate), forceTranscode)
                  if (old != null && old.method == "Transcode") appScope.launch { Jf.stopEncoding(old.playSessionId) }
                  plan = p
                  http.setDefaultRequestProperties(mapOf("Authorization" to Jf.authHeader(Jf.token)))
                  val builder = MediaItem.Builder().setUri(p.url)
                  if (p.method == "Transcode") builder.setMimeType(MimeTypes.APPLICATION_M3U8)
                  builder.setSubtitleConfigurations(p.subs.map { s ->
                      MediaItem.SubtitleConfiguration.Builder(Uri.parse(s.url))
                          .setMimeType(s.mime)
                          .setLanguage(s.lang)
                          .setLabel(s.label)
                          .build()
                  })
                  player.setMediaItem(builder.build(), startMs)
                  player.prepare()
                  player.playWhenReady = true
                  player.setPlaybackSpeed(speed)
                  report("start")
                  progressJob?.cancel()
                  progressJob = scope.launch {
                      while (isActive) {
                          delay(10_000)
                          report("progress")
                      }
                  }
              }

              private fun report(kind: String) {
                  val p = plan ?: return
                  val it0 = item ?: return
                  val pos = player.currentPosition
                  val paused = !player.isPlaying
                  appScope.launch { Jf.report(kind, it0.id, p.mediaSourceId, p.playSessionId, pos, paused, p.method) }
              }

              private fun endSession() {
                  progressJob?.cancel()
                  offline?.let { Downloads.savePosition(it.id, player.currentPosition) }
                  val p = plan
                  val it0 = item
                  if (p != null && it0 != null) {
                      val pos = player.currentPosition
                      appScope.launch {
                          Jf.report("stopped", it0.id, p.mediaSourceId, p.playSessionId, pos, true, p.method)
                          if (p.method == "Transcode") Jf.stopEncoding(p.playSessionId)
                      }
                  }
                  plan = null
              }

              private fun onEnded() {
                  val off = offline
                  if (off != null) {
                      Downloads.savePosition(off.id, 0L)
                      onFinish()
                      return
                  }
                  if (next != null && Prefs.autoPlayNext) playNext() else {
                      endSession()
                      onFinish()
                  }
              }

              fun playNext() {
                  val n = next ?: return
                  if (switching) return
                  switching = true
                  load(n.id, 0L)
              }

              private fun onError(e: PlaybackException) {
                  val p = plan
                  if (p != null && p.method == "DirectPlay" && !triedTranscode && offline == null) {
                      // Device couldn't decode the original file: ask the server to convert it instead.
                      triedTranscode = true
                      val pos = player.currentPosition
                      scope.launch {
                          try {
                              startStream(pos, true)
                          } catch (ex: Exception) {
                              error = ex.message ?: "Playback failed"
                          }
                      }
                  } else {
                      error = e.errorCodeName + (e.message?.let { ": $it" } ?: "")
                  }
              }

              fun retry() {
                  error = null
                  val off = offline
                  when {
                      off != null -> playOffline(off.id)
                      lastId != null -> load(lastId!!, player.currentPosition.takeIf { it > 0 } ?: -1L)
                  }
              }

              fun seekBy(ms: Long) {
                  val d = player.duration
                  val target = (player.currentPosition + ms).coerceAtLeast(0L)
                  player.seekTo(if (d > 0) target.coerceAtMost(d) else target)
              }

              fun setPlaybackSpeed(s: Float) {
                  speed = s
                  player.setPlaybackSpeed(s)
              }

              private fun restart() {
                  val pos = player.currentPosition
                  scope.launch {
                      try {
                          startStream(pos, triedTranscode)
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          error = e.message ?: "Couldn't switch"
                      }
                  }
              }

              fun setQuality(b: Int) {
                  maxBitrate = b
                  triedTranscode = false
                  restart()
              }

              private fun fmtLabel(f: Format, type: Int): String {
                  val lang = f.language?.takeIf { it != "und" && it.isNotBlank() }?.let { Locale.forLanguageTag(it).displayLanguage }
                  val parts = listOfNotNull(f.label, lang).distinct()
                  var s = parts.joinToString(" – ").ifBlank { if (type == C.TRACK_TYPE_AUDIO) "Audio" else "Subtitles" }
                  if (type == C.TRACK_TYPE_AUDIO && f.channelCount > 0) {
                      s += when (f.channelCount) {
                          1 -> " (Mono)"
                          2 -> " (Stereo)"
                          6 -> " (5.1)"
                          8 -> " (7.1)"
                          else -> " (${f.channelCount}ch)"
                      }
                  }
                  if (f.selectionFlags and C.SELECTION_FLAG_FORCED != 0) s += " [Forced]"
                  return s
              }

              private fun exoOptions(type: Int): List<TrackOpt> =
                  player.currentTracks.groups.filter { it.type == type }.flatMap { g ->
                      (0 until g.length).filter { g.isTrackSupported(it) }.map { i ->
                          TrackOpt(fmtLabel(g.getTrackFormat(i), type), g, i, g.isTrackSelected(i))
                      }
                  }

              private fun serverOptions(type: String, current: Int): List<TrackOpt> {
                  val p = plan ?: return emptyList()
                  return p.source.optJSONArray("MediaStreams").objs().filter { it.optString("Type") == type }.map { s ->
                      val idx = s.optInt("Index")
                      TrackOpt(s.s("DisplayTitle") ?: "$type $idx", null, 0, idx == current, idx)
                  }
              }

              private val transcoding: Boolean get() = plan?.method == "Transcode"

              fun audioOptions(): List<TrackOpt> {
                  val p = plan
                  return if (p != null && transcoding) serverOptions("Audio", audioIndex ?: p.source.optInt("DefaultAudioStreamIndex", -1))
                  else exoOptions(C.TRACK_TYPE_AUDIO)
              }

              fun subtitleOptions(): List<TrackOpt> {
                  val p = plan
                  return if (p != null && transcoding) serverOptions("Subtitle", subIndex ?: p.source.optInt("DefaultSubtitleStreamIndex", -1))
                  else exoOptions(C.TRACK_TYPE_TEXT)
              }

              fun selectAudio(o: TrackOpt) {
                  val si = o.serverIndex
                  if (si != null) {
                      audioIndex = si
                      restart()
                      return
                  }
                  val g = o.group ?: return
                  player.trackSelectionParameters = player.trackSelectionParameters.buildUpon()
                      .setOverrideForType(TrackSelectionOverride(g.mediaTrackGroup, o.index))
                      .build()
              }

              fun selectSubtitle(o: TrackOpt?) {
                  val b = player.trackSelectionParameters.buildUpon()
                  if (o == null) {
                      b.setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)
                      player.trackSelectionParameters = b.build()
                      if (transcoding && subIndex != -1) {
                          subIndex = -1
                          restart()
                      }
                      return
                  }
                  b.setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)
                  val si = o.serverIndex
                  if (si != null) {
                      player.trackSelectionParameters = b.build()
                      subIndex = si
                      restart()
                      return
                  }
                  o.group?.let { b.setOverrideForType(TrackSelectionOverride(it.mediaTrackGroup, o.index)) }
                  player.trackSelectionParameters = b.build()
              }

              fun release() {
                  endSession()
                  player.release()
              }
          }

          // ======================= Activity =======================

          class PlayerActivity : ComponentActivity() {
              private lateinit var ctrl: PlayerController
              private val inPip = mutableStateOf(false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  current?.get()?.let { if (it !== this) it.finish() }
                  current = WeakReference(this)

                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  if (Build.VERSION.SDK_INT >= 28) {
                      window.attributes = window.attributes.apply {
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  hideBars()

                  ctrl = PlayerController(this, lifecycleScope) { finish() }
                  addOnPictureInPictureModeChangedListener { info -> inPip.value = info.isInPictureInPictureMode }

                  val off = intent.getStringExtra("offline")
                  if (off != null) ctrl.playOffline(off)
                  else intent.getStringExtra("id")?.let { ctrl.load(it, intent.getLongExtra("startMs", -1L)) }

                  setContent {
                      FlixTheme {
                          PlayerScreen(ctrl, inPip.value, onBack = { finish() }, onPip = { enterPip() })
                      }
                  }
              }

              private fun hideBars() {
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              private fun enterPip() {
                  val vs = ctrl.player.videoSize
                  var r = if (vs.width > 0 && vs.height > 0) Rational(vs.width, vs.height) else Rational(16, 9)
                  if (r.toFloat() > 2.39f) r = Rational(239, 100)
                  if (r.toFloat() < 1f / 2.39f) r = Rational(100, 239)
                  try {
                      enterPictureInPictureMode(PictureInPictureParams.Builder().setAspectRatio(r).build())
                  } catch (e: Exception) {
                  }
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (ctrl.player.isPlaying) enterPip()
              }

              override fun onStop() {
                  super.onStop()
                  ctrl.player.pause()
                  // Closing the picture-in-picture window stops the activity: end playback.
                  if (isInPictureInPictureMode) finish()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (current?.get() === this) current = null
                  ctrl.release()
              }

              companion object {
                  var current: WeakReference<PlayerActivity>? = null
              }
          }

          // ======================= Player UI =======================

          @Composable
          fun PlayerAction(icon: androidx.compose.ui.graphics.vector.ImageVector, label: String, onClick: () -> Unit) {
              TextButton(onClick = onClick) {
                  Icon(icon, null, tint = Color.White, modifier = Modifier.size(20.dp))
                  Spacer(Modifier.width(6.dp))
                  Text(label, color = Color.White, fontSize = 13.sp)
              }
          }

          @Composable
          fun PlayerScreen(c: PlayerController, pip: Boolean, onBack: () -> Unit, onPip: () -> Unit) {
              val ctx = LocalContext.current
              val act = ctx as Activity
              var controls by remember { mutableStateOf(true) }
              var poke by remember { mutableIntStateOf(0) }
              var resize by remember { mutableIntStateOf(AspectRatioFrameLayout.RESIZE_MODE_FIT) }
              var scrub by remember { mutableStateOf<Float?>(null) }
              var panel by remember { mutableStateOf<String?>(null) }
              var flash by remember { mutableStateOf<String?>(null) }
              var gestureMsg by remember { mutableStateOf<String?>(null) }
              val audio = remember { ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager }
              val maxVol = remember { audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC).coerceAtLeast(1) }
              var vol by remember { mutableFloatStateOf(audio.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat() / maxVol) }
              var bright by remember { mutableFloatStateOf(act.window.attributes.screenBrightness.takeIf { it >= 0f } ?: 0.5f) }

              LaunchedEffect(controls, poke, c.isPlaying, scrub, panel) {
                  if (controls && c.isPlaying && scrub == null && panel == null) {
                      delay(4000)
                      controls = false
                  }
              }
              LaunchedEffect(flash) {
                  if (flash != null) {
                      delay(700)
                      flash = null
                  }
              }
              BackHandler(enabled = panel != null) { panel = null }

              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  AndroidView(
                      factory = { context ->
                          PlayerView(context).apply {
                              useController = false
                              player = c.player
                              setShutterBackgroundColor(android.graphics.Color.BLACK)
                              subtitleView?.apply {
                                  setApplyEmbeddedStyles(true)
                                  setFractionalTextSize(SubtitleView.DEFAULT_TEXT_SIZE_FRACTION * Prefs.subScale)
                                  setStyle(
                                      CaptionStyleCompat(
                                          android.graphics.Color.WHITE, android.graphics.Color.TRANSPARENT,
                                          android.graphics.Color.TRANSPARENT, CaptionStyleCompat.EDGE_TYPE_OUTLINE,
                                          android.graphics.Color.BLACK, null
                                      )
                                  )
                              }
                          }
                      },
                      update = { it.resizeMode = resize },
                      modifier = Modifier.fillMaxSize()
                  )

                  if (!pip) {
                      Box(
                          Modifier.fillMaxSize()
                              .pointerInput(Unit) {
                                  detectTapGestures(
                                      onTap = {
                                          controls = !controls
                                          poke++
                                      },
                                      onDoubleTap = { o ->
                                          if (o.x < size.width / 2f) {
                                              c.seekBy(-10_000)
                                              flash = "«  10s"
                                          } else {
                                              c.seekBy(10_000)
                                              flash = "10s  »"
                                          }
                                      }
                                  )
                              }
                              .pointerInput(Unit) {
                                  detectVerticalDragGestures(
                                      onDragEnd = { gestureMsg = null },
                                      onDragCancel = { gestureMsg = null }
                                  ) { change, dy ->
                                      val frac = -dy / size.height * 1.5f
                                      if (change.position.x < size.width / 2f) {
                                          bright = (bright + frac).coerceIn(0.01f, 1f)
                                          act.window.attributes = act.window.attributes.apply { screenBrightness = bright }
                                          gestureMsg = "Brightness ${(bright * 100).toInt()}%"
                                      } else {
                                          vol = (vol + frac).coerceIn(0f, 1f)
                                          audio.setStreamVolume(AudioManager.STREAM_MUSIC, (vol * maxVol).roundToInt(), 0)
                                          gestureMsg = "Volume ${(vol * 100).toInt()}%"
                                      }
                                  }
                              }
                      )
                  }

                  if (c.buffering && c.error == null) {
                      CircularProgressIndicator(Modifier.align(Alignment.Center).size(56.dp), color = Purple)
                  }
                  flash?.let {
                      Text(
                          it, color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold,
                          modifier = Modifier.align(Alignment.Center).background(Color.Black.copy(alpha = 0.5f), RoundedCornerShape(30.dp))
                              .padding(horizontal = 20.dp, vertical = 10.dp)
                      )
                  }
                  gestureMsg?.let {
                      Text(
                          it, color = Color.White, fontSize = 16.sp,
                          modifier = Modifier.align(Alignment.TopCenter).padding(top = 40.dp)
                              .background(Color.Black.copy(alpha = 0.6f), RoundedCornerShape(20.dp)).padding(horizontal = 16.dp, vertical = 8.dp)
                      )
                  }

                  AnimatedVisibility(
                      visible = controls && !pip && c.error == null,
                      enter = fadeIn(),
                      exit = fadeOut(),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      Box(Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.45f))) {
                          Row(
                              Modifier.fillMaxWidth().align(Alignment.TopCenter).windowInsetsPadding(WindowInsets.displayCutout).padding(8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              IconButton(onClick = onBack) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back", tint = Color.White) }
                              Column(Modifier.weight(1f)) {
                                  Text(c.title, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  if (c.subtitle.isNotBlank()) Text(c.subtitle, color = Muted, fontSize = 13.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                              val fit = resize == AspectRatioFrameLayout.RESIZE_MODE_FIT
                              IconButton(onClick = {
                                  resize = if (fit) AspectRatioFrameLayout.RESIZE_MODE_ZOOM else AspectRatioFrameLayout.RESIZE_MODE_FIT
                                  poke++
                              }) { Icon(if (fit) Icons.Filled.Fullscreen else Icons.Filled.FullscreenExit, "Fill screen", tint = Color.White) }
                              IconButton(onClick = onPip) { Icon(Icons.Filled.PictureInPictureAlt, "Picture in picture", tint = Color.White) }
                          }

                          Row(
                              Modifier.align(Alignment.Center),
                              horizontalArrangement = Arrangement.spacedBy(48.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              IconButton(onClick = { c.seekBy(-10_000); poke++ }, modifier = Modifier.size(60.dp)) {
                                  Icon(Icons.Filled.Replay10, "Back 10 seconds", tint = Color.White, modifier = Modifier.size(42.dp))
                              }
                              IconButton(
                                  onClick = {
                                      if (c.player.isPlaying) c.player.pause() else c.player.play()
                                      poke++
                                  },
                                  modifier = Modifier.size(80.dp)
                              ) {
                                  Icon(if (c.isPlaying) Icons.Filled.Pause else Icons.Filled.PlayArrow, "Play or pause", tint = Color.White, modifier = Modifier.size(68.dp))
                              }
                              IconButton(onClick = { c.seekBy(10_000); poke++ }, modifier = Modifier.size(60.dp)) {
                                  Icon(Icons.Filled.Forward10, "Forward 10 seconds", tint = Color.White, modifier = Modifier.size(42.dp))
                              }
                          }

                          Column(
                              Modifier.fillMaxWidth().align(Alignment.BottomCenter).windowInsetsPadding(WindowInsets.displayCutout)
                                  .padding(horizontal = 16.dp, vertical = 8.dp)
                          ) {
                              val dur = c.duration.coerceAtLeast(1L)
                              val frac = scrub ?: (c.position.toFloat() / dur).coerceIn(0f, 1f)
                              if (scrub != null) {
                                  Row(Modifier.fillMaxWidth()) {
                                      Spacer(Modifier.weight(frac + 0.001f))
                                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                          c.trick?.let { TrickPreview(it, (frac * dur).toLong()) }
                                          Text(clock((frac * dur).toLong()), color = Color.White, fontWeight = FontWeight.Bold)
                                      }
                                      Spacer(Modifier.weight(1.001f - frac))
                                  }
                              }
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Slider(
                                      value = frac,
                                      onValueChange = {
                                          scrub = it
                                          poke++
                                      },
                                      onValueChangeFinished = {
                                          scrub?.let { f -> c.player.seekTo((f * dur).toLong()) }
                                          scrub = null
                                      },
                                      modifier = Modifier.weight(1f),
                                      colors = SliderDefaults.colors(
                                          thumbColor = Purple,
                                          activeTrackColor = Purple,
                                          inactiveTrackColor = Color.White.copy(alpha = 0.3f)
                                      )
                                  )
                                  Spacer(Modifier.width(10.dp))
                                  Text(clock(c.duration - c.position), color = Color.White, fontSize = 13.sp)
                              }
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                                  PlayerAction(Icons.Filled.Speed, "Speed (${c.speed}x)") { panel = "speed" }
                                  PlayerAction(Icons.Filled.Subtitles, "Audio & Subtitles") { panel = "tracks" }
                                  if (c.offline == null) PlayerAction(Icons.Filled.HighQuality, "Quality") { panel = "quality" }
                                  if (c.next != null) PlayerAction(Icons.Filled.SkipNext, "Next Episode") { c.playNext() }
                              }
                          }
                      }
                  }

                  val skip = c.currentSkip()
                  if (!pip && skip != null && c.error == null) {
                      OutlinedButton(
                          onClick = { c.player.seekTo(skip.endMs) },
                          modifier = Modifier.align(Alignment.BottomEnd).padding(end = 28.dp, bottom = if (controls) 130.dp else 36.dp),
                          colors = ButtonDefaults.outlinedButtonColors(containerColor = Color.Black.copy(alpha = 0.6f), contentColor = Color.White),
                          border = BorderStroke(1.dp, Color.White),
                          shape = RoundedCornerShape(6.dp)
                      ) {
                          Text(
                              when (skip.type) {
                                  "Recap" -> "Skip Recap"
                                  "Preview" -> "Skip Preview"
                                  "Commercial" -> "Skip Ad"
                                  else -> "Skip Intro"
                              },
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }

                  if (!pip && c.showNext && c.error == null) {
                      NextEpisodeCard(c, Modifier.align(Alignment.BottomEnd).padding(end = 28.dp, bottom = if (controls) 130.dp else 36.dp))
                  }

                  c.error?.let { msg ->
                      Column(
                          Modifier.align(Alignment.Center).padding(24.dp).widthIn(max = 520.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Icon(Icons.Filled.ErrorOutline, null, tint = Muted, modifier = Modifier.size(48.dp))
                          Spacer(Modifier.height(8.dp))
                          Text("Playback problem", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                          Text(msg, color = Muted, textAlign = TextAlign.Center)
                          Spacer(Modifier.height(14.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                              OutlinedButton(onClick = onBack) { Text("Go back", color = Color.White) }
                              Button(onClick = { c.retry() }) { Text("Retry") }
                          }
                      }
                  }

                  val openPanel = panel
                  if (openPanel != null && !pip) {
                      Box(
                          Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.7f))
                              .pointerInput(Unit) { detectTapGestures { panel = null } }
                      ) {
                          Column(
                              Modifier.align(Alignment.Center).fillMaxWidth(0.85f).fillMaxHeight(0.82f)
                                  .clip(RoundedCornerShape(12.dp)).background(Color(0xFF16161B))
                                  .pointerInput(Unit) { detectTapGestures { } }
                                  .padding(16.dp)
                          ) {
                              when (openPanel) {
                                  "tracks" -> TracksPanel(c, Modifier.weight(1f))
                                  "speed" -> SpeedPanel(c, Modifier.weight(1f)) { panel = null }
                                  else -> QualityPanel(c, Modifier.weight(1f)) { panel = null }
                              }
                              TextButton(onClick = { panel = null }, modifier = Modifier.align(Alignment.End)) { Text("Close") }
                          }
                      }
                  }
              }
          }

          @Composable
          fun TracksPanel(c: PlayerController, modifier: Modifier) {
              val audio = remember(c.tracksVersion, c.plan) { c.audioOptions() }
              val subs = remember(c.tracksVersion, c.plan) { c.subtitleOptions() }
              Row(modifier.fillMaxWidth()) {
                  Column(Modifier.weight(1f).verticalScroll(rememberScrollState())) {
                      Text("Audio", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color.White, modifier = Modifier.padding(8.dp))
                      if (audio.isEmpty()) Text("Default", color = Muted, modifier = Modifier.padding(8.dp))
                      audio.forEach { o -> OptionRow(o.label, o.selected) { c.selectAudio(o) } }
                  }
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f).verticalScroll(rememberScrollState())) {
                      Text("Subtitles", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color.White, modifier = Modifier.padding(8.dp))
                      OptionRow("Off", subs.none { it.selected }) { c.selectSubtitle(null) }
                      subs.forEach { o -> OptionRow(o.label, o.selected) { c.selectSubtitle(o) } }
                  }
              }
          }

          @Composable
          fun SpeedPanel(c: PlayerController, modifier: Modifier, onDone: () -> Unit) {
              Column(modifier.fillMaxWidth().verticalScroll(rememberScrollState())) {
                  Text("Playback speed", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color.White, modifier = Modifier.padding(8.dp))
                  listOf(0.5f, 0.75f, 1f, 1.25f, 1.5f, 2f).forEach { s ->
                      OptionRow(if (s == 1f) "1x (Normal)" else "${s}x", c.speed == s) {
                          c.setPlaybackSpeed(s)
                          onDone()
                      }
                  }
              }
          }

          @Composable
          fun QualityPanel(c: PlayerController, modifier: Modifier, onDone: () -> Unit) {
              Column(modifier.fillMaxWidth().verticalScroll(rememberScrollState())) {
                  Text("Quality", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color.White, modifier = Modifier.padding(8.dp))
                  val method = c.plan?.method
                  Text(
                      if (method == "Transcode") "The server is converting this video for your device." else "Playing the original file (best quality).",
                      color = Muted, fontSize = 13.sp, modifier = Modifier.padding(horizontal = 8.dp)
                  )
                  QUALITIES.forEach { (b, l) ->
                      OptionRow(l, c.maxBitrate == b) {
                          c.setQuality(b)
                          onDone()
                      }
                  }
              }
          }

          @Composable
          fun NextEpisodeCard(c: PlayerController, modifier: Modifier) {
              val n = c.next ?: return
              var count by remember(n.id) { mutableIntStateOf(10) }
              LaunchedEffect(n.id) {
                  if (Prefs.autoPlayNext) {
                      while (count > 0) {
                          delay(1000)
                          count--
                      }
                      c.playNext()
                  }
              }
              Row(
                  modifier.widthIn(max = 380.dp).clip(RoundedCornerShape(10.dp)).background(Color(0xE6141418)).padding(10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(Modifier.width(130.dp).aspectRatio(16f / 9f).clip(RoundedCornerShape(6.dp)).background(Surf)) {
                      AsyncImage(model = Jf.thumb(n, 400), contentDescription = null, modifier = Modifier.fillMaxSize(), contentScale = ContentScale.Crop)
                  }
                  Column(Modifier.padding(start = 10.dp)) {
                      Text("Next Episode", color = Muted, fontSize = 12.sp)
                      Text(
                          listOfNotNull(n.episodeLabel, n.name).joinToString("  "), color = Color.White,
                          maxLines = 2, overflow = TextOverflow.Ellipsis, fontWeight = FontWeight.SemiBold
                      )
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp), verticalAlignment = Alignment.CenterVertically) {
                          Button(
                              onClick = { c.playNext() },
                              colors = ButtonDefaults.buttonColors(containerColor = Color.White, contentColor = Color.Black),
                              contentPadding = PaddingValues(horizontal = 12.dp),
                              shape = RoundedCornerShape(6.dp)
                          ) {
                              Icon(Icons.Filled.PlayArrow, null, modifier = Modifier.size(18.dp))
                              Text(if (Prefs.autoPlayNext) "Play in $count" else "Play", fontSize = 13.sp)
                          }
                          TextButton(onClick = { c.nextDismissed = true }) { Text("Watch credits", color = Color.White, fontSize = 13.sp) }
                      }
                  }
              }
          }
          FEYNOS_EOF

