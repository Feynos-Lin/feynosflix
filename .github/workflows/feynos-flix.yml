          @Composable
          fun Hero(item: Item) {
              val nav = LocalNav.current
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var fav by remember(item.id) { mutableStateOf(item.favorite) }
              val conf = LocalConfiguration.current
