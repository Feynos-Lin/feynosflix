      - name: Write ZoomBox.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/ZoomBox.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import androidx.compose.foundation.gestures.awaitEachGesture
          import androidx.compose.foundation.gestures.awaitFirstDown
          import androidx.compose.foundation.gestures.calculateCentroid
          import androidx.compose.foundation.gestures.calculatePan
          import androidx.compose.foundation.gestures.calculateZoom
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.BoxScope
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.input.pointer.PointerEventPass
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.input.pointer.positionChanged
          import androidx.compose.ui.layout.onSizeChanged
          import androidx.compose.ui.unit.IntSize
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch

          enum class Zone { Left, Center, Right }

          /**
           * Pinch to zoom, drag to pan while zoomed, double-tap (middle of the screen) to zoom in and out.
           * At normal size a one-finger drag is left alone, so a parent pager can still swipe between pages.
           * Taps on the left/right edges report immediately; a tap in the middle waits briefly to rule out a double-tap.
           */
          @Composable
          fun ZoomBox(
              resetKey: Any?,
              onTap: (Zone) -> Unit,
              content: @Composable BoxScope.() -> Unit
          ) {
              var scale by remember(resetKey) { mutableFloatStateOf(1f) }
              var offset by remember(resetKey) { mutableStateOf(Offset.Zero) }
              var size by remember { mutableStateOf(IntSize.Zero) }
              val scope = rememberCoroutineScope()
              val tapHandler by rememberUpdatedState(onTap)
              var pendingTap by remember { mutableStateOf<Job?>(null) }
              var lastTapAt by remember { mutableLongStateOf(0L) }
              var lastTapPos by remember { mutableStateOf(Offset.Zero) }

              fun clamp(o: Offset, s: Float): Offset {
                  val mx = size.width * (s - 1f) / 2f
                  val my = size.height * (s - 1f) / 2f
                  return Offset(o.x.coerceIn(-mx, mx), o.y.coerceIn(-my, my))
              }

              Box(
                  Modifier
                      .fillMaxSize()
                      .onSizeChanged { size = it }
                      .pointerInput(Unit) {
                          awaitEachGesture {
                              val down = awaitFirstDown(requireUnconsumed = false)
                              val downAt = System.currentTimeMillis()
                              var moved = false
                              var multi = false
                              val half = Offset(size.width / 2f, size.height / 2f)
                              do {
                                  val ev = awaitPointerEvent(PointerEventPass.Main)
                                  val pressed = ev.changes.count { it.pressed }
                                  if (pressed >= 2) multi = true
                                  if (multi || scale > 1.01f) {
                                      val z = ev.calculateZoom()
                                      val pan = ev.calculatePan()
                                      val c = ev.calculateCentroid(useCurrent = false) - half
                                      val ns = (scale * z).coerceIn(1f, 5f)
                                      var no = c - (c - offset) * (ns / scale) + pan
                                      no = if (ns <= 1.01f) Offset.Zero else clamp(no, ns)
                                      scale = ns
                                      offset = no
                                      moved = true
                                      ev.changes.forEach { if (it.positionChanged()) it.consume() }
                                  } else {
                                      val d = ev.changes.firstOrNull()?.position?.minus(down.position)?.getDistance() ?: 0f
                                      if (d > viewConfiguration.touchSlop) moved = true
                                  }
                              } while (ev.changes.any { it.pressed })

                              if (!moved && !multi && System.currentTimeMillis() - downAt < 350) {
                                  val x = down.position.x / size.width.coerceAtLeast(1)
                                  val zone = when {
                                      x < 0.28f -> Zone.Left
                                      x > 0.72f -> Zone.Right
                                      else -> Zone.Center
                                  }
                                  if (zone != Zone.Center) {
                                      tapHandler(zone)
                                  } else {
                                      val now = System.currentTimeMillis()
                                      if (now - lastTapAt < 300 && (down.position - lastTapPos).getDistance() < 120f) {
                                          pendingTap?.cancel()
                                          lastTapAt = 0L
                                          if (scale > 1.05f) {
                                              scale = 1f
                                              offset = Offset.Zero
                                          } else {
                                              val c = down.position - half
                                              scale = 2.5f
                                              offset = clamp(c * (1f - 2.5f), 2.5f)
                                          }
                                      } else {
                                          lastTapAt = now
                                          lastTapPos = down.position
                                          pendingTap?.cancel()
                                          pendingTap = scope.launch {
                                              delay(290)
                                              tapHandler(Zone.Center)
                                          }
                                      }
                                  }
                              }
                          }
                      }
              ) {
                  Box(
                      Modifier.fillMaxSize().graphicsLayer {
                          scaleX = scale
                          scaleY = scale
                          translationX = offset.x
                          translationY = offset.y
                      },
                      content = content
                  )
              }
          }
          FEYNOS_EOF

      - name: Signing key (made once, then reused so in-app updates install cleanly)
        run: |
          set -e
          if [ ! -f .github/feynos-flix.jks ]; then
            mkdir -p .github
            keytool -genkeypair -v -keystore .github/feynos-flix.jks -storepass feynosflix -keypass feynosflix \
              -alias feynos -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Feynos Flix"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/feynos-flix.jks
            git commit -m "Add Feynos Flix signing key [skip ci]"
            git push
          fi

      - name: Build APK
        working-directory: flix
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/.github/feynos-flix.jks
          KEYSTORE_PASS: feynosflix
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error: |What went wrong|Could not|Execution failed|Missing class|FAILED" -A2 build.log | head -40 | cut -c1-300 | sed 's/^/::error::/' || true

      - name: Prepare release
        env:
          NOTES_INPUT: ${{ github.event.inputs.notes }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          RUN: ${{ github.run_number }}
        run: |
          N="$NOTES_INPUT"
          [ -z "$N" ] && N="$HEAD_MSG"
          [ -z "$N" ] && N="Build $RUN"
          printf '%s\n' "$N" > release-notes.md
          cp flix/app/build/outputs/apk/release/app-release.apk "FeynosFlix-1.0.$RUN.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Feynos Flix 1.0.${{ github.run_number }}
          body_path: release-notes.md
          files: FeynosFlix-*.apk
          make_latest: true
