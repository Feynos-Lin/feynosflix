          cat > 'flix/app/src/main/java/com/feynos/flix/ComicPages.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.graphics.Bitmap
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.pager.HorizontalPager
          import androidx.compose.foundation.pager.rememberPagerState
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.flow.distinctUntilChanged
          import kotlinx.coroutines.launch

          /** A request from the page slider to jump somewhere; [token] makes repeated jumps to the same page still count. */
          class Jump(val token: Int, val page: Int)

          /** Groups pages for display. With [twoUp], the cover stands alone and wide (already two-page) images are never paired. */
          fun buildSpreads(count: Int, twoUp: Boolean, aspect: (Int) -> Float?): List<IntArray> {
              val out = ArrayList<IntArray>()
              if (!twoUp) {
                  for (i in 0 until count) out.add(intArrayOf(i))
                  return out
              }
              if (count > 0) out.add(intArrayOf(0))
              var i = 1
              while (i < count) {
                  val a = aspect(i)
                  val wideA = a != null && a > 1.1f
                  if (wideA || i + 1 >= count) {
                      out.add(intArrayOf(i))
                      i++
                  } else {
                      val b = aspect(i + 1)
                      if (b != null && b > 1.1f) {
                          out.add(intArrayOf(i))
                          i++
                      } else {
                          out.add(intArrayOf(i, i + 1))
                          i += 2
                      }
                  }
              }
              return out
          }

          @Composable
          fun ComicPageImage(loader: PageLoader, index: Int, maxW: Int, maxH: Int, alignment: Alignment, modifier: Modifier) {
              val bmp by produceState<Bitmap?>(loader.peek(index, maxW, maxH), index, maxW, maxH) {
                  value = loader.load(index, maxW, maxH)
              }
              Box(modifier, contentAlignment = Alignment.Center) {
                  val b = bmp
                  if (b != null) {
                      val img = remember(b) { b.asImageBitmap() }
                      Image(img, contentDescription = null, modifier = Modifier.fillMaxSize(), contentScale = ContentScale.Fit, alignment = alignment)
                  } else {
                      CircularProgressIndicator(color = Purple.copy(alpha = 0.7f), modifier = Modifier.size(32.dp))
                  }
              }
          }

          @Composable
          fun EndPage(title: String, next: NextBook?, onClose: () -> Unit, onOpenNext: (String) -> Unit) {
              Column(
                  Modifier.fillMaxSize().padding(32.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text("The End", color = Color.White, fontSize = 26.sp, fontWeight = FontWeight.Black)
                  Spacer(Modifier.height(6.dp))
                  Text(title, color = Muted, textAlign = TextAlign.Center)
                  Spacer(Modifier.height(24.dp))
                  if (next != null) {
                      Button(onClick = { onOpenNext(next.id) }) { Text("Next: ${next.name()}") }
                      Spacer(Modifier.height(8.dp))
                  }
                  OutlinedButton(onClick = onClose) { Text("Close", color = Color.White) }
              }
          }

          private fun NextBook.name(): String = if (title.length > 36) title.take(35) + "…" else title

          /** Swipeable pages, one or two per screen. [rtl] flips the direction (manga). Reports the first page on screen, or [PageLoader.count] on the end page. */
          @Composable
          fun PagedComic(
              loader: PageLoader,
              title: String,
              spreads: List<IntArray>,
              startPage: Int,
              rtl: Boolean,
              jump: Jump?,
              next: NextBook?,
              onPage: (Int) -> Unit,
              onCenterTap: () -> Unit,
              onClose: () -> Unit,
              onOpenNext: (String) -> Unit
          ) {
              val startSpread = spreads.indexOfFirst { startPage in it }.coerceAtLeast(0)
              val state = rememberPagerState(initialPage = startSpread) { spreads.size + 1 }
              val scope = rememberCoroutineScope()

              LaunchedEffect(state) {
                  snapshotFlow { state.currentPage }.distinctUntilChanged().collect { sp ->
                      onPage(if (sp < spreads.size) spreads[sp][0] else loader.count)
                  }
              }
              LaunchedEffect(jump) {
                  jump?.let { j -> state.scrollToPage(spreads.indexOfFirst { j.page in it }.coerceAtLeast(0)) }
              }

              BoxWithConstraints(Modifier.fillMaxSize().background(Color.Black)) {
                  val density = LocalDensity.current
                  val wPx = with(density) { maxWidth.toPx() }
                  val hPx = with(density) { maxHeight.toPx() }
                  val twoUp = spreads.any { it.size == 2 }
                  val perW = if (twoUp) wPx / 2f else wPx
                  val mw = (perW * 1.6f).toInt().coerceAtLeast(200)
                  val mh = (hPx * 1.6f).toInt().coerceAtLeast(200)

                  LaunchedEffect(state.currentPage, mw, mh) {
                      val cur = state.currentPage
                      for (sp in (cur - 1)..(cur + 2)) {
                          if (sp in spreads.indices && sp != cur) spreads[sp].forEach { loader.load(it, mw, mh) }
                      }
                  }

                  HorizontalPager(
                      state = state,
                      modifier = Modifier.fillMaxSize(),
                      reverseLayout = rtl,
                      beyondViewportPageCount = 1,
                      key = { it }
                  ) { sp ->
                      if (sp >= spreads.size) {
                          EndPage(title, next, onClose, onOpenNext)
                      } else {
                          val pages = spreads[sp]
                          ZoomBox(
                              resetKey = sp,
                              onTap = { zone ->
                                  when (zone) {
                                      Zone.Center -> onCenterTap()
                                      else -> {
                                          val forward = (zone == Zone.Right) != rtl
                                          val target = (state.currentPage + if (forward) 1 else -1).coerceIn(0, spreads.size)
                                          scope.launch { state.animateScrollToPage(target) }
                                      }
                                  }
                              }
                          ) {
                              if (pages.size == 1) {
                                  ComicPageImage(loader, pages[0], mw, mh, Alignment.Center, Modifier.fillMaxSize())
                              } else {
                                  val order = if (rtl) listOf(pages[1], pages[0]) else listOf(pages[0], pages[1])
                                  Row(Modifier.fillMaxSize()) {
                                      ComicPageImage(loader, order[0], mw, mh, Alignment.CenterEnd, Modifier.weight(1f).fillMaxHeight())
                                      ComicPageImage(loader, order[1], mw, mh, Alignment.CenterStart, Modifier.weight(1f).fillMaxHeight())
                                  }
                              }
                          }
                      }
                  }
              }
          }

          /** Continuous vertical scrolling for webtoons and long strips. */
          @Composable
          fun WebtoonComic(
              loader: PageLoader,
              title: String,
              startPage: Int,
              jump: Jump?,
              next: NextBook?,
              onPage: (Int) -> Unit,
              onCenterTap: () -> Unit,
              onClose: () -> Unit,
              onOpenNext: (String) -> Unit
          ) {
              val list = rememberLazyListState(initialFirstVisibleItemIndex = startPage.coerceIn(0, loader.count))
              LaunchedEffect(list) {
                  snapshotFlow { list.firstVisibleItemIndex }.distinctUntilChanged().collect { onPage(it.coerceAtMost(loader.count)) }
              }
              LaunchedEffect(jump) {
                  jump?.let { list.scrollToItem(it.page.coerceIn(0, loader.count)) }
              }

              BoxWithConstraints(Modifier.fillMaxSize().background(Color.Black)) {
                  val wPx = with(LocalDensity.current) { maxWidth.toPx() }
                  val mw = (wPx * 1.5f).toInt().coerceAtLeast(300)

                  LaunchedEffect(list.firstVisibleItemIndex, mw) {
                      val cur = list.firstVisibleItemIndex
                      for (i in (cur + 1)..(cur + 3)) loader.load(i, mw, 0)
                  }

                  LazyColumn(
                      state = list,
                      modifier = Modifier.fillMaxSize().pointerInput(Unit) { detectTapGestures(onTap = { onCenterTap() }) }
                  ) {
                      items(loader.count, key = { it }) { i ->
                          val bmp by produceState<Bitmap?>(loader.peek(i, mw, 0), i, mw) { value = loader.load(i, mw, 0) }
                          val b = bmp
                          if (b != null) {
                              val img = remember(b) { b.asImageBitmap() }
                              Image(img, contentDescription = null, modifier = Modifier.fillMaxWidth(), contentScale = ContentScale.FillWidth)
                          } else {
                              Box(Modifier.fillMaxWidth().aspectRatio(0.7f), contentAlignment = Alignment.Center) {
                                  CircularProgressIndicator(color = Purple.copy(alpha = 0.7f), modifier = Modifier.size(32.dp))
                              }
                          }
                      }
                      item(key = "end") {
                          Box(Modifier.fillParentMaxHeight()) { EndPage(title, next, onClose, onOpenNext) }
                      }
                  }
              }
          }
          FEYNOS_EOF

