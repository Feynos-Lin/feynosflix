          package com.feynos.flix

          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.Dialog
          import kotlinx.coroutines.delay

          @Composable
          fun ComicReader(info: BookInfo, loader: PageLoader, next: NextBook?, onClose: () -> Unit, onOpenNext: (String) -> Unit) {
              val count = loader.count
              val conf = LocalConfiguration.current
              var modePref by remember { mutableIntStateOf(Prefs.comicMode) }
              var spreadPref by remember { mutableIntStateOf(Prefs.comicSpread) }
              val mode = if (modePref >= 0) modePref else if (loader.rtl) 1 else 0
              val rtl = mode == 1
              val twoUp = mode != 2 && when (spreadPref) {
                  1 -> true
                  2 -> false
                  else -> conf.screenWidthDp >= 600 && conf.screenWidthDp > conf.screenHeightDp
              }

              val startPage = remember {
                  if (Books.percent(info.id) >= 0.985f) 0 else info.startA.coerceIn(0, count - 1)
              }
              var page by remember { mutableIntStateOf(startPage) }
              var controls by remember { mutableStateOf(true) }
              var settings by remember { mutableStateOf(false) }
              var jump by remember { mutableStateOf<Jump?>(null) }
              var scrub by remember { mutableStateOf<Float?>(null) }

              // Work out which images are already two-page spreads so they aren't squeezed next to another page.
              var aspects by remember { mutableStateOf<Map<Int, Float?>?>(null) }
              LaunchedEffect(twoUp) {
                  if (twoUp && aspects == null) {
                      val m = HashMap<Int, Float?>()
                      for (i in 0 until count) m[i] = loader.aspect(i)
                      aspects = m
                  }
              }
              val ready = !twoUp || aspects != null
              val spreads = remember(count, twoUp, aspects) { buildSpreads(count, twoUp) { aspects?.get(it) } }

              LaunchedEffect(Unit) {
                  delay(2500)
                  controls = false
              }

              // Remember where you are: on this phone shortly after each page turn, and on the server every so often and on exit.
              val latest by rememberUpdatedState(page)
              var dirty by remember { mutableStateOf(false) }
              fun commit(p: Int, syncServer: Boolean) {
                  val finished = p >= count
                  val shown = if (finished) count - 1 else p
                  val pct = if (finished) 1f else (shown + 1f) / count
                  Books.save(info.id, shown, 0.0, pct, count)
                  if (syncServer && !info.offline) Books.syncToServer(info.id, shown, 0.0, finished)
              }
              LaunchedEffect(page) {
                  dirty = true
                  delay(1200)
                  commit(page, false)
              }
              LaunchedEffect(Unit) {
                  while (true) {
                      delay(30_000)
                      if (dirty) {
                          commit(latest, true)
                          dirty = false
                      }
                  }
              }
              DisposableEffect(Unit) {
                  onDispose { commit(latest, true) }
              }

              Box(Modifier.fillMaxSize().background(Color.Black)) {
                  if (!ready) {
                      Column(Modifier.align(Alignment.Center), horizontalAlignment = Alignment.CenterHorizontally) {
                          CircularProgressIndicator(color = Purple)
                          Spacer(Modifier.height(12.dp))
                          Text("Measuring pages…", color = Muted, fontSize = 13.sp)
                      }
                  } else if (mode == 2) {
                      key(mode) {
                          WebtoonComic(loader, info.title, page, jump, next, { page = it }, { controls = !controls }, onClose, onOpenNext)
                      }
                  } else {
                      key(mode, spreads) {
                          PagedComic(loader, info.title, spreads, page, rtl, jump, next, { page = it }, { controls = !controls }, onClose, onOpenNext)
                      }
                  }

                  AnimatedVisibility(visible = controls, enter = fadeIn(), exit = fadeOut(), modifier = Modifier.align(Alignment.TopCenter)) {
                      Row(
                          Modifier.fillMaxWidth()
                              .background(Brush.verticalGradient(listOf(Color.Black.copy(alpha = 0.85f), Color.Transparent)))
                              .statusBarsPadding().padding(horizontal = 4.dp, vertical = 4.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = onClose) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back", tint = Color.White) }
                          Column(Modifier.weight(1f)) {
                              Text(info.title, color = Color.White, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              info.subtitle?.let { Text(it, color = Muted, fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis) }
                          }
                          IconButton(onClick = { settings = true }) { Icon(Icons.Filled.Settings, "Reading settings", tint = Color.White) }
                      }
                  }

                  AnimatedVisibility(visible = controls && ready, enter = fadeIn(), exit = fadeOut(), modifier = Modifier.align(Alignment.BottomCenter)) {
                      Column(
                          Modifier.fillMaxWidth()
                              .background(Brush.verticalGradient(listOf(Color.Transparent, Color.Black.copy(alpha = 0.85f))))
                              .navigationBarsPadding().padding(horizontal = 20.dp, vertical = 8.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          val shownPage = scrub?.let { (it * (count - 1)).toInt() } ?: page.coerceAtMost(count - 1)
                          Text("${shownPage + 1} / $count", color = Color.White, fontWeight = FontWeight.SemiBold)
                          CompositionLocalProvider(LocalLayoutDirection provides if (rtl) LayoutDirection.Rtl else LayoutDirection.Ltr) {
                              Slider(
                                  value = scrub ?: (page.coerceAtMost(count - 1).toFloat() / (count - 1).coerceAtLeast(1)),
                                  onValueChange = { scrub = it },
                                  onValueChangeFinished = {
                                      scrub?.let { v ->
                                          val target = (v * (count - 1)).toInt().coerceIn(0, count - 1)
                                          page = target
                                          jump = Jump((jump?.token ?: 0) + 1, target)
                                      }
                                      scrub = null
                                  },
                                  colors = SliderDefaults.colors(
                                      thumbColor = Purple, activeTrackColor = Purple, inactiveTrackColor = Color.White.copy(alpha = 0.3f)
                                  )
                              )
                          }
                      }
                  }
              }

              if (settings) {
                  ComicSettings(
                      modePref = modePref,
                      spreadPref = spreadPref,
                      onMode = { modePref = it; Prefs.comicMode = it },
                      onSpread = { spreadPref = it; Prefs.comicSpread = it },
                      onDismiss = { settings = false }
                  )
              }
          }

          @Composable
          fun ComicSettings(modePref: Int, spreadPref: Int, onMode: (Int) -> Unit, onSpread: (Int) -> Unit, onDismiss: () -> Unit) {
              Dialog(onDismissRequest = onDismiss) {
                  Column(
                      Modifier.clip(RoundedCornerShape(14.dp)).background(Color(0xFF16161B)).padding(16.dp).verticalScroll(rememberScrollState())
                  ) {
                      Text("Reading mode", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 18.sp, modifier = Modifier.padding(8.dp))
                      OptionRow("Automatic (manga files read right to left)", modePref == -1) { onMode(-1) }
                      OptionRow("Left to right", modePref == 0) { onMode(0) }
                      OptionRow("Right to left (manga)", modePref == 1) { onMode(1) }
                      OptionRow("Vertical scroll (webtoon)", modePref == 2) { onMode(2) }
                      Text("Two pages at once", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 18.sp, modifier = Modifier.padding(8.dp, 16.dp, 8.dp, 8.dp))
                      OptionRow("Automatic (wide screens)", spreadPref == 0) { onSpread(0) }
                      OptionRow("Always", spreadPref == 1) { onSpread(1) }
                      OptionRow("Never", spreadPref == 2) { onSpread(2) }
                      Text(
                          "Tap the left or right edge to turn the page, the middle to show or hide controls. Pinch or double-tap to zoom.",
                          color = Muted, fontSize = 12.sp, modifier = Modifier.padding(8.dp, 12.dp)
                      )
                      TextButton(onClick = onDismiss, modifier = Modifier.align(Alignment.End)) { Text("Done") }
                  }
              }
          }
          FEYNOS_EOF

      - name: Write ComicSource.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/ComicSource.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.pdf.PdfRenderer
          import android.os.ParcelFileDescriptor
          import android.util.LruCache
          import com.github.junrar.Archive
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.IOException
          import java.io.InputStream
          import java.util.zip.ZipEntry
          import java.util.zip.ZipFile

          /** Something that can hand out comic pages as bitmaps. */
          interface PageSource {
              val count: Int

              /** True when the file says it's a manga (read right to left). */
              val rtl: Boolean

              fun decode(index: Int, maxW: Int, maxH: Int): Bitmap?

              /** Width and height of a page without fully decoding it, or null if unknown. */
              fun size(index: Int): IntArray?

              fun close()
          }

          private val IMAGE_EXT = setOf("jpg", "jpeg", "png", "webp", "gif", "bmp", "avif", "heic")

          fun isImageName(name: String): Boolean {
              val n = name.replace('\\', '/')
              if (n.contains("__MACOSX/") || n.substringAfterLast('/').startsWith(".")) return false
              return n.substringAfterLast('.', "").lowercase() in IMAGE_EXT
          }

          fun natCompare(a0: String, b0: String): Int {
              val a = a0.lowercase()
              val b = b0.lowercase()
              var i = 0
              var j = 0
              while (i < a.length && j < b.length) {
                  val ca = a[i]
                  val cb = b[j]
                  if (ca.isDigit() && cb.isDigit()) {
                      var ei = i
                      while (ei < a.length && a[ei].isDigit()) ei++
                      var ej = j
                      while (ej < b.length && b[ej].isDigit()) ej++
                      val na = a.substring(i, ei).trimStart('0')
                      val nb = b.substring(j, ej).trimStart('0')
                      if (na.length != nb.length) return na.length - nb.length
                      val c = na.compareTo(nb)
                      if (c != 0) return c
                      i = ei
                      j = ej
                  } else {
                      if (ca != cb) return ca.compareTo(cb)
                      i++
                      j++
                  }
              }
              return (a.length - i) - (b.length - j)
          }

          private fun isMangaXml(xml: String?): Boolean =
              xml != null && Regex("<Manga>\\s*YesAndRightToLeft\\s*</Manga>", RegexOption.IGNORE_CASE).containsMatchIn(xml)

          /** Decodes an image, shrinking it by powers of two so it's not much bigger than needed. [maxH] <= 0 means "only the width matters". */
          fun decodeSampled(open: () -> InputStream, maxW: Int, maxH: Int): Bitmap? {
              val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
              open().use { BitmapFactory.decodeStream(it, null, bounds) }
              val w = bounds.outWidth
              val h = bounds.outHeight
              if (w <= 0 || h <= 0) return null
              var s = 1
              while (w / (s * 2) >= maxW && (maxH <= 0 || h / (s * 2) >= maxH)) s *= 2
              while ((w / s).toLong() * (h / s) > 24_000_000L) s *= 2
              val opts = BitmapFactory.Options().apply { inSampleSize = s }
              return open().use { BitmapFactory.decodeStream(it, null, opts) }
          }

          fun imageSize(open: () -> InputStream): IntArray? {
              val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
              open().use { BitmapFactory.decodeStream(it, null, bounds) }
              return if (bounds.outWidth > 0 && bounds.outHeight > 0) intArrayOf(bounds.outWidth, bounds.outHeight) else null
          }

          // ---------- CBZ ----------

          class ZipPages(file: File) : PageSource {
              private val zip = ZipFile(file)
              private val entries: List<ZipEntry>
              override val rtl: Boolean

              init {
                  val all = zip.entries().asSequence().filter { !it.isDirectory }.toList()
                  entries = all.filter { isImageName(it.name) }.sortedWith { x, y -> natCompare(x.name, y.name) }
                  val xml = all.firstOrNull { it.name.endsWith("ComicInfo.xml", ignoreCase = true) }
                      ?.let { e -> zip.getInputStream(e).use { it.readBytes().toString(Charsets.UTF_8) } }
                  rtl = isMangaXml(xml)
              }

              override val count: Int get() = entries.size

              override fun decode(index: Int, maxW: Int, maxH: Int): Bitmap? =
                  decodeSampled({ zip.getInputStream(entries[index]) }, maxW, maxH)

              override fun size(index: Int): IntArray? = imageSize { zip.getInputStream(entries[index]) }

              override fun close() {
                  try {
                      zip.close()
                  } catch (e: Exception) {
                  }
              }
          }

          // ---------- extracted pages (used for CBR) ----------

          class FilePages(private val files: List<File>, override val rtl: Boolean) : PageSource {
              override val count: Int get() = files.size
              override fun decode(index: Int, maxW: Int, maxH: Int): Bitmap? = decodeSampled({ files[index].inputStream() }, maxW, maxH)
              override fun size(index: Int): IntArray? = imageSize { files[index].inputStream() }
              override fun close() {}
          }

          // ---------- PDF ----------

          class PdfPages(file: File) : PageSource {
              private val fd = ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY)
              private val renderer = PdfRenderer(fd)
              override val rtl = false
              override val count: Int get() = renderer.pageCount

              @Synchronized
              override fun decode(index: Int, maxW: Int, maxH: Int): Bitmap? {
                  val page = renderer.openPage(index)
                  try {
                      val scale = maxW.toFloat() / page.width
                      var w = maxW
                      var h = (page.height * scale).toInt().coerceAtLeast(1)
                      while (w.toLong() * h > 24_000_000L) {
                          w /= 2
                          h /= 2
                      }
                      val bmp = Bitmap.createBitmap(w.coerceAtLeast(1), h.coerceAtLeast(1), Bitmap.Config.ARGB_8888)
                      bmp.eraseColor(Color.WHITE)
                      page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                      return bmp
                  } finally {
                      page.close()
                  }
              }

              @Synchronized
              override fun size(index: Int): IntArray? {
                  val page = renderer.openPage(index)
                  return try {
                      intArrayOf(page.width, page.height)
                  } finally {
                      page.close()
                  }
              }

              @Synchronized
              override fun close() {
                  try {
                      renderer.close()
                      fd.close()
                  } catch (e: Exception) {
                  }
              }
          }

          // ---------- opening ----------

          object ComicSources {
              /** Opens a comic file. RAR archives are unpacked into the app's cache first ([onProgress] reports done/total). */
              suspend fun open(file: File, kind: BookKind, bookId: String, onProgress: (Int, Int) -> Unit): PageSource =
                  withContext(Dispatchers.IO) {
                      val src: PageSource = when (kind) {
                          BookKind.ComicZip -> ZipPages(file)
                          BookKind.Pdf -> PdfPages(file)
                          BookKind.ComicRar -> openRar(file, bookId, onProgress)
                          else -> throw IOException(Books.unsupportedMessage(kind))
                      }
                      if (src.count == 0) {
                          src.close()
                          throw IOException("No pages were found in this file.")
                      }
                      src
                  }

              private fun openRar(file: File, bookId: String, onProgress: (Int, Int) -> Unit): PageSource {
                  val root = File(Books.cacheRoot(), "comic").apply { mkdirs() }
                  val out = File(root, bookId)
                  val marker = File(out, ".done")
                  root.listFiles()?.filter { it.isDirectory && it.name != bookId }?.forEach { it.deleteRecursively() }
                  if (!marker.exists()) {
                      out.deleteRecursively()
                      out.mkdirs()
                      try {
                          Archive(file).use { arc ->
                              val headers = arc.fileHeaders.filter { !it.isDirectory }
                              val images = headers.filter { isImageName(it.fileName) }
                                  .sortedWith { x, y -> natCompare(x.fileName.replace('\\', '/'), y.fileName.replace('\\', '/')) }
                              headers.firstOrNull { it.fileName.endsWith("ComicInfo.xml", ignoreCase = true) }?.let { h ->
                                  val bos = ByteArrayOutputStream()
                                  arc.extractFile(h, bos)
                                  File(out, "ComicInfo.xml").writeBytes(bos.toByteArray())
                              }
                              images.forEachIndexed { n, h ->
                                  val ext = h.fileName.substringAfterLast('.', "jpg").lowercase()
                                  File(out, String.format("%05d.%s", n, ext)).outputStream().use { arc.extractFile(h, it) }
                                  onProgress(n + 1, images.size)
                              }
                          }
                          marker.writeText("ok")
                      } catch (e: Exception) {
                          out.deleteRecursively()
                          val msg = e.toString()
                          if (msg.contains("V5", ignoreCase = true) || msg.contains("RAR5", ignoreCase = true)) {
                              throw IOException("This CBR uses the newer RAR5 format, which isn't supported yet. Converting it to CBZ will make it work.")
                          }
                          throw IOException("Couldn't unpack this CBR (${e.message ?: e.javaClass.simpleName}).")
                      }
                  }
                  val files = out.listFiles { f -> f.isFile && isImageName(f.name) }?.sortedBy { it.name } ?: emptyList()
                  val xml = File(out, "ComicInfo.xml").takeIf { it.exists() }?.readText()
                  return FilePages(files, isMangaXml(xml))
              }
          }

          /** Decodes pages off the main thread and remembers the most recent ones. */
          class PageLoader(private val src: PageSource) {
              private val cache = object : LruCache<String, Bitmap>((Runtime.getRuntime().maxMemory() / 6).toInt().coerceAtMost(160 * 1024 * 1024)) {
                  override fun sizeOf(key: String, value: Bitmap): Int = value.byteCount
              }
              private val sizes = HashMap<Int, IntArray?>()

              val count: Int get() = src.count
              val rtl: Boolean get() = src.rtl

              fun peek(i: Int, maxW: Int, maxH: Int): Bitmap? = cache.get("$i/$maxW/$maxH")

              suspend fun load(i: Int, maxW: Int, maxH: Int): Bitmap? {
                  if (i < 0 || i >= src.count) return null
                  val key = "$i/$maxW/$maxH"
                  cache.get(key)?.let { return it }
                  return withContext(Dispatchers.IO) {
                      val bmp = try {
                          src.decode(i, maxW, maxH)
                      } catch (e: Throwable) {
                          null
                      }
                      if (bmp != null) cache.put(key, bmp)
                      bmp
                  }
              }

              suspend fun aspect(i: Int): Float? {
                  synchronized(sizes) { if (sizes.containsKey(i)) return sizes[i]?.let { it[0].toFloat() / it[1] } }
                  val s = withContext(Dispatchers.IO) {
                      try {
                          src.size(i)
                      } catch (e: Throwable) {
                          null
                      }
                  }
                  synchronized(sizes) { sizes[i] = s }
                  return s?.let { it[0].toFloat() / it[1] }
              }

              fun close() {
                  cache.evictAll()
                  src.close()
              }
          }
          FEYNOS_EOF

      - name: Write Downloads.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/Downloads.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.Settings
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.core.content.FileProvider
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException
          import java.util.concurrent.TimeUnit

          class DlEntry(
              val id: String,
              val dmId: Long,
              val name: String,
              val subtitle: String?,
              val seriesName: String?,
              val type: String,
              val path: String,
              val poster: String?,
              val overview: String?,
              var positionMs: Long
          ) {
              fun toJson(): JSONObject = JSONObject()
                  .put("id", id).put("dmId", dmId).put("name", name).put("subtitle", subtitle ?: JSONObject.NULL)
                  .put("seriesName", seriesName ?: JSONObject.NULL).put("type", type).put("path", path)
                  .put("poster", poster ?: JSONObject.NULL).put("overview", overview ?: JSONObject.NULL).put("positionMs", positionMs)

              companion object {
                  fun from(o: JSONObject) = DlEntry(
                      o.getString("id"), o.optLong("dmId"), o.optString("name"), o.s("subtitle"), o.s("seriesName"),
                      o.optString("type"), o.optString("path"), o.s("poster"), o.s("overview"), o.optLong("positionMs")
                  )
              }
          }

          class DlStatus(val state: Int, val done: Long, val total: Long)

          object Downloads {
              private lateinit var ctx: Context
              var entries by mutableStateOf<List<DlEntry>>(emptyList())
                  private set

              private val http = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(60, TimeUnit.SECONDS).build()

              fun init(c: Context) {
                  ctx = c.applicationContext
                  entries = try {
                      val a = JSONArray(sp().getString("list", "[]") ?: "[]")
                      (0 until a.length()).map { DlEntry.from(a.getJSONObject(it)) }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun sp() = ctx.getSharedPreferences("downloads", Context.MODE_PRIVATE)

              private fun save() {
                  val a = JSONArray()
                  entries.forEach { a.put(it.toJson()) }
                  sp().edit().putString("list", a.toString()).apply()
              }

              private fun dm(): DownloadManager = ctx.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager

              fun get(id: String): DlEntry? = entries.firstOrNull { it.id == id }

              suspend fun start(item: Item) {
                  if (get(item.id) != null) return
                  val full = if (item.j.has("MediaSources")) item else Jf.item(item.id)
                  val container = full.j.optJSONArray("MediaSources").objs().firstOrNull()?.s("Container")
                      ?.substringBefore(',')?.ifBlank { null } ?: "mkv"
                  val fileName = "${item.id}.$container"
                  val dir = ctx.getExternalFilesDir(Environment.DIRECTORY_MOVIES) ?: throw IOException("Storage not available")
                  val req = DownloadManager.Request(Uri.parse(Jf.downloadUrl(item.id)))
                      .setTitle(item.name)
                      .setDescription("Feynos Flix")
                      .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                      .setDestinationInExternalFilesDir(ctx, Environment.DIRECTORY_MOVIES, fileName)
                      .addRequestHeader("Authorization", Jf.authHeader(Jf.token))
                  val dmId = dm().enqueue(req)

                  val posterFile = File(ctx.filesDir, "posters/${item.id}.jpg")
                  val posterUrl = Jf.poster(item, 400)
                  val savedPoster = if (posterUrl == null) null else withContext(Dispatchers.IO) {
                      try {
                          posterFile.parentFile?.mkdirs()
                          http.newCall(Request.Builder().url(posterUrl).build()).execute().use { r ->
                              val bytes = r.body?.bytes()
                              if (r.isSuccessful && bytes != null) {
                                  posterFile.writeBytes(bytes)
                                  posterFile.absolutePath
                              } else null
                          }
                      } catch (e: Exception) {
                          null
                      }
                  }

                  val sub = if (item.type == "Episode") listOfNotNull(item.seriesName, item.episodeLabel).joinToString(" · ") else item.year?.toString()
                  entries = entries + DlEntry(
                      item.id, dmId, item.name, sub, item.seriesName, item.type,
                      File(dir, fileName).absolutePath, savedPoster, item.overview, 0L
                  )
                  save()
              }

              fun status(e: DlEntry): DlStatus {
                  try {
                      dm().query(DownloadManager.Query().setFilterById(e.dmId))?.use { c ->
                          if (c.moveToFirst()) {
                              return DlStatus(
                                  c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS)),
                                  c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR)),
                                  c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES))
                              )
                          }
                      }
                  } catch (ex: Exception) {
                  }
                  val f = File(e.path)
                  return if (f.exists() && f.length() > 0) DlStatus(DownloadManager.STATUS_SUCCESSFUL, f.length(), f.length())
                  else DlStatus(DownloadManager.STATUS_FAILED, 0, 0)
              }

              fun delete(e: DlEntry) {
                  try {
                      dm().remove(e.dmId)
                  } catch (ex: Exception) {
                  }
                  File(e.path).delete()
                  e.poster?.let { File(it).delete() }
                  entries = entries.filter { it.id != e.id }
                  save()
              }

              fun savePosition(id: String, ms: Long) {
                  get(id)?.positionMs = ms
                  save()
              }
          }

          class Release(val tag: String, val build: Int, val notes: String, val apkUrl: String)

          object Updater {
              private val http = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(120, TimeUnit.SECONDS).build()

              suspend fun latest(): Release? = withContext(Dispatchers.IO) {
                  if (BuildConfig.GITHUB_REPO.isBlank()) return@withContext null
                  val req = Request.Builder()
                      .url("https://api.github.com/repos/${BuildConfig.GITHUB_REPO}/releases/latest")
                      .header("Accept", "application/vnd.github+json")
                      .build()
                  http.newCall(req).execute().use { r ->
                      if (!r.isSuccessful) return@withContext null
                      val o = JSONObject(r.body?.string() ?: "{}")
                      val tag = o.optString("tag_name")
                      val build = tag.substringAfterLast('.').filter { it.isDigit() }.toIntOrNull() ?: 0
                      val apk = o.optJSONArray("assets").objs().firstOrNull { it.optString("name").endsWith(".apk") }
                          ?.optString("browser_download_url") ?: return@withContext null
                      Release(tag, build, o.optString("body"), apk)
                  }
              }

              fun isNewer(r: Release): Boolean = r.build > BuildConfig.VERSION_CODE

              suspend fun downloadAndInstall(ctx: Context, r: Release, onProgress: (Float) -> Unit) {
                  val file = File(ctx.cacheDir, "updates/FeynosFlix.apk")
                  withContext(Dispatchers.IO) {
                      file.parentFile?.mkdirs()
                      http.newCall(Request.Builder().url(r.apkUrl).build()).execute().use { resp ->
                          if (!resp.isSuccessful) throw IOException("Download failed (${resp.code})")
                          val body = resp.body ?: throw IOException("Empty download")
                          val total = body.contentLength()
                          var read = 0L
                          var lastPct = -1
                          body.byteStream().use { input ->
                              file.outputStream().use { out ->
                                  val buf = ByteArray(64 * 1024)
                                  while (true) {
                                      val n = input.read(buf)
                                      if (n < 0) break
                                      out.write(buf, 0, n)
                                      read += n
                                      if (total > 0) {
                                          val pct = (read * 100 / total).toInt()
                                          if (pct != lastPct) {
                                              lastPct = pct
                                              withContext(Dispatchers.Main) { onProgress(pct / 100f) }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
                  install(ctx, file)
              }

              fun install(ctx: Context, file: File) {
                  if (Build.VERSION.SDK_INT >= 26 && !ctx.packageManager.canRequestPackageInstalls()) {
                      ctx.startActivity(
                          Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${ctx.packageName}"))
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                      toast(ctx, "Allow installs from Feynos Flix, then tap Update again")
                      return
                  }
                  val uri = FileProvider.getUriForFile(ctx, "${ctx.packageName}.files", file)
                  ctx.startActivity(
                      Intent(Intent.ACTION_VIEW)
                          .setDataAndType(uri, "application/vnd.android.package-archive")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }
          }
          FEYNOS_EOF

      - name: Write Epub.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/Epub.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.net.Uri
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.w3c.dom.Element
          import org.w3c.dom.Node
          import java.io.File
          import java.io.IOException
          import java.io.InputStream
          import java.util.zip.ZipFile
          import javax.xml.parsers.DocumentBuilderFactory

          class TocEntry(val title: String, val spine: Int, val fragment: String?, val level: Int)

          class EpubBook(
              private val zip: ZipFile,
              val title: String?,
              val author: String?,
              /** Zip paths of the chapters, in reading order. */
              val spine: List<String>,
              val toc: List<TocEntry>,
              private val mimes: Map<String, String>,
              private val sizes: List<Long>
          ) {
              private val total: Double = sizes.sum().coerceAtLeast(1L).toDouble()
              private val before: List<Double>

              init {
                  var run = 0.0
                  before = sizes.map { s -> run.also { run += s } }
              }

              fun open(path: String): InputStream? {
                  val e = zip.getEntry(path) ?: zip.getEntry(Uri.decode(path)) ?: return null
                  return zip.getInputStream(e)
              }

              fun mimeOf(path: String): String {
                  mimes[path]?.let { return it }
                  return when (path.substringAfterLast('.', "").lowercase()) {
                      "xhtml", "xml" -> "application/xhtml+xml"
                      "html", "htm" -> "text/html"
                      "css" -> "text/css"
                      "jpg", "jpeg" -> "image/jpeg"
                      "png" -> "image/png"
                      "gif" -> "image/gif"
                      "webp" -> "image/webp"
                      "svg" -> "image/svg+xml"
                      "ttf" -> "font/ttf"
                      "otf" -> "font/otf"
                      "woff" -> "font/woff"
                      "woff2" -> "font/woff2"
                      else -> "application/octet-stream"
                  }
              }

              /** How far through the whole book you are, weighting chapters by their size. */
              fun overall(chapter: Int, fraction: Double): Float {
                  val i = chapter.coerceIn(0, spine.size - 1)
                  return ((before[i] + sizes[i] * fraction.coerceIn(0.0, 1.0)) / total).toFloat().coerceIn(0f, 1f)
              }

              /** The inverse of [overall]: which chapter, and how far into it. */
              fun locate(overall: Float): Pair<Int, Double> {
                  val target = overall.coerceIn(0f, 1f) * total
                  var i = before.indexOfLast { it <= target }.coerceAtLeast(0)
                  if (i >= spine.size) i = spine.size - 1
                  val frac = if (sizes[i] > 0) ((target - before[i]) / sizes[i]).coerceIn(0.0, 1.0) else 0.0
                  return i to frac
              }

              fun chapterTitle(index: Int): String? =
                  toc.lastOrNull { it.spine <= index }?.title

              fun close() {
                  try {
                      zip.close()
                  } catch (e: Exception) {
                  }
              }
          }

          object Epubs {
              suspend fun open(file: File): EpubBook = withContext(Dispatchers.IO) { parse(file) }

              private fun doc(zip: ZipFile, path: String): org.w3c.dom.Document {
                  val e = zip.getEntry(path) ?: throw IOException("This EPUB is damaged (missing $path).")
                  val f = DocumentBuilderFactory.newInstance().apply {
                      isNamespaceAware = true
                      isValidating = false
                      try {
                          setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)
                      } catch (ex: Exception) {
                      }
                  }
                  return zip.getInputStream(e).use { f.newDocumentBuilder().parse(it) }
              }

              private fun resolve(base: String, href: String): String {
                  val clean = Uri.decode(href.substringBefore('#').substringBefore('?'))
                  val parts = ArrayList<String>()
                  val all = if (base.isEmpty()) clean else "$base/$clean"
                  for (p in all.split('/')) {
                      when (p) {
                          "", "." -> {}
                          ".." -> if (parts.isNotEmpty()) parts.removeAt(parts.size - 1)
                          else -> parts.add(p)
                      }
                  }
                  return parts.joinToString("/")
              }

              private fun kids(n: Node, name: String): List<Element> {
                  val out = ArrayList<Element>()
                  var c = n.firstChild
                  while (c != null) {
                      if (c is Element && (c.localName ?: c.nodeName).substringAfter(':') == name) out.add(c)
                      c = c.nextSibling
                  }
                  return out
              }

              private fun all(d: org.w3c.dom.Document, name: String): List<Element> {
                  val nl = d.getElementsByTagNameNS("*", name)
                  return (0 until nl.length).mapNotNull { nl.item(it) as? Element }
              }

              private fun text(e: Element?): String = e?.textContent?.replace(Regex("\\s+"), " ")?.trim() ?: ""

              private fun parse(file: File): EpubBook {
                  val zip = ZipFile(file)
                  try {
                      val container = doc(zip, "META-INF/container.xml")
                      val opfPath = all(container, "rootfile").firstOrNull()?.getAttribute("full-path")?.takeIf { it.isNotBlank() }
                          ?: throw IOException("This EPUB is damaged (no package file).")
                      val base = opfPath.substringBeforeLast('/', "")
                      val opf = doc(zip, opfPath)

                      val title = text(all(opf, "title").firstOrNull()).ifBlank { null }
                      val author = text(all(opf, "creator").firstOrNull()).ifBlank { null }

                      class ManifestItem(val href: String, val type: String, val props: String)
                      val manifest = HashMap<String, ManifestItem>()
                      val mimes = HashMap<String, String>()
                      all(opf, "item").forEach { e ->
                          val id = e.getAttribute("id")
                          val href = e.getAttribute("href")
                          if (id.isNotBlank() && href.isNotBlank()) {
                              val path = resolve(base, href)
                              manifest[id] = ManifestItem(path, e.getAttribute("media-type"), e.getAttribute("properties"))
                              if (e.getAttribute("media-type").isNotBlank()) mimes[path] = e.getAttribute("media-type")
                          }
                      }
                      val spineEl = all(opf, "spine").firstOrNull() ?: throw IOException("This EPUB has no reading order.")
                      val spine = kids(spineEl, "itemref").mapNotNull { manifest[it.getAttribute("idref")]?.href }
                          .filter { zip.getEntry(it) != null }
                      if (spine.isEmpty()) throw IOException("This EPUB has no readable chapters.")
                      val sizes = spine.map { zip.getEntry(it)?.size?.takeIf { s -> s > 0 } ?: 1L }
                      val indexOf = HashMap<String, Int>()
                      spine.forEachIndexed { i, p -> indexOf.putIfAbsent(p, i) }

                      val toc = ArrayList<TocEntry>()
                      fun add(title: String, href: String, navBase: String, level: Int) {
                          if (title.isBlank()) return
                          val path = resolve(navBase, href)
                          val idx = indexOf[path] ?: return
                          val frag = href.substringAfter('#', "").ifBlank { null }
                          toc.add(TocEntry(title, idx, frag?.let { Uri.decode(it) }, level))
                      }

                      // EPUB 3 navigation document
                      val navItem = manifest.values.firstOrNull { it.props.split(' ').contains("nav") }
                      if (navItem != null && zip.getEntry(navItem.href) != null) {
                          try {
                              val nd = doc(zip, navItem.href)
                              val navBase = navItem.href.substringBeforeLast('/', "")
                              val navs = all(nd, "nav")
                              val tocNav = navs.firstOrNull { (it.getAttributeNS("http://www.idpf.org/2007/ops", "type") + it.getAttribute("epub:type")).contains("toc") }
                                  ?: navs.firstOrNull()
                              fun walk(ol: Element, level: Int) {
                                  for (li in kids(ol, "li")) {
                                      val a = kids(li, "a").firstOrNull()
                                      val label = kids(li, "span").firstOrNull()
                                      if (a != null) add(text(a), a.getAttribute("href"), navBase, level)
                                      else if (label != null) { /* heading without a link */ }
                                      kids(li, "ol").forEach { walk(it, level + 1) }
                                  }
                              }
                              tocNav?.let { n -> kids(n, "ol").forEach { walk(it, 0) } }
                          } catch (e: Exception) {
                              toc.clear()
                          }
                      }
                      // EPUB 2 NCX
                      if (toc.isEmpty()) {
                          val ncxId = spineEl.getAttribute("toc")
                          val ncx = manifest[ncxId] ?: manifest.values.firstOrNull { it.type == "application/x-dtbncx+xml" }
                          if (ncx != null && zip.getEntry(ncx.href) != null) {
                              try {
                                  val nd = doc(zip, ncx.href)
                                  val navBase = ncx.href.substringBeforeLast('/', "")
                                  fun walk(parent: Element, level: Int) {
                                      for (p in kids(parent, "navPoint")) {
                                          val label = text(kids(p, "navLabel").firstOrNull()?.let { kids(it, "text").firstOrNull() })
                                          val src = kids(p, "content").firstOrNull()?.getAttribute("src") ?: ""
                                          if (src.isNotBlank()) add(label, src, navBase, level)
                                          walk(p, level + 1)
                                      }
                                  }
                                  all(nd, "navMap").firstOrNull()?.let { walk(it, 0) }
                              } catch (e: Exception) {
                                  toc.clear()
                              }
                          }
                      }
                      return EpubBook(zip, title, author, spine, toc, mimes, sizes)
                  } catch (e: Throwable) {
                      try {
                          zip.close()
                      } catch (ex: Exception) {
                      }
                      throw if (e is IOException) e else IOException("Couldn't read this EPUB (${e.message ?: e.javaClass.simpleName}).")
                  }
              }
          }
          FEYNOS_EOF

      - name: Write EpubJs.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/EpubJs.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          /** Small script injected into every chapter: lays the text out in page-sized columns and scrolls between them. */
          object EpubJs {
              val LIB = """
          (function () {
            if (window.fx) return;
            window.fx = {
              W: 0, n: 1, px: 0,
              apply: function (c) {
                var d = document, W = window.innerWidth, H = window.innerHeight;
                var px = Math.round(c.padX * (W > 700 ? 1.6 : 1)), py = c.padY;
                var cw = W - 2 * px, ch = H - 2 * py;
                this.px = px;
                var st = d.getElementById('fx-style');
                if (!st) { st = d.createElement('style'); st.id = 'fx-style'; (d.head || d.documentElement).appendChild(st); }
                var css = '';
                css += 'html{margin:0!important;padding:0!important;overflow:hidden!important;width:' + W + 'px!important;height:' + H + 'px!important;background:' + c.bg + '!important;}';
                css += 'body{margin:0!important;padding:' + py + 'px ' + px + 'px!important;box-sizing:content-box!important;width:' + cw + 'px!important;height:' + ch + 'px!important;column-width:' + cw + 'px!important;column-gap:' + (2 * px) + 'px!important;column-fill:auto!important;overflow:visible!important;background:transparent!important;position:static!important;}';
                css += 'body,body *{color:' + c.fg + '!important;background-color:transparent!important;' + (c.line ? 'line-height:' + c.line + '!important;' : '') + (c.font ? 'font-family:' + c.font + '!important;' : '') + '}';
                css += 'a,a *{color:' + c.link + '!important;}';
                css += 'img,svg,video{max-width:100%!important;max-height:' + ch + 'px!important;object-fit:contain;}';
                css += 'img{display:block;margin-left:auto;margin-right:auto;}';
                css += 'p,li,blockquote{orphans:2;widows:2;}h1,h2,h3{break-after:avoid;}pre{white-space:pre-wrap!important;}';
                st.textContent = css;
                return this.measure();
              },
              measure: function () {
                var W = window.innerWidth, r = document.documentElement, b = document.body;
                var sw = Math.max(r.scrollWidth, b ? b.scrollWidth : 0);
                this.W = W;
                this.n = Math.max(1, Math.round((sw + this.px) / W));
                return this.n;
              },
              go: function (p) { window.scrollTo(Math.max(0, p) * (this.W || window.innerWidth), 0); return p; },
              anchor: function (id) {
                var el = document.getElementById(id) || document.getElementsByName(id)[0];
                if (!el) return 0;
                var r = el.getBoundingClientRect();
                return Math.max(0, Math.floor((r.left + window.scrollX) / (this.W || window.innerWidth)));
              }
            };
          })();
          """.trimIndent()
          }
          FEYNOS_EOF

      - name: Write EpubReader.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/EpubReader.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.annotation.SuppressLint
          import android.view.View
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectHorizontalDragGestures
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.filled.Close
          import androidx.compose.material.icons.filled.TextFields
          import androidx.compose.material.icons.filled.Toc
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.compose.ui.window.Dialog
          import kotlinx.coroutines.delay

          @SuppressLint("SetJavaScriptEnabled")
          @Composable
          fun EpubReader(info: BookInfo, book: EpubBook, next: NextBook?, onClose: () -> Unit, onOpenNext: (String) -> Unit) {
              val st = remember { EpubState(book, info) }
              var controls by remember { mutableStateOf(true) }
              var showToc by remember { mutableStateOf(false) }
              var showSettings by remember { mutableStateOf(false) }
              var scrub by remember { mutableStateOf<Float?>(null) }
              val chrome = Color.White

              LaunchedEffect(Unit) {
                  delay(2500)
                  controls = false
              }

              // Remember where you are: on this phone shortly after each page turn, and on the server every so often and on exit.
              fun commit(syncServer: Boolean) {
                  if (st.loading) return
                  val finished = st.atVeryEnd
                  val frac = st.pg.toDouble() / st.pc.coerceAtLeast(1)
                  val pct = st.overall
                  Books.save(info.id, st.ci, frac, pct, book.spine.size)
                  if (syncServer && !info.offline) Books.syncToServer(info.id, st.ci, frac, finished)
              }
              LaunchedEffect(st.ci, st.pg, st.pc, st.loading) {
                  delay(900)
                  commit(false)
              }
              LaunchedEffect(Unit) {
                  while (true) {
                      delay(30_000)
                      commit(true)
                  }
              }
              DisposableEffect(Unit) {
                  onDispose {
                      commit(true)
                      st.web?.let {
                          it.stopLoading()
                          it.destroy()
                      }
                      st.web = null
                  }
              }

              Box(Modifier.fillMaxSize().background(Color(st.palette.bg))) {
                  AndroidView(
                      modifier = Modifier.fillMaxSize(),
                      factory = { ctx ->
                          WebView(ctx).apply {
                              settings.javaScriptEnabled = true
                              settings.allowFileAccess = false
                              settings.allowContentAccess = false
                              settings.domStorageEnabled = false
                              settings.setSupportZoom(false)
                              settings.builtInZoomControls = false
                              settings.textZoom = st.fontSize
                              isVerticalScrollBarEnabled = false
                              isHorizontalScrollBarEnabled = false
                              overScrollMode = View.OVER_SCROLL_NEVER
                              setBackgroundColor(st.palette.bg)
                              setOnLongClickListener { true }
                              isLongClickable = false
                              webViewClient = object : WebViewClient() {
                                  override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse =
                                      st.serve(request)

                                  override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean = true

                                  override fun onPageFinished(view: WebView, url: String?) {
                                      st.onLoaded(view)
                                  }
                              }
                              addOnLayoutChangeListener { _, left, top, right, bottom, oldLeft, oldTop, oldRight, oldBottom ->
                                  if ((right - left) != (oldRight - oldLeft) || (bottom - top) != (oldBottom - oldTop)) st.reapply()
                              }
                              st.web = this
                              st.start()
                          }
                      }
                  )

                  // Invisible layer on top: taps turn pages, swipes turn pages, the middle shows the controls.
                  Box(
                      Modifier.fillMaxSize()
                          .pointerInput(Unit) {
                              detectTapGestures { o ->
                                  val x = o.x / size.width
                                  when {
                                      x < 0.28f -> st.prev()
                                      x > 0.72f -> st.next()
                                      else -> controls = !controls
                                  }
                              }
                          }
                          .pointerInput(Unit) {
                              var dx = 0f
                              val threshold = 56.dp.toPx()
                              detectHorizontalDragGestures(
                                  onDragStart = { dx = 0f },
                                  onDragEnd = {
                                      if (dx < -threshold) st.next() else if (dx > threshold) st.prev()
                                      dx = 0f
                                  },
                                  onDragCancel = { dx = 0f }
                              ) { change, amount ->
                                  dx += amount
                                  change.consume()
                              }
                          }
                  )

                  if (st.loading) {
                      CircularProgressIndicator(Modifier.align(Alignment.Center), color = Purple)
                  }

                  AnimatedVisibility(visible = controls, enter = fadeIn(), exit = fadeOut(), modifier = Modifier.align(Alignment.TopCenter)) {
                      Row(
                          Modifier.fillMaxWidth()
                              .background(Brush.verticalGradient(listOf(Color.Black.copy(alpha = 0.85f), Color.Transparent)))
                              .statusBarsPadding().padding(horizontal = 4.dp, vertical = 4.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconButton(onClick = onClose) { Icon(Icons.AutoMirrored.Filled.ArrowBack, "Back", tint = chrome) }
                          Column(Modifier.weight(1f)) {
                              Text(book.title ?: info.title, color = chrome, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              (book.chapterTitle(st.ci) ?: book.author)?.let {
                                  Text(it, color = Muted, fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                          }
                          IconButton(onClick = { showToc = true }) { Icon(Icons.Filled.Toc, "Contents", tint = chrome) }
                          IconButton(onClick = { showSettings = true }) { Icon(Icons.Filled.TextFields, "Text settings", tint = chrome) }
                      }
                  }

                  AnimatedVisibility(visible = controls, enter = fadeIn(), exit = fadeOut(), modifier = Modifier.align(Alignment.BottomCenter)) {
                      Column(
                          Modifier.fillMaxWidth()
                              .background(Brush.verticalGradient(listOf(Color.Transparent, Color.Black.copy(alpha = 0.85f))))
                              .navigationBarsPadding().padding(horizontal = 20.dp, vertical = 8.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          val shown = scrub ?: st.overall
                          Text("${(shown * 100).toInt()}%  ·  page ${st.pg + 1} of ${st.pc} in this chapter", color = chrome, fontSize = 13.sp)
                          Slider(
                              value = shown,
                              onValueChange = { scrub = it },
                              onValueChangeFinished = {
                                  scrub?.let { st.seekOverall(it) }
                                  scrub = null
                              },
                              colors = SliderDefaults.colors(thumbColor = Purple, activeTrackColor = Purple, inactiveTrackColor = Color.White.copy(alpha = 0.3f))
                          )
                      }
                  }

                  if (st.atVeryEnd) {
                      var dismissed by remember(st.ci, st.pg) { mutableStateOf(false) }
                      if (!dismissed) {
                          Row(
                              Modifier.align(Alignment.BottomCenter).navigationBarsPadding().padding(bottom = if (controls) 96.dp else 24.dp)
                                  .clip(RoundedCornerShape(12.dp)).background(Color(0xEE141418)).padding(start = 16.dp, top = 6.dp, bottom = 6.dp, end = 4.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text("You've finished this book", color = Color.White, fontSize = 14.sp)
                              if (next != null) {
                                  Spacer(Modifier.width(10.dp))
                                  Button(onClick = { onOpenNext(next.id) }, contentPadding = PaddingValues(horizontal = 12.dp)) {
                                      Text("Next: " + (if (next.title.length > 22) next.title.take(21) + "…" else next.title), fontSize = 13.sp)
                                  }
                              }
                              IconButton(onClick = { dismissed = true }) { Icon(Icons.Filled.Close, "Dismiss", tint = Muted) }
                          }
                      }
                  }
              }

              if (showToc) TocDialog(st) { showToc = false }
              if (showSettings) EpubSettings(st) { showSettings = false }
          }

          @Composable
          fun TocDialog(st: EpubState, onDismiss: () -> Unit) {
              val book = st.book
              val current = book.toc.indexOfLast { it.spine <= st.ci }
              Dialog(onDismissRequest = onDismiss) {
                  Column(Modifier.clip(RoundedCornerShape(14.dp)).background(Color(0xFF16161B)).fillMaxWidth().heightIn(max = 560.dp).padding(vertical = 12.dp)) {
                      Text("Contents", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 18.sp, modifier = Modifier.padding(16.dp, 4.dp, 16.dp, 8.dp))
                      if (book.toc.isEmpty()) {
                          LazyColumn {
                              itemsIndexed(book.spine) { i, _ ->
                                  TocRow("Section ${i + 1}", 0, i == st.ci) {
                                      st.open(i, Target.Start)
                                      onDismiss()
                                  }
                              }
                          }
                      } else {
                          LazyColumn {
                              itemsIndexed(book.toc) { n, e ->
                                  TocRow(e.title, e.level, n == current) {
                                      st.open(e.spine, e.fragment?.let { Target.Anchor(it) } ?: Target.Start)
                                      onDismiss()
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun TocRow(title: String, level: Int, selected: Boolean, onClick: () -> Unit) {
              Text(
                  title,
                  color = if (selected) Purple else Color.White,
                  fontWeight = if (selected) FontWeight.Bold else FontWeight.Normal,
                  maxLines = 2,
                  overflow = TextOverflow.Ellipsis,
                  modifier = Modifier.fillMaxWidth().clickable(onClick = onClick)
                      .padding(start = (16 + level * 16).dp, end = 16.dp, top = 10.dp, bottom = 10.dp)
              )
          }

          @Composable
          private fun ChoiceRow(options: List<String>, selected: Int, onSelect: (Int) -> Unit) {
              Row(Modifier.fillMaxWidth().padding(horizontal = 8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  options.forEachIndexed { i, label ->
                      FilterChip(selected = selected == i, onClick = { onSelect(i) }, label = { Text(label, fontSize = 12.sp, maxLines = 1) })
                  }
              }
          }

          @Composable
          fun EpubSettings(st: EpubState, onDismiss: () -> Unit) {
              Dialog(onDismissRequest = onDismiss) {
                  Column(Modifier.clip(RoundedCornerShape(14.dp)).background(Color(0xFF16161B)).padding(16.dp).verticalScroll(rememberScrollState())) {
                      Text("Theme", color = Color.White, fontWeight = FontWeight.Bold, modifier = Modifier.padding(8.dp))
                      Row(Modifier.padding(horizontal = 8.dp), horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                          PALETTES.forEachIndexed { i, p ->
                              Box(
                                  Modifier.size(48.dp).clip(CircleShape).background(Color(p.bg))
                                      .border(if (st.theme == i) 3.dp else 1.dp, if (st.theme == i) Purple else Muted, CircleShape)
                                      .clickable { st.setTheme(i) },
                                  contentAlignment = Alignment.Center
                              ) { Text("Aa", color = Color(p.fg), fontWeight = FontWeight.Bold) }
                          }
                      }
                      Text("Text size", color = Color.White, fontWeight = FontWeight.Bold, modifier = Modifier.padding(8.dp, 16.dp, 8.dp, 4.dp))
                      Row(Modifier.padding(horizontal = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                          OutlinedButton(onClick = { st.setFontSize(st.fontSize - 10) }) { Text("A−", color = Color.White) }
                          Text("${st.fontSize}%", color = Color.White, modifier = Modifier.width(80.dp), textAlign = androidx.compose.ui.text.style.TextAlign.Center)
                          OutlinedButton(onClick = { st.setFontSize(st.fontSize + 10) }) { Text("A+", color = Color.White) }
                      }
                      Text("Font", color = Color.White, fontWeight = FontWeight.Bold, modifier = Modifier.padding(8.dp, 16.dp, 8.dp, 4.dp))
                      ChoiceRow(EPUB_FONTS, st.font) { st.setFont(it) }
                      Text("Line spacing", color = Color.White, fontWeight = FontWeight.Bold, modifier = Modifier.padding(8.dp, 16.dp, 8.dp, 4.dp))
                      ChoiceRow(EPUB_LINES, st.line) { st.setLine(it) }
                      Text("Margins", color = Color.White, fontWeight = FontWeight.Bold, modifier = Modifier.padding(8.dp, 16.dp, 8.dp, 4.dp))
                      ChoiceRow(EPUB_MARGINS, st.margin) { st.setMargin(it) }
                      TextButton(onClick = onDismiss, modifier = Modifier.align(Alignment.End)) { Text("Done") }
                  }
              }
          }
          FEYNOS_EOF

      - name: Write EpubState.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/EpubState.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.net.Uri
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import androidx.compose.runtime.Stable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import org.json.JSONObject
          import java.io.ByteArrayInputStream

          class Palette(val name: String, val bg: Int, val fg: Int, val link: Int)

          val PALETTES = listOf(
              Palette("White", 0xFFFFFFFF.toInt(), 0xFF1A1A1A.toInt(), 0xFF1565C0.toInt()),
              Palette("Sepia", 0xFFF4ECD8.toInt(), 0xFF3B2F1E.toInt(), 0xFF8A4B08.toInt()),
              Palette("Dark", 0xFF1B1B1F.toInt(), 0xFFD8D8DC.toInt(), 0xFF9FB8FF.toInt()),
              Palette("Black", 0xFF000000.toInt(), 0xFFBDBDBD.toInt(), 0xFF8AB4F8.toInt())
          )

          val EPUB_FONTS = listOf("Book's own", "Serif", "Sans-serif", "Monospace")
          val EPUB_LINES = listOf("Tight", "Normal", "Loose")
          val EPUB_MARGINS = listOf("Narrow", "Medium", "Wide")

          sealed interface Target {
              data object Start : Target
              data object End : Target
              class Frac(val f: Double) : Target
              class Anchor(val id: String) : Target
          }

          private fun hex(c: Int) = String.format("#%06X", c and 0xFFFFFF)

          @Stable
          class EpubState(val book: EpubBook, val info: BookInfo) {
              var ci by mutableIntStateOf(0)
              var pg by mutableIntStateOf(0)
              var pc by mutableIntStateOf(1)
              var loading by mutableStateOf(true)

              var theme by mutableIntStateOf(Prefs.epubTheme.coerceIn(0, PALETTES.lastIndex))
              var fontSize by mutableIntStateOf(Prefs.epubSize)
              var font by mutableIntStateOf(Prefs.epubFont)
              var line by mutableIntStateOf(Prefs.epubLine)
              var margin by mutableIntStateOf(Prefs.epubMargin)

              var web: WebView? = null
              private var target: Target = Target.Start
              private var seq = 0
              private var htmlMode = false
              private var stickEnd = false

              val palette: Palette get() = PALETTES[theme]
              val last: Int get() = book.spine.size - 1
              val atVeryEnd: Boolean get() = ci == last && pg >= pc - 1 && !loading

              val overall: Float
                  get() = if (atVeryEnd) 1f else book.overall(ci, pg.toDouble() / pc.coerceAtLeast(1))

              private fun cfg(): String {
                  val family = when (this.font) {
                      1 -> "Georgia, 'Noto Serif', serif"
                      2 -> "Roboto, 'Noto Sans', sans-serif"
                      3 -> "monospace"
                      else -> ""
                  }
                  return JSONObject()
                      .put("bg", hex(palette.bg)).put("fg", hex(palette.fg)).put("link", hex(palette.link))
                      .put("padX", when (margin) { 0 -> 14; 2 -> 40; else -> 26 })
                      .put("padY", 24)
                      .put("line", when (line) { 0 -> 1.3; 2 -> 1.85; else -> 1.55 })
                      .put("font", family)
                      .toString()
              }

              private fun url(i: Int): String {
                  val b = Uri.Builder().scheme("https").authority("epub.local").encodedPath("/" + Uri.encode(book.spine[i], "/"))
                  if (htmlMode) b.appendQueryParameter("h", "1")
                  return b.build().toString()
              }

              fun start() {
                  val startFinished = Books.percent(info.id) >= 0.985f
                  val i = if (startFinished) 0 else info.startA.coerceIn(0, last)
                  open(i, if (startFinished || (i == 0 && info.startB <= 0.0)) Target.Start else Target.Frac(info.startB))
              }

              fun open(i: Int, t: Target) {
                  ci = i.coerceIn(0, last)
                  target = t
                  stickEnd = t is Target.End
                  loading = true
                  htmlMode = false
                  seq++
                  web?.loadUrl(url(ci))
              }

              fun next() {
                  stickEnd = false
                  if (pg < pc - 1) {
                      pg++
                      go()
                  } else if (ci < last) open(ci + 1, Target.Start)
              }

              fun prev() {
                  stickEnd = false
                  if (pg > 0) {
                      pg--
                      go()
                  } else if (ci > 0) open(ci - 1, Target.End)
              }

              private fun go() {
                  web?.evaluateJavascript("fx.go($pg)", null)
              }

              fun seekOverall(v: Float) {
                  val (i, f) = book.locate(v)
                  if (i == ci && !loading) {
                      pg = (f * pc).toInt().coerceIn(0, pc - 1)
                      go()
                  } else open(i, Target.Frac(f))
              }

              /** Called when a chapter has finished loading: lay it out in pages and go to the wanted spot. */
              fun onLoaded(v: WebView) {
                  val mySeq = seq
                  v.evaluateJavascript("document.getElementsByTagName('parsererror').length") { r ->
                      if (mySeq != seq) return@evaluateJavascript
                      if ((r?.trim('"')?.toIntOrNull() ?: 0) > 0 && !htmlMode) {
                          // Chapter isn't clean XHTML: read it leniently as HTML instead.
                          htmlMode = true
                          v.loadUrl(url(ci))
                          return@evaluateJavascript
                      }
                      v.evaluateJavascript(EpubJs.LIB, null)
                      v.evaluateJavascript("fx.apply(${cfg()})") { r2 ->
                          if (mySeq != seq) return@evaluateJavascript
                          val n = r2?.trim('"')?.toIntOrNull() ?: 1
                          pc = n.coerceAtLeast(1)
                          when (val t = target) {
                              Target.Start -> place(0, mySeq)
                              Target.End -> place(pc - 1, mySeq)
                              is Target.Frac -> place((t.f * pc).toInt(), mySeq)
                              is Target.Anchor -> v.evaluateJavascript("fx.anchor(${JSONObject.quote(t.id)})") { r3 ->
                                  place(r3?.trim('"')?.toIntOrNull() ?: 0, mySeq)
                              }
                          }
                      }
                  }
              }

              private fun place(p: Int, mySeq: Int) {
                  if (mySeq != seq) return
                  pg = p.coerceIn(0, pc - 1)
                  go()
                  loading = false
                  // Pictures and fonts can arrive late and change the page count, so check again shortly after.
                  web?.postDelayed({ remeasure(mySeq) }, 600)
                  web?.postDelayed({ remeasure(mySeq) }, 1800)
              }

              private fun remeasure(mySeq: Int) {
                  val v = web ?: return
                  v.evaluateJavascript("fx.measure()") { r ->
                      if (mySeq != seq) return@evaluateJavascript
                      val n = r?.trim('"')?.toIntOrNull() ?: return@evaluateJavascript
                      if (n != pc) {
                          val frac = pg.toDouble() / pc
                          pc = n
                          pg = if (stickEnd) n - 1 else (frac * n).toInt().coerceIn(0, n - 1)
                          go()
                      }
                  }
              }

              /** Re-flow the current chapter after a setting (or the window size) changed, staying at the same place. */
              fun reapply() {
                  val v = web ?: return
                  if (loading) return
                  val s = seq
                  val frac = pg.toDouble() / pc.coerceAtLeast(1)
                  v.settings.textZoom = fontSize
                  v.setBackgroundColor(palette.bg)
                  v.postDelayed({
                      v.evaluateJavascript("fx.apply(${cfg()})") { r ->
                          if (s != seq) return@evaluateJavascript
                          val n = r?.trim('"')?.toIntOrNull() ?: 1
                          pc = n.coerceAtLeast(1)
                          pg = (frac * pc).toInt().coerceIn(0, pc - 1)
                          go()
                      }
                  }, 150)
              }

              fun setTheme(v: Int) { theme = v; Prefs.epubTheme = v; reapply() }
              fun setFontSize(v: Int) { fontSize = v.coerceIn(70, 220); Prefs.epubSize = fontSize; reapply() }
              fun setFont(v: Int) { font = v; Prefs.epubFont = v; reapply() }
              fun setLine(v: Int) { line = v; Prefs.epubLine = v; reapply() }
              fun setMargin(v: Int) { margin = v; Prefs.epubMargin = v; reapply() }

              fun serve(req: WebResourceRequest): WebResourceResponse {
                  val u = req.url
                  if (u.host != "epub.local") return blank(403)
                  val path = Uri.decode(u.encodedPath ?: "").trimStart('/')
                  val stream = book.open(path) ?: return blank(404)
                  var mime = book.mimeOf(path)
                  if (mime == "application/xhtml+xml" && u.getQueryParameter("h") == "1") mime = "text/html"
                  val enc = if (mime.startsWith("text/") || mime.contains("xml") || mime.contains("javascript")) "utf-8" else null
                  return WebResourceResponse(mime, enc, stream)
              }

              private fun blank(code: Int) = WebResourceResponse(
                  "text/plain", "utf-8", code, if (code == 404) "Not Found" else "Forbidden", emptyMap(), ByteArrayInputStream(ByteArray(0))
              )
          }
          FEYNOS_EOF

      - name: Write Home.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/Home.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.content.Context
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.pulltorefresh.PullToRefreshBox
          import androidx.compose.runtime.*
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException

          class HomeData(
              val hero: Item?,
              val rows: List<RowData>,
              val genres: List<String>,
              val loading: Boolean = false,
              val fromDisk: Boolean = false
          )

          /** Keeps the last home screen in memory and on disk, so the app opens straight onto it. */
          object HomeCache {
              private lateinit var dir: File
              private val mem = HashMap<String, HomeData>()

              fun init(ctx: Context) {
                  dir = File(ctx.cacheDir, "home").apply { mkdirs() }
              }

              private fun key(acc: String, filter: String?) = "$acc|${filter ?: "all"}"
              private fun file(k: String) = File(dir, Integer.toHexString(k.hashCode()) + ".json")

              fun memory(acc: String, filter: String?): HomeData? = mem[key(acc, filter)]

              suspend fun disk(acc: String, filter: String?): HomeData? = withContext(Dispatchers.IO) {
                  try {
                      val f = file(key(acc, filter))
                      if (!f.exists()) null else fromJson(JSONObject(f.readText()))
                  } catch (e: Exception) {
                      null
                  }
              }

              fun put(acc: String, filter: String?, d: HomeData) {
                  val k = key(acc, filter)
                  mem[k] = d
                  val json = toJson(d).toString()
                  appScope.launch(Dispatchers.IO) {
                      try {
                          file(k).writeText(json)
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun toJson(d: HomeData): JSONObject {
                  val rows = JSONArray()
                  d.rows.forEach { r ->
                      val items = JSONArray()
                      r.items.forEach { items.put(it.j) }
                      rows.put(
                          JSONObject().put("key", r.key).put("title", r.title).put("style", r.style.name)
                              .put("more", r.moreRoute ?: JSONObject.NULL).put("items", items)
                      )
                  }
                  val genres = JSONArray()
                  d.genres.forEach { genres.put(it) }
                  return JSONObject().put("hero", d.hero?.j ?: JSONObject.NULL).put("genres", genres).put("rows", rows)
              }

              private fun fromJson(o: JSONObject): HomeData {
                  val hero = o.optJSONObject("hero")?.let { Item(it) }
                  val rows = o.optJSONArray("rows").objs().map { r ->
                      RowData(
                          r.optString("title"),
                          r.optJSONArray("items").objs().map { Item(it) },
                          runCatching { RowStyle.valueOf(r.optString("style")) }.getOrDefault(RowStyle.Poster),
                          r.s("more"),
                          r.optString("key")
                      )
                  }
                  return HomeData(hero, rows, o.optJSONArray("genres").strs(), loading = false, fromDisk = true)
              }
          }

          /**
           * Loads every home row in parallel.
           * First-ever load ([prev] is null): rows appear one by one as they arrive.
           * Refresh: the screen keeps showing [prev] and swaps everything in once, so nothing jumps around.
           */
          suspend fun loadHome(filter: String?, prev: HomeData?, reshuffle: Boolean, emit: (HomeData) -> Unit) {
              val types = filter ?: "Movie,Series"
              val streaming = prev == null
              val rows = HashMap<String, RowData>()
              var latestKeys = listOf<String>()
              var genreKeys = listOf<String>()
              var hero: Item? = if (prev != null && !reshuffle && !prev.fromDisk) prev.hero else null
              var genres: List<String> = if (prev != null && !reshuffle) prev.genres else emptyList()
              var ok = 0
              var failed = 0

              fun ordered(): List<RowData> {
                  val keys = listOf("continue", "next", "fav") + latestKeys.take(1) + listOf("top") + latestKeys.drop(1) + genreKeys
                  return keys.mapNotNull { rows[it] }.filter { it.items.isNotEmpty() }
              }

              fun publish() {
                  if (streaming) emit(HomeData(hero, ordered(), genres, loading = true))
              }

              suspend fun <T> safe(block: suspend () -> T): T? = try {
                  block().also { ok++ }
              } catch (e: CancellationException) {
                  throw e
              } catch (e: Exception) {
                  failed++
                  null
              }

              val card = mapOf("Fields" to Jf.CARD)

              coroutineScope {
                  fun row(key: String, title: String, style: RowStyle, more: String? = null, load: suspend () -> List<Item>) {
                      launch {
                          rows[key] = RowData(title, safe(load) ?: emptyList(), style, more, key)
                          publish()
                      }
                  }

                  if (hero == null) {
                      launch {
                          hero = safe {
                              Jf.query(
                                  mapOf("IncludeItemTypes" to types, "SortBy" to "Random", "Limit" to 1, "ImageTypes" to "Backdrop", "Fields" to "Genres"),
                                  count = false
                              ).first.firstOrNull()
                          }
                          publish()
                      }
                  }
                  row("continue", "Continue Watching", RowStyle.Wide) {
                      Jf.resume().filter {
                          when (filter) {
                              "Movie" -> it.type == "Movie"
                              "Series" -> it.type == "Episode"
                              else -> true
                          }
                      }
                  }
                  if (filter != "Movie") row("next", "Next Up", RowStyle.Wide) { Jf.nextUp(null, 20, false) }
                  row("fav", "My List", RowStyle.Poster, browseRoute("My List", "fav", "_", "Movie,Series,Episode")) {
                      Jf.query(card + mapOf("IncludeItemTypes" to types, "Filters" to "IsFavorite", "SortBy" to "DateCreated", "SortOrder" to "Descending", "Limit" to 30), count = false).first
                  }
                  row("top", "Top 10 on Your Server", RowStyle.Top10) {
                      Jf.query(card + mapOf("IncludeItemTypes" to types, "SortBy" to "CommunityRating,SortName", "SortOrder" to "Descending", "Limit" to 10), count = false).first
                  }
                  launch {
                      val views = (safe { Jf.views() } ?: emptyList()).filter { v ->
                          when (filter) {
                              "Movie" -> v.collectionType == "movies"
                              "Series" -> v.collectionType == "tvshows"
                              else -> v.collectionType in setOf("movies", "tvshows", "homevideos", "mixed", null)
                          }
                      }
                      latestKeys = views.map { "latest:${it.id}" }
                      views.forEach { v ->
                          row("latest:${v.id}", "New in ${v.name}", RowStyle.Poster, browseRoute(v.name, "lib", v.id, libTypes(v))) { Jf.latest(v.id) }
                      }
                  }
                  launch {
                      if (genres.isEmpty()) genres = safe { Jf.genres(types).distinct().shuffled().take(6) } ?: emptyList()
                      genreKeys = genres.map { "genre:$it" }
                      genres.forEach { g ->
                          row("genre:$g", g, RowStyle.Poster, browseRoute(g, "genre", g, types)) {
                              Jf.query(card + mapOf("Genres" to g, "IncludeItemTypes" to types, "SortBy" to "Random", "Limit" to 20), count = false).first
                          }
                      }
                  }
              }

              if (ok == 0 && failed > 0) throw IOException("Couldn't reach your Jellyfin server")
              emit(HomeData(hero, ordered(), genres, loading = false))
          }

          @Composable
          fun HomeSkeleton() {
              val w = LocalConfiguration.current.screenWidthDp
              Column(Modifier.fillMaxSize()) {
                  Box(Modifier.fillMaxWidth().height(if (w >= 600) 380.dp else (w * 1.4f).dp).background(Surf.copy(alpha = 0.5f)))
                  repeat(3) {
                      Box(Modifier.padding(16.dp, 22.dp, 16.dp, 8.dp).width(140.dp).height(16.dp).clip(RoundedCornerShape(4.dp)).background(Surf))
                      Row(Modifier.padding(horizontal = 16.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          repeat(5) { Box(Modifier.width(112.dp).height(168.dp).clip(RoundedCornerShape(6.dp)).background(Surf)) }
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen() {
              var filter by rememberSaveable { mutableStateOf<String?>(null) }
              var cats by remember { mutableStateOf(false) }
              val acc = Session.account?.key ?: ""
              var data by remember(filter, acc) { mutableStateOf(HomeCache.memory(acc, filter)) }
              var error by remember(filter, acc) { mutableStateOf<String?>(null) }
              var refreshing by remember { mutableStateOf(false) }
              var pulls by remember { mutableIntStateOf(0) }
              val tick = Session.tick

              LaunchedEffect(filter, acc, tick, pulls) {
                  if (data == null) data = HomeCache.disk(acc, filter)
                  try {
                      loadHome(filter, data, reshuffle = refreshing) { data = it }
                      data?.let { HomeCache.put(acc, filter, it) }
                      error = null
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      if (data == null) error = e.message ?: "Couldn't load"
                  }
                  refreshing = false
              }

              val listState = rememberLazyListState()
              val solid by remember { derivedStateOf { listState.firstVisibleItemIndex > 0 || listState.firstVisibleItemScrollOffset > 300 } }

              Box(Modifier.fillMaxSize().background(Bg)) {
                  PullToRefreshBox(
                      isRefreshing = refreshing,
                      onRefresh = {
                          refreshing = true
                          pulls++
                      },
                      modifier = Modifier.fillMaxSize()
                  ) {
                      val d = data
                      when {
                          d != null -> LazyColumn(state = listState, modifier = Modifier.fillMaxSize()) {
                              item(key = "hero") {
                                  val hero = d.hero
                                  when {
                                      hero != null -> Hero(hero)
                                      d.loading -> Box(
                                          Modifier.fillMaxWidth()
                                              .height(if (LocalConfiguration.current.screenWidthDp >= 600) 380.dp else (LocalConfiguration.current.screenWidthDp * 1.4f).dp)
                                              .background(Surf.copy(alpha = 0.5f))
                                      )
                                      else -> Spacer(Modifier.statusBarsPadding().height(110.dp))
                                  }
                              }
                              items(d.rows, key = { it.key }) { RowSection(it) }
                              item(key = "end") { Spacer(Modifier.height(24.dp)) }
                          }
                          error != null -> ErrorBox(error ?: "")
                          else -> HomeSkeleton()
                      }
                  }
                  HomeTopBar(filter, solid, onFilter = { filter = it }, onCats = { cats = true })
              }
              if (cats) CategoriesDialog(filter ?: "Movie,Series") { cats = false }
          }
          FEYNOS_EOF

      - name: Write Jellyfin.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/Jellyfin.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.media.MediaCodecList
          import android.os.Build
          import androidx.media3.common.MimeTypes
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.concurrent.TimeUnit

          fun JSONObject.s(k: String): String? =
              if (!has(k) || isNull(k)) null else optString(k).takeIf { it.isNotEmpty() }

          fun JSONArray?.objs(): List<JSONObject> =
              if (this == null) emptyList() else (0 until length()).mapNotNull { optJSONObject(it) }

          fun JSONArray?.strs(): List<String> =
              if (this == null) emptyList() else (0 until length()).map { optString(it) }

          class Person(val id: String, val name: String, val role: String?, val type: String?, val tag: String?)

          class Segment(val type: String, val startMs: Long, val endMs: Long)

          class ExtSub(val url: String, val mime: String, val lang: String?, val label: String)

          class StreamPlan(
              val url: String,
              val method: String,
              val mediaSourceId: String,
              val playSessionId: String?,
              val source: JSONObject,
              val subs: List<ExtSub>
          )

          class ApiException(val code: Int, msg: String) : IOException(msg)

          class Item(val j: JSONObject) {
              val id: String = j.optString("Id")
              val name: String = j.s("Name") ?: ""
              val type: String = j.s("Type") ?: ""
              val overview: String? = j.s("Overview")
              val year: Int? = j.optInt("ProductionYear", 0).takeIf { it > 0 }
              val runTicks: Long = j.optLong("RunTimeTicks", 0L)
              val rating: Double? = j.optDouble("CommunityRating", Double.NaN).takeUnless { it.isNaN() }
              val officialRating: String? = j.s("OfficialRating")
              val seriesId: String? = j.s("SeriesId")
              val seriesName: String? = j.s("SeriesName")
              val seasonId: String? = j.s("SeasonId")
              val index: Int? = if (j.has("IndexNumber") && !j.isNull("IndexNumber")) j.optInt("IndexNumber") else null
              val parentIndex: Int? = if (j.has("ParentIndexNumber") && !j.isNull("ParentIndexNumber")) j.optInt("ParentIndexNumber") else null
              val imageTags: JSONObject? = j.optJSONObject("ImageTags")
              val primaryTag: String? = imageTags?.s("Primary")
              val backdropTags: List<String> = j.optJSONArray("BackdropImageTags").strs()
              private val ud: JSONObject? = j.optJSONObject("UserData")
              val positionTicks: Long = ud?.optLong("PlaybackPositionTicks", 0L) ?: 0L
              val played: Boolean = ud?.optBoolean("Played") ?: false
              val favorite: Boolean = ud?.optBoolean("IsFavorite") ?: false
              val playedPct: Double = ud?.optDouble("PlayedPercentage", 0.0)?.takeUnless { it.isNaN() } ?: 0.0
              val unplayed: Int = ud?.optInt("UnplayedItemCount", 0) ?: 0
              val genres: List<String> = j.optJSONArray("Genres").strs()
              val people: List<Person> = j.optJSONArray("People").objs().map {
                  Person(it.optString("Id"), it.optString("Name"), it.s("Role"), it.s("Type"), it.s("PrimaryImageTag"))
              }
              val collectionType: String? = j.s("CollectionType")
              val mediaType: String? = j.s("MediaType")
              val trailers: List<String> = j.optJSONArray("RemoteTrailers").objs().mapNotNull { it.s("Url") }
              val dateCreated: String? = j.s("DateCreated")
              val parentId: String? = j.s("ParentId")
              val lastPlayedAt: Long = Books.parseDate(ud?.s("LastPlayedDate"))
              val isBook: Boolean = type == "Book" || mediaType == "Book"
              val videoHeight: Int = (j.optJSONArray("MediaStreams").objs() +
                  j.optJSONArray("MediaSources").objs().flatMap { it.optJSONArray("MediaStreams").objs() })
                  .firstOrNull { it.optString("Type") == "Video" }?.optInt("Height", 0) ?: 0

              val isPlayable: Boolean
                  get() = type in setOf("Movie", "Episode", "Video", "MusicVideo", "Trailer") ||
                      (mediaType == "Video" && !j.optBoolean("IsFolder"))

              val progress: Float
                  get() = if (runTicks > 0 && positionTicks > 0) (positionTicks.toDouble() / runTicks).toFloat().coerceIn(0f, 1f)
                  else (playedPct / 100.0).toFloat().coerceIn(0f, 1f)

              val episodeLabel: String?
                  get() = if (type != "Episode") null else buildString {
                      if (parentIndex != null) append("S").append(parentIndex)
                      if (index != null) append(if (parentIndex != null) ":E" else "E").append(index)
                  }.ifEmpty { null }
          }

          object Jf {
              private const val LIGHT = "Overview,Genres,PrimaryImageAspectRatio,SeriesPrimaryImageTag,ChildCount,DateCreated"
              /** Just enough for a poster or thumbnail card — keeps list responses small and fast. */
              const val CARD = "PrimaryImageAspectRatio"
              private val JSON_TYPE = "application/json".toMediaType()

              private val http = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .build()

              val acc: Account get() = Session.account ?: throw IOException("Not signed in")
              val server: String get() = acc.server
              val uid: String get() = acc.userId
              val token: String get() = acc.token

              fun authHeader(token: String?): String {
                  val dev = Build.MODEL.replace("\"", "").ifBlank { "Android" }
                  val base = "MediaBrowser Client=\"Feynos Flix\", Device=\"$dev\", DeviceId=\"${Prefs.deviceId}\", Version=\"${BuildConfig.VERSION_NAME}\""
                  return if (token != null) "$base, Token=\"$token\"" else base
              }

              fun buildUrl(base: String, path: String, q: Map<String, Any?> = emptyMap()): String {
                  val b = (base.trimEnd('/') + path).toHttpUrl().newBuilder()
                  q.forEach { (k, v) -> if (v != null) b.addQueryParameter(k, v.toString()) }
                  return b.build().toString()
              }

              fun url(path: String, q: Map<String, Any?> = emptyMap()): String = buildUrl(server, path, q)

              suspend fun raw(method: String, url: String, body: Any? = null, token: String? = Session.account?.token): String =
                  withContext(Dispatchers.IO) {
                      val rb: RequestBody? = when {
                          body != null -> body.toString().toRequestBody(JSON_TYPE)
                          method == "POST" -> "".toRequestBody(JSON_TYPE)
                          else -> null
                      }
                      val req = Request.Builder()
                          .url(url)
                          .header("Authorization", authHeader(token))
                          .header("Accept", "application/json")
                          .method(method, rb)
                          .build()
                      http.newCall(req).execute().use { r ->
                          val text = r.body?.string() ?: ""
                          if (!r.isSuccessful) throw ApiException(r.code, "Server returned ${r.code}")
                          text
                      }
                  }

              suspend fun get(path: String, q: Map<String, Any?> = emptyMap()): JSONObject =
                  JSONObject(raw("GET", url(path, q)).ifBlank { "{}" })

              suspend fun getArr(path: String, q: Map<String, Any?> = emptyMap()): JSONArray =
                  JSONArray(raw("GET", url(path, q)).ifBlank { "[]" })

              suspend fun post(path: String, q: Map<String, Any?> = emptyMap(), body: Any? = null): String =
                  raw("POST", url(path, q), body)

              suspend fun delete(path: String, q: Map<String, Any?> = emptyMap()): String = raw("DELETE", url(path, q))

              private fun items(o: JSONObject): List<Item> = o.optJSONArray("Items").objs().map { Item(it) }

              // ---------- Server & sign in ----------

              suspend fun findServer(input: String): Pair<String, JSONObject> {
                  val t = input.trim().trimEnd('/')
                  val candidates = if (t.startsWith("http://") || t.startsWith("https://")) listOf(t)
                  else listOf("https://$t", "http://$t", "http://$t:8096")
                  var last: Exception? = null
                  for (c in candidates) {
                      try {
                          val info = JSONObject(raw("GET", buildUrl(c, "/System/Info/Public"), token = null))
                          if (info.has("Id") || info.has("ServerName")) return c to info
                      } catch (e: Exception) {
                          last = e
                      }
                  }
                  throw IOException("Couldn't reach a Jellyfin server at \"$input\"", last)
              }

              suspend fun publicUsers(server: String): List<JSONObject> = try {
                  JSONArray(raw("GET", buildUrl(server, "/Users/Public"), token = null)).objs()
              } catch (e: Exception) {
                  emptyList()
              }

              private fun toAccount(server: String, serverName: String, o: JSONObject): Account {
                  val u = o.getJSONObject("User")
                  return Account(server, u.getString("Id"), u.optString("Name"), o.getString("AccessToken"), serverName, u.s("PrimaryImageTag"))
              }

              suspend fun login(server: String, serverName: String, user: String, pw: String): Account {
                  val body = JSONObject().put("Username", user).put("Pw", pw)
                  return toAccount(server, serverName, JSONObject(raw("POST", buildUrl(server, "/Users/AuthenticateByName"), body, token = null)))
              }

              suspend fun qcInitiate(server: String): JSONObject = try {
                  JSONObject(raw("POST", buildUrl(server, "/QuickConnect/Initiate"), token = null))
              } catch (e: ApiException) {
                  JSONObject(raw("GET", buildUrl(server, "/QuickConnect/Initiate"), token = null))
              }

              suspend fun qcCheck(server: String, secret: String): Boolean =
                  JSONObject(raw("GET", buildUrl(server, "/QuickConnect/Connect", mapOf("secret" to secret)), token = null))
                      .optBoolean("Authenticated")

              suspend fun qcAuth(server: String, serverName: String, secret: String): Account {
                  val body = JSONObject().put("Secret", secret)
                  return toAccount(server, serverName, JSONObject(raw("POST", buildUrl(server, "/Users/AuthenticateWithQuickConnect"), body, token = null)))
              }

              suspend fun logoutAccount(a: Account) {
                  try {
                      raw("POST", buildUrl(a.server, "/Sessions/Logout"), token = a.token)
                  } catch (e: Exception) {
                  }
              }

              // ---------- Library ----------

              suspend fun views(): List<Item> = items(get("/UserViews", mapOf("userId" to uid)))

              suspend fun query(params: Map<String, Any?>, count: Boolean = true): Pair<List<Item>, Int> {
                  val base = mapOf<String, Any?>(
                      "userId" to uid, "Recursive" to true, "Fields" to LIGHT, "EnableTotalRecordCount" to count,
                      "ImageTypeLimit" to 1, "EnableImageTypes" to "Primary,Backdrop,Thumb,Logo"
                  )
                  val o = get("/Items", base + params)
                  return items(o) to o.optInt("TotalRecordCount")
              }

              suspend fun latest(parentId: String?, limit: Int = 24): List<Item> =
                  getArr("/Items/Latest", mapOf("userId" to uid, "ParentId" to parentId, "Limit" to limit, "Fields" to CARD, "GroupItems" to true, "ImageTypeLimit" to 1))
                      .objs().map { Item(it) }

              suspend fun resume(limit: Int = 20): List<Item> = items(
                  get("/UserItems/Resume", mapOf("userId" to uid, "Limit" to limit, "MediaTypes" to "Video", "Fields" to CARD, "ImageTypeLimit" to 1, "EnableImageTypes" to "Primary,Backdrop,Thumb"))
              )

              suspend fun nextUp(seriesId: String?, limit: Int, resumable: Boolean): List<Item> = items(
                  get("/Shows/NextUp", mapOf("userId" to uid, "SeriesId" to seriesId, "Limit" to limit, "Fields" to CARD, "ImageTypeLimit" to 1, "EnableResumable" to resumable))
              )

              suspend fun item(id: String): Item = Item(get("/Items/$id", mapOf("userId" to uid)))

              suspend fun similar(id: String): List<Item> = items(get("/Items/$id/Similar", mapOf("userId" to uid, "Limit" to 24, "Fields" to LIGHT)))

              suspend fun seasons(seriesId: String): List<Item> = items(get("/Shows/$seriesId/Seasons", mapOf("userId" to uid, "Fields" to LIGHT)))

              suspend fun episodes(seriesId: String, seasonId: String?): List<Item> = items(
                  get("/Shows/$seriesId/Episodes", mapOf("userId" to uid, "SeasonId" to seasonId, "Fields" to "Overview,PrimaryImageAspectRatio,MediaSources"))
              )

              suspend fun firstEpisode(seriesId: String): Item? {
                  val all = episodes(seriesId, null)
                  return all.firstOrNull { (it.parentIndex ?: 1) > 0 } ?: all.firstOrNull()
              }

              suspend fun nextEpisode(ep: Item): Item? {
                  val sid = ep.seriesId ?: return null
                  val list = items(get("/Shows/$sid/Episodes", mapOf("userId" to uid, "StartItemId" to ep.id, "Limit" to 2, "Fields" to "Overview")))
                  return list.getOrNull(1)?.takeIf { it.id != ep.id }
              }

              suspend fun setFavorite(id: String, fav: Boolean) {
                  if (fav) post("/UserFavoriteItems/$id", mapOf("userId" to uid)) else delete("/UserFavoriteItems/$id", mapOf("userId" to uid))
              }

              suspend fun setPlayed(id: String, played: Boolean) {
                  if (played) post("/UserPlayedItems/$id", mapOf("userId" to uid)) else delete("/UserPlayedItems/$id", mapOf("userId" to uid))
              }

              suspend fun genres(types: String?, parentId: String? = null): List<String> =
                  items(get("/Genres", mapOf("userId" to uid, "IncludeItemTypes" to types, "ParentId" to parentId, "SortBy" to "SortName")))
                      .map { it.name }.filter { it.isNotBlank() }

              suspend fun search(term: String): List<Item> =
                  query(mapOf("SearchTerm" to term, "IncludeItemTypes" to "Movie,Series,Episode,BoxSet", "Limit" to 60)).first

              suspend fun segments(id: String): List<Segment> {
                  val list = mutableListOf<Segment>()
                  try {
                      get("/MediaSegments/$id").optJSONArray("Items").objs().forEach { s ->
                          list.add(Segment(s.optString("Type"), s.optLong("StartTicks") / 10_000, s.optLong("EndTicks") / 10_000))
                      }
                  } catch (e: Exception) {
                  }
                  if (list.isEmpty()) {
                      try {
                          val o = get("/Episode/$id/IntroSkipperSegments")
                          fun add(key: String, type: String) {
                              val x = o.optJSONObject(key) ?: return
                              val start = x.optDouble("IntroStart", x.optDouble("Start", 0.0))
                              val end = x.optDouble("IntroEnd", x.optDouble("End", 0.0))
                              if (x.optBoolean("Valid", true) && end > start) list.add(Segment(type, (start * 1000).toLong(), (end * 1000).toLong()))
                          }
                          add("Introduction", "Intro")
                          add("Credits", "Outro")
                      } catch (e: Exception) {
                      }
                  }
                  return list
              }

              // ---------- Images ----------

              fun img(id: String, type: String, tag: String?, w: Int, idx: Int? = null): String = buildString {
                  append(server.trimEnd('/')).append("/Items/").append(id).append("/Images/").append(type)
                  if (idx != null) append("/").append(idx)
                  append("?fillWidth=").append(w).append("&quality=85")
                  if (tag != null) append("&tag=").append(tag)
              }

              fun poster(i: Item, w: Int = 360): String? {
                  val seriesTag = i.j.s("SeriesPrimaryImageTag")
                  if (i.type == "Episode" && seriesTag != null && i.seriesId != null) return img(i.seriesId, "Primary", seriesTag, w)
                  i.primaryTag?.let { return img(i.id, "Primary", it, w) }
                  if (seriesTag != null && i.seriesId != null) return img(i.seriesId, "Primary", seriesTag, w)
                  return null
              }

              fun backdrop(i: Item, w: Int = 1280): String? {
                  i.backdropTags.firstOrNull()?.let { return img(i.id, "Backdrop", it, w, 0) }
                  val pid = i.j.s("ParentBackdropItemId")
                  val pt = i.j.optJSONArray("ParentBackdropImageTags").strs().firstOrNull()
                  if (pid != null && pt != null) return img(pid, "Backdrop", pt, w, 0)
                  if (i.type == "Episode") i.primaryTag?.let { return img(i.id, "Primary", it, w) }
                  return null
              }

              fun thumb(i: Item, w: Int = 640): String? {
                  if (i.type == "Episode") i.primaryTag?.let { return img(i.id, "Primary", it, w) }
                  i.imageTags?.s("Thumb")?.let { return img(i.id, "Thumb", it, w) }
                  val ptid = i.j.s("ParentThumbItemId")
                  val ptt = i.j.s("ParentThumbImageTag")
                  if (ptid != null && ptt != null) return img(ptid, "Thumb", ptt, w)
                  return backdrop(i, w)
              }

              fun logo(i: Item, w: Int = 600): String? {
                  i.imageTags?.s("Logo")?.let { return img(i.id, "Logo", it, w) }
                  val pid = i.j.s("ParentLogoItemId")
                  val pt = i.j.s("ParentLogoImageTag")
                  return if (pid != null && pt != null) img(pid, "Logo", pt, w) else null
              }

              fun userImg(a: Account): String? = a.imageTag?.let {
                  buildUrl(a.server, "/Users/${a.userId}/Images/Primary", mapOf("tag" to it, "fillWidth" to 240))
              }

              fun personImg(p: Person): String? = p.tag?.let { img(p.id, "Primary", it, 300) }

              fun downloadUrl(id: String): String = url("/Items/$id/Download", mapOf("api_key" to token))

              // ---------- Playback ----------

              private fun supports(mime: String): Boolean = try {
                  MediaCodecList(MediaCodecList.REGULAR_CODECS).codecInfos.any { info ->
                      !info.isEncoder && info.supportedTypes.any { it.equals(mime, ignoreCase = true) }
                  }
              } catch (e: Exception) {
                  false
              }

              private val videoCodecs: String by lazy {
                  buildList {
                      add("h264")
                      if (supports("video/hevc")) add("hevc")
                      if (supports("video/x-vnd.on2.vp9")) add("vp9")
                      if (supports("video/av01")) add("av1")
                      if (supports("video/x-vnd.on2.vp8")) add("vp8")
                      add("mpeg4")
                  }.joinToString(",")
              }

              private val audioCodecs: String by lazy {
                  buildList {
                      addAll(listOf("aac", "mp3", "flac", "opus", "vorbis", "pcm_s16le", "pcm_s24le"))
                      if (supports("audio/ac3")) add("ac3")
                      if (supports("audio/eac3")) add("eac3")
                      if (supports("audio/vnd.dts")) add("dts")
                      if (supports("audio/true-hd")) add("truehd")
                  }.joinToString(",")
              }

              private fun deviceProfile(maxBitrate: Int): JSONObject {
                  val transcodeAudio = if (audioCodecs.contains("ac3")) "aac,mp3,ac3" else "aac,mp3"
                  val subs = JSONArray()
                  listOf("srt", "subrip", "ass", "ssa", "pgssub", "pgs", "dvdsub", "vtt", "webvtt", "mov_text").forEach {
                      subs.put(JSONObject().put("Format", it).put("Method", "Embed"))
                  }
                  listOf("srt", "subrip", "vtt", "webvtt", "ass", "ssa").forEach {
                      subs.put(JSONObject().put("Format", it).put("Method", "External"))
                  }
                  subs.put(JSONObject().put("Format", "vtt").put("Method", "Hls"))
                  return JSONObject()
                      .put("Name", "Feynos Flix")
                      .put("MaxStreamingBitrate", maxBitrate)
                      .put("MaxStaticBitrate", 400_000_000)
                      .put("DirectPlayProfiles", JSONArray().put(
                          JSONObject().put("Container", "mp4,m4v,mkv,webm,mov,ts,mpegts,3gp").put("Type", "Video")
                              .put("VideoCodec", videoCodecs).put("AudioCodec", audioCodecs)
                      ))
                      .put("TranscodingProfiles", JSONArray().put(
                          JSONObject().put("Container", "ts").put("Type", "Video").put("VideoCodec", "h264")
                              .put("AudioCodec", transcodeAudio).put("Protocol", "hls").put("Context", "Streaming")
                              .put("MaxAudioChannels", "6").put("MinSegments", 1).put("BreakOnNonKeyFrames", true)
                      ))
                      .put("ContainerProfiles", JSONArray())
                      .put("CodecProfiles", JSONArray())
                      .put("SubtitleProfiles", subs)
              }

              suspend fun plan(
                  id: String, startTicks: Long, audioIndex: Int?, subIndex: Int?, mediaSourceId: String?,
                  maxBitrate: Int, forceTranscode: Boolean
              ): StreamPlan {
                  val body = JSONObject()
                      .put("UserId", uid)
                      .put("DeviceProfile", deviceProfile(maxBitrate))
                      .put("MaxStreamingBitrate", maxBitrate)
                      .put("StartTimeTicks", startTicks)
                      .put("AutoOpenLiveStream", true)
                      .put("EnableDirectPlay", !forceTranscode)
                      .put("EnableDirectStream", !forceTranscode)
                      .put("EnableTranscoding", true)
                      .put("AllowVideoStreamCopy", true)
                      .put("AllowAudioStreamCopy", true)
                  if (audioIndex != null) body.put("AudioStreamIndex", audioIndex)
                  if (subIndex != null) body.put("SubtitleStreamIndex", subIndex)
                  if (mediaSourceId != null) body.put("MediaSourceId", mediaSourceId)
                  val pi = JSONObject(post("/Items/$id/PlaybackInfo", mapOf("userId" to uid), body))
                  val src = pi.optJSONArray("MediaSources").objs().firstOrNull()
                      ?: throw IOException(pi.s("ErrorCode") ?: "No playable media found")
                  val psid = pi.s("PlaySessionId")
                  val msid = src.optString("Id")
                  val direct = !forceTranscode && src.optBoolean("SupportsDirectPlay")
                  val streamUrl: String
                  val method: String
                  if (direct) {
                      streamUrl = url("/Videos/$id/stream", mapOf("static" to true, "mediaSourceId" to msid, "api_key" to token, "PlaySessionId" to psid, "DeviceId" to Prefs.deviceId))
                      method = "DirectPlay"
                  } else {
                      val t = src.s("TranscodingUrl") ?: throw IOException(pi.s("ErrorCode") ?: "The server can't stream this item to this device")
                      streamUrl = server.trimEnd('/') + t
                      method = "Transcode"
                  }
                  val subs = src.optJSONArray("MediaStreams").objs()
                      .filter { it.optString("Type") == "Subtitle" && it.s("DeliveryMethod") == "External" }
                      .map { s ->
                          val idx = s.optInt("Index")
                          val delivery = s.s("DeliveryUrl")
                          val u = if (delivery != null) server.trimEnd('/') + delivery
                          else url("/Videos/$id/$msid/Subtitles/$idx/0/Stream.vtt", mapOf("api_key" to token))
                          val lower = u.lowercase()
                          val mime = when {
                              lower.contains(".srt") -> MimeTypes.APPLICATION_SUBRIP
                              lower.contains(".ass") || lower.contains(".ssa") -> MimeTypes.TEXT_SSA
                              else -> MimeTypes.TEXT_VTT
                          }
                          ExtSub(u, mime, s.s("Language"), s.s("DisplayTitle") ?: s.s("Title") ?: "Subtitle $idx")
                      }
                  return StreamPlan(streamUrl, method, msid, psid, src, subs)
              }

              suspend fun report(kind: String, itemId: String, msId: String, psid: String?, posMs: Long, paused: Boolean, method: String) {
                  val b = JSONObject()
                      .put("ItemId", itemId)
                      .put("MediaSourceId", msId)
                      .put("PlaySessionId", psid ?: JSONObject.NULL)
                      .put("PositionTicks", posMs * 10_000)
                      .put("IsPaused", paused)
                      .put("CanSeek", true)
                      .put("PlayMethod", method)
                  val path = when (kind) {
                      "start" -> "/Sessions/Playing"
                      "progress" -> "/Sessions/Playing/Progress"
                      else -> "/Sessions/Playing/Stopped"
                  }
                  try {
                      post(path, body = b)
                  } catch (e: Exception) {
                  }
              }

              suspend fun stopEncoding(psid: String?) {
                  if (psid == null) return
                  try {
                      delete("/Videos/ActiveEncodings", mapOf("deviceId" to Prefs.deviceId, "playSessionId" to psid))
                  } catch (e: Exception) {
                  }
              }
          }
          FEYNOS_EOF

