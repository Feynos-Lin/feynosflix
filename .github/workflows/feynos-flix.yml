              var autoNext by remember { mutableStateOf(Prefs.autoPlayNext) }
              var autoSkip by remember { mutableStateOf(Prefs.autoSkipIntro) }
              var subsOn by remember { mutableStateOf(Prefs.subsOn) }
              var subScale by remember { mutableFloatStateOf(Prefs.subScale) }
              var audioLang by remember { mutableStateOf(Prefs.audioLang) }
              var subLang by remember { mutableStateOf(Prefs.subLang) }
              var upd by remember { mutableStateOf(Prefs.checkUpdates) }
              var qMenu by remember { mutableStateOf(false) }
              val rowColors = ListItemDefaults.colors(containerColor = Bg)

              Column(Modifier.fillMaxSize().background(Bg)) {
                  SubTopBar("App Settings")
                  Column(Modifier.verticalScroll(rememberScrollState()).navigationBarsPadding().padding(bottom = 32.dp)) {
                      Text("Playback", color = Purple, fontWeight = FontWeight.Bold, modifier = Modifier.padding(16.dp, 12.dp, 16.dp, 4.dp))
                      Box {
                          ListItem(
                              headlineContent = { Text("Streaming quality") },
                              supportingContent = { Text(qualityLabel(bitrate)) },
                              colors = rowColors,
                              modifier = Modifier.clickable { qMenu = true }
                          )
                          DropdownMenu(expanded = qMenu, onDismissRequest = { qMenu = false }) {
                              QUALITIES.forEach { (b, l) ->
                                  DropdownMenuItem(text = { Text(l) }, onClick = { bitrate = b; Prefs.maxBitrate = b; qMenu = false })
                              }
                          }
                      }
                      SwitchRow("Autoplay next episode", "Starts the next episode with a countdown", autoNext) { autoNext = it; Prefs.autoPlayNext = it }
                      SwitchRow("Skip intros automatically", "Uses Jellyfin media segments or the Intro Skipper plugin", autoSkip) { autoSkip = it; Prefs.autoSkipIntro = it }
                      SwitchRow("Subtitles on by default", null, subsOn) { subsOn = it; Prefs.subsOn = it }
                      ListItem(
                          headlineContent = { Text("Subtitle size: ${(subScale * 100).toInt()}%") },
                          supportingContent = {
                              Slider(
                                  value = subScale,
                                  onValueChange = { subScale = it; Prefs.subScale = it },
                                  valueRange = 0.6f..2f,
                                  colors = SliderDefaults.colors(thumbColor = Purple, activeTrackColor = Purple)
                              )
                          },
                          colors = rowColors
                      )
                      OutlinedTextField(
                          value = audioLang,
                          onValueChange = { audioLang = it.trim(); Prefs.audioLang = audioLang },
                          label = { Text("Preferred audio language (e.g. eng, jpn)") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 6.dp)
                      )
                      OutlinedTextField(
                          value = subLang,
                          onValueChange = { subLang = it.trim(); Prefs.subLang = subLang },
                          label = { Text("Preferred subtitle language (e.g. eng)") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 6.dp)
                      )
                      Text("App", color = Purple, fontWeight = FontWeight.Bold, modifier = Modifier.padding(16.dp, 20.dp, 16.dp, 4.dp))
                      SwitchRow("Check for updates on launch", "Looks for new releases on GitHub", upd) { upd = it; Prefs.checkUpdates = it }
                      ListItem(
                          headlineContent = { Text("Clear image cache") },
                          supportingContent = { Text("Frees space; artwork re-downloads as you browse") },
                          colors = rowColors,
                          modifier = Modifier.clickable {
                              ctx.imageLoader.memoryCache?.clear()
                              ctx.imageLoader.diskCache?.clear()
                              toast(ctx, "Image cache cleared")
                          }
                      )
                      ListItem(
                          headlineContent = { Text("Version") },
                          supportingContent = { Text("Feynos Flix ${BuildConfig.VERSION_NAME}") },
                          colors = rowColors
                      )
                  }
              }
          }
          FEYNOS_EOF

      - name: Write Ui.kt
        run: |
