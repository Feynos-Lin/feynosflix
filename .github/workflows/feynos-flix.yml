# Feynos Flix — a Netflix-style Jellyfin client for Android.
# This one file contains the whole app. Each push (or a manual run from the
# Actions tab) builds a signed APK and publishes it as a GitHub release, which
# the app itself checks so it can update in place.
name: Build Feynos Flix

on:
  push:
    branches: [ main, master ]
    paths: [ '.github/workflows/feynos-flix.yml' ]
  workflow_dispatch:
    inputs:
      notes:
        description: 'What changed in this build (shown in the release and the in-app update prompt)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: feynos-flix
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Write build config and resources
        run: |
          set -e
          mkdir -p flix flix/app flix/app/src/main flix/app/src/main/res/drawable flix/app/src/main/res/mipmap-anydpi-v26 flix/app/src/main/res/values flix/app/src/main/res/xml
          cat > 'flix/app/build.gradle.kts' <<'FEYNOS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          val buildNum = (System.getenv("BUILD_NUMBER") ?: "1").toInt()
          val repoName = System.getenv("GITHUB_REPOSITORY") ?: ""

          android {
              namespace = "com.feynos.flix"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.feynos.flix"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = buildNum
                  versionName = "1.0.$buildNum"
                  buildConfigField("String", "GITHUB_REPO", "\"$repoName\"")
              }

              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KEYSTORE_PATH") ?: "release.jks")
                      storePassword = System.getenv("KEYSTORE_PASS") ?: "feynosflix"
                      keyAlias = "feynos"
                      keyPassword = System.getenv("KEYSTORE_PASS") ?: "feynosflix"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf(
                      "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                      "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
                      "-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi",
                      "-opt-in=coil.annotation.ExperimentalCoilApi"
                  )
              }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.navigation:navigation-compose:2.8.5")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          FEYNOS_EOF
          cat > 'flix/app/proguard-rules.pro' <<'FEYNOS_EOF'
          -dontwarn org.conscrypt.**
          -dontwarn org.bouncycastle.**
          -dontwarn org.openjsse.**
          -dontwarn javax.annotation.**
          -dontwarn okhttp3.internal.platform.**
          FEYNOS_EOF
          cat > 'flix/app/src/main/AndroidManifest.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:name=".FlixApp"
                  android:label="Feynos Flix"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:enableOnBackInvokedCallback="true"
                  android:theme="@style/Theme.Flix">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          FEYNOS_EOF
          cat > 'flix/app/src/main/res/drawable/ic_launcher_foreground.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FF9B6BFF" android:pathData="M37,31h35v10h-25v9h20v9h-20v18h-10z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M58,63l0,14l12,-7z" />
          </vector>
          FEYNOS_EOF
          cat > 'flix/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          FEYNOS_EOF
          cat > 'flix/app/src/main/res/values/colors.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#FF0A0A0D</color>
              <color name="icon_bg">#FF160B2B</color>
          </resources>
          FEYNOS_EOF
          cat > 'flix/app/src/main/res/values/themes.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Flix" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          FEYNOS_EOF
          cat > 'flix/app/src/main/res/xml/file_paths.xml' <<'FEYNOS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="updates" path="updates/" />
          </paths>
          FEYNOS_EOF
          cat > 'flix/build.gradle.kts' <<'FEYNOS_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          FEYNOS_EOF
          cat > 'flix/gradle.properties' <<'FEYNOS_EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          FEYNOS_EOF
          cat > 'flix/settings.gradle.kts' <<'FEYNOS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FeynosFlix"
          include(":app")
          FEYNOS_EOF

      - name: Write App.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/App.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.app.Application
          import android.content.Context
          import android.content.SharedPreferences
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import coil.ImageLoader
          import coil.ImageLoaderFactory
          import coil.disk.DiskCache
          import coil.memory.MemoryCache
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          /** Long-lived scope for fire-and-forget calls (playback reports) that must outlive a screen. */
          val appScope = CoroutineScope(SupervisorJob() + Dispatchers.Main)

          class FlixApp : Application(), ImageLoaderFactory {
              override fun onCreate() {
                  super.onCreate()
                  Prefs.init(this)
                  Session.restore()
                  Downloads.init(this)
                  HomeCache.init(this)
              }

              override fun newImageLoader(): ImageLoader = ImageLoader.Builder(this)
                  .crossfade(true)
                  .respectCacheHeaders(false)
                  .memoryCache { MemoryCache.Builder(this).maxSizePercent(0.25).build() }
                  .diskCache { DiskCache.Builder().directory(cacheDir.resolve("images")).maxSizeBytes(512L * 1024 * 1024).build() }
                  .build()
          }

          data class Account(
              val server: String,
              val userId: String,
              val userName: String,
              val token: String,
              val serverName: String,
              val imageTag: String?
          ) {
              val key: String get() = "$server|$userId"

              fun toJson(): JSONObject = JSONObject()
                  .put("server", server).put("userId", userId).put("userName", userName)
                  .put("token", token).put("serverName", serverName).put("imageTag", imageTag ?: JSONObject.NULL)

              companion object {
                  fun from(o: JSONObject) = Account(
                      o.getString("server"), o.getString("userId"), o.optString("userName"),
                      o.getString("token"), o.optString("serverName"),
                      if (o.isNull("imageTag")) null else o.optString("imageTag")
                  )
              }
          }

          object Session {
              var accounts by mutableStateOf<List<Account>>(emptyList())
                  private set
              var account by mutableStateOf<Account?>(null)
                  private set
              var showProfiles by mutableStateOf(false)
              var tick by mutableIntStateOf(0)

              fun restore() {
                  accounts = Prefs.accounts
                  account = accounts.firstOrNull { it.key == Prefs.activeKey } ?: accounts.firstOrNull()
                  showProfiles = accounts.size > 1
              }

              fun select(a: Account) {
                  account = a
                  Prefs.activeKey = a.key
                  showProfiles = false
                  tick++
              }

              fun add(a: Account) {
                  accounts = accounts.filter { it.key != a.key } + a
                  Prefs.accounts = accounts
                  select(a)
              }

              fun remove(a: Account) {
                  accounts = accounts.filter { it.key != a.key }
                  Prefs.accounts = accounts
                  if (account?.key == a.key) {
                      account = null
                      Prefs.activeKey = null
                      showProfiles = accounts.isNotEmpty()
                  }
              }
          }

          val QUALITIES = listOf(
              0 to "Auto (best available)",
              80_000_000 to "80 Mbps",
              40_000_000 to "40 Mbps (4K)",
              20_000_000 to "20 Mbps (1080p high)",
              10_000_000 to "10 Mbps (1080p)",
              6_000_000 to "6 Mbps (720p)",
              3_000_000 to "3 Mbps",
              1_500_000 to "1.5 Mbps (data saver)"
          )

          fun qualityLabel(b: Int): String = QUALITIES.firstOrNull { it.first == b }?.second ?: "${b / 1_000_000} Mbps"

          object Prefs {
              private lateinit var sp: SharedPreferences

              fun init(ctx: Context) {
                  sp = ctx.getSharedPreferences("feynos_flix", Context.MODE_PRIVATE)
              }

              val deviceId: String
                  get() = sp.getString("deviceId", null)
                      ?: UUID.randomUUID().toString().also { sp.edit().putString("deviceId", it).apply() }

              var accounts: List<Account>
                  get() = try {
                      val a = JSONArray(sp.getString("accounts", "[]") ?: "[]")
                      (0 until a.length()).map { Account.from(a.getJSONObject(it)) }
                  } catch (e: Exception) {
                      emptyList()
                  }
                  set(v) {
                      val arr = JSONArray()
                      v.forEach { arr.put(it.toJson()) }
                      sp.edit().putString("accounts", arr.toString()).apply()
                  }

              var activeKey: String?
                  get() = sp.getString("active", null)
                  set(v) { sp.edit().putString("active", v).apply() }

              var maxBitrate: Int
                  get() = sp.getInt("maxBitrate", 0)
                  set(v) { sp.edit().putInt("maxBitrate", v).apply() }

              var autoPlayNext: Boolean
                  get() = sp.getBoolean("autoNext", true)
                  set(v) { sp.edit().putBoolean("autoNext", v).apply() }

              var autoSkipIntro: Boolean
                  get() = sp.getBoolean("autoSkip", false)
                  set(v) { sp.edit().putBoolean("autoSkip", v).apply() }

              var subsOn: Boolean
                  get() = sp.getBoolean("subsOn", false)
                  set(v) { sp.edit().putBoolean("subsOn", v).apply() }

              var subScale: Float
                  get() = sp.getFloat("subScale", 1f)
                  set(v) { sp.edit().putFloat("subScale", v).apply() }

              var audioLang: String
                  get() = sp.getString("audioLang", "") ?: ""
                  set(v) { sp.edit().putString("audioLang", v).apply() }

              var subLang: String
                  get() = sp.getString("subLang", "") ?: ""
                  set(v) { sp.edit().putString("subLang", v).apply() }

              var checkUpdates: Boolean
                  get() = sp.getBoolean("checkUpdates", true)
                  set(v) { sp.edit().putBoolean("checkUpdates", v).apply() }

              fun bitrateOf(b: Int): Int = if (b <= 0) 200_000_000 else b
          }
          FEYNOS_EOF

      - name: Write Downloads.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/Downloads.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.Settings
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.core.content.FileProvider
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException
          import java.util.concurrent.TimeUnit

          class DlEntry(
              val id: String,
              val dmId: Long,
              val name: String,
              val subtitle: String?,
              val seriesName: String?,
              val type: String,
              val path: String,
              val poster: String?,
              val overview: String?,
              var positionMs: Long
          ) {
              fun toJson(): JSONObject = JSONObject()
                  .put("id", id).put("dmId", dmId).put("name", name).put("subtitle", subtitle ?: JSONObject.NULL)
                  .put("seriesName", seriesName ?: JSONObject.NULL).put("type", type).put("path", path)
                  .put("poster", poster ?: JSONObject.NULL).put("overview", overview ?: JSONObject.NULL).put("positionMs", positionMs)

              companion object {
                  fun from(o: JSONObject) = DlEntry(
                      o.getString("id"), o.optLong("dmId"), o.optString("name"), o.s("subtitle"), o.s("seriesName"),
                      o.optString("type"), o.optString("path"), o.s("poster"), o.s("overview"), o.optLong("positionMs")
                  )
              }
          }

          class DlStatus(val state: Int, val done: Long, val total: Long)

          object Downloads {
              private lateinit var ctx: Context
              var entries by mutableStateOf<List<DlEntry>>(emptyList())
                  private set

              private val http = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(60, TimeUnit.SECONDS).build()

              fun init(c: Context) {
                  ctx = c.applicationContext
                  entries = try {
                      val a = JSONArray(sp().getString("list", "[]") ?: "[]")
                      (0 until a.length()).map { DlEntry.from(a.getJSONObject(it)) }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun sp() = ctx.getSharedPreferences("downloads", Context.MODE_PRIVATE)

              private fun save() {
                  val a = JSONArray()
                  entries.forEach { a.put(it.toJson()) }
                  sp().edit().putString("list", a.toString()).apply()
              }

              private fun dm(): DownloadManager = ctx.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager

              fun get(id: String): DlEntry? = entries.firstOrNull { it.id == id }

              suspend fun start(item: Item) {
                  if (get(item.id) != null) return
                  val full = if (item.j.has("MediaSources")) item else Jf.item(item.id)
                  val container = full.j.optJSONArray("MediaSources").objs().firstOrNull()?.s("Container")
                      ?.substringBefore(',')?.ifBlank { null } ?: "mkv"
                  val fileName = "${item.id}.$container"
                  val dir = ctx.getExternalFilesDir(Environment.DIRECTORY_MOVIES) ?: throw IOException("Storage not available")
                  val req = DownloadManager.Request(Uri.parse(Jf.downloadUrl(item.id)))
                      .setTitle(item.name)
                      .setDescription("Feynos Flix")
                      .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                      .setDestinationInExternalFilesDir(ctx, Environment.DIRECTORY_MOVIES, fileName)
                      .addRequestHeader("Authorization", Jf.authHeader(Jf.token))
                  val dmId = dm().enqueue(req)

                  val posterFile = File(ctx.filesDir, "posters/${item.id}.jpg")
                  val posterUrl = Jf.poster(item, 400)
                  val savedPoster = if (posterUrl == null) null else withContext(Dispatchers.IO) {
                      try {
                          posterFile.parentFile?.mkdirs()
                          http.newCall(Request.Builder().url(posterUrl).build()).execute().use { r ->
                              val bytes = r.body?.bytes()
                              if (r.isSuccessful && bytes != null) {
                                  posterFile.writeBytes(bytes)
                                  posterFile.absolutePath
                              } else null
                          }
                      } catch (e: Exception) {
                          null
                      }
                  }

                  val sub = if (item.type == "Episode") listOfNotNull(item.seriesName, item.episodeLabel).joinToString(" · ") else item.year?.toString()
                  entries = entries + DlEntry(
                      item.id, dmId, item.name, sub, item.seriesName, item.type,
                      File(dir, fileName).absolutePath, savedPoster, item.overview, 0L
                  )
                  save()
              }

              fun status(e: DlEntry): DlStatus {
                  try {
                      dm().query(DownloadManager.Query().setFilterById(e.dmId))?.use { c ->
                          if (c.moveToFirst()) {
                              return DlStatus(
                                  c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS)),
                                  c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR)),
                                  c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES))
                              )
                          }
                      }
                  } catch (ex: Exception) {
                  }
                  val f = File(e.path)
                  return if (f.exists() && f.length() > 0) DlStatus(DownloadManager.STATUS_SUCCESSFUL, f.length(), f.length())
                  else DlStatus(DownloadManager.STATUS_FAILED, 0, 0)
              }

              fun delete(e: DlEntry) {
                  try {
                      dm().remove(e.dmId)
                  } catch (ex: Exception) {
                  }
                  File(e.path).delete()
                  e.poster?.let { File(it).delete() }
                  entries = entries.filter { it.id != e.id }
                  save()
              }

              fun savePosition(id: String, ms: Long) {
                  get(id)?.positionMs = ms
                  save()
              }
          }

          class Release(val tag: String, val build: Int, val notes: String, val apkUrl: String)

          object Updater {
              private val http = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(120, TimeUnit.SECONDS).build()

              suspend fun latest(): Release? = withContext(Dispatchers.IO) {
                  if (BuildConfig.GITHUB_REPO.isBlank()) return@withContext null
                  val req = Request.Builder()
                      .url("https://api.github.com/repos/${BuildConfig.GITHUB_REPO}/releases/latest")
                      .header("Accept", "application/vnd.github+json")
                      .build()
                  http.newCall(req).execute().use { r ->
                      if (!r.isSuccessful) return@withContext null
                      val o = JSONObject(r.body?.string() ?: "{}")
                      val tag = o.optString("tag_name")
                      val build = tag.substringAfterLast('.').filter { it.isDigit() }.toIntOrNull() ?: 0
                      val apk = o.optJSONArray("assets").objs().firstOrNull { it.optString("name").endsWith(".apk") }
                          ?.optString("browser_download_url") ?: return@withContext null
                      Release(tag, build, o.optString("body"), apk)
                  }
              }

              fun isNewer(r: Release): Boolean = r.build > BuildConfig.VERSION_CODE

              suspend fun downloadAndInstall(ctx: Context, r: Release, onProgress: (Float) -> Unit) {
                  val file = File(ctx.cacheDir, "updates/FeynosFlix.apk")
                  withContext(Dispatchers.IO) {
                      file.parentFile?.mkdirs()
                      http.newCall(Request.Builder().url(r.apkUrl).build()).execute().use { resp ->
                          if (!resp.isSuccessful) throw IOException("Download failed (${resp.code})")
                          val body = resp.body ?: throw IOException("Empty download")
                          val total = body.contentLength()
                          var read = 0L
                          var lastPct = -1
                          body.byteStream().use { input ->
                              file.outputStream().use { out ->
                                  val buf = ByteArray(64 * 1024)
                                  while (true) {
                                      val n = input.read(buf)
                                      if (n < 0) break
                                      out.write(buf, 0, n)
                                      read += n
                                      if (total > 0) {
                                          val pct = (read * 100 / total).toInt()
                                          if (pct != lastPct) {
                                              lastPct = pct
                                              withContext(Dispatchers.Main) { onProgress(pct / 100f) }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
                  install(ctx, file)
              }

              fun install(ctx: Context, file: File) {
                  if (Build.VERSION.SDK_INT >= 26 && !ctx.packageManager.canRequestPackageInstalls()) {
                      ctx.startActivity(
                          Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${ctx.packageName}"))
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                      toast(ctx, "Allow installs from Feynos Flix, then tap Update again")
                      return
                  }
                  val uri = FileProvider.getUriForFile(ctx, "${ctx.packageName}.files", file)
                  ctx.startActivity(
                      Intent(Intent.ACTION_VIEW)
                          .setDataAndType(uri, "application/vnd.android.package-archive")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }
          }
          FEYNOS_EOF

      - name: Write Home.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/Home.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.content.Context
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.pulltorefresh.PullToRefreshBox
          import androidx.compose.runtime.*
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException

          class HomeData(
              val hero: Item?,
              val rows: List<RowData>,
              val genres: List<String>,
              val loading: Boolean = false,
              val fromDisk: Boolean = false
          )

          /** Keeps the last home screen in memory and on disk, so the app opens straight onto it. */
          object HomeCache {
              private lateinit var dir: File
              private val mem = HashMap<String, HomeData>()

              fun init(ctx: Context) {
                  dir = File(ctx.cacheDir, "home").apply { mkdirs() }
              }

              private fun key(acc: String, filter: String?) = "$acc|${filter ?: "all"}"
              private fun file(k: String) = File(dir, Integer.toHexString(k.hashCode()) + ".json")

              fun memory(acc: String, filter: String?): HomeData? = mem[key(acc, filter)]

              suspend fun disk(acc: String, filter: String?): HomeData? = withContext(Dispatchers.IO) {
                  try {
                      val f = file(key(acc, filter))
                      if (!f.exists()) null else fromJson(JSONObject(f.readText()))
                  } catch (e: Exception) {
                      null
                  }
              }

              fun put(acc: String, filter: String?, d: HomeData) {
                  val k = key(acc, filter)
                  mem[k] = d
                  val json = toJson(d).toString()
                  appScope.launch(Dispatchers.IO) {
                      try {
                          file(k).writeText(json)
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun toJson(d: HomeData): JSONObject {
                  val rows = JSONArray()
                  d.rows.forEach { r ->
                      val items = JSONArray()
                      r.items.forEach { items.put(it.j) }
                      rows.put(
                          JSONObject().put("key", r.key).put("title", r.title).put("style", r.style.name)
                              .put("more", r.moreRoute ?: JSONObject.NULL).put("items", items)
                      )
                  }
                  val genres = JSONArray()
                  d.genres.forEach { genres.put(it) }
                  return JSONObject().put("hero", d.hero?.j ?: JSONObject.NULL).put("genres", genres).put("rows", rows)
              }

              private fun fromJson(o: JSONObject): HomeData {
                  val hero = o.optJSONObject("hero")?.let { Item(it) }
                  val rows = o.optJSONArray("rows").objs().map { r ->
                      RowData(
                          r.optString("title"),
                          r.optJSONArray("items").objs().map { Item(it) },
                          runCatching { RowStyle.valueOf(r.optString("style")) }.getOrDefault(RowStyle.Poster),
                          r.s("more"),
                          r.optString("key")
                      )
                  }
                  return HomeData(hero, rows, o.optJSONArray("genres").strs(), loading = false, fromDisk = true)
              }
          }

          /**
           * Loads every home row in parallel.
           * First-ever load ([prev] is null): rows appear one by one as they arrive.
           * Refresh: the screen keeps showing [prev] and swaps everything in once, so nothing jumps around.
           */
          suspend fun loadHome(filter: String?, prev: HomeData?, reshuffle: Boolean, emit: (HomeData) -> Unit) {
              val types = filter ?: "Movie,Series"
              val streaming = prev == null
              val rows = HashMap<String, RowData>()
              var latestKeys = listOf<String>()
              var genreKeys = listOf<String>()
              var hero: Item? = if (prev != null && !reshuffle && !prev.fromDisk) prev.hero else null
              var genres: List<String> = if (prev != null && !reshuffle) prev.genres else emptyList()
              var ok = 0
              var failed = 0

              fun ordered(): List<RowData> {
                  val keys = listOf("continue", "next", "fav") + latestKeys.take(1) + listOf("top") + latestKeys.drop(1) + genreKeys
                  return keys.mapNotNull { rows[it] }.filter { it.items.isNotEmpty() }
              }

              fun publish() {
                  if (streaming) emit(HomeData(hero, ordered(), genres, loading = true))
              }

              suspend fun <T> safe(block: suspend () -> T): T? = try {
                  block().also { ok++ }
              } catch (e: CancellationException) {
                  throw e
              } catch (e: Exception) {
                  failed++
                  null
              }

              val card = mapOf("Fields" to Jf.CARD)

              coroutineScope {
                  fun row(key: String, title: String, style: RowStyle, more: String? = null, load: suspend () -> List<Item>) {
                      launch {
                          rows[key] = RowData(title, safe(load) ?: emptyList(), style, more, key)
                          publish()
                      }
                  }

                  if (hero == null) {
                      launch {
                          hero = safe {
                              Jf.query(
                                  mapOf("IncludeItemTypes" to types, "SortBy" to "Random", "Limit" to 1, "ImageTypes" to "Backdrop", "Fields" to "Genres"),
                                  count = false
                              ).first.firstOrNull()
                          }
                          publish()
                      }
                  }
                  row("continue", "Continue Watching", RowStyle.Wide) {
                      Jf.resume().filter {
                          when (filter) {
                              "Movie" -> it.type == "Movie"
                              "Series" -> it.type == "Episode"
                              else -> true
                          }
                      }
                  }
                  if (filter != "Movie") row("next", "Next Up", RowStyle.Wide) { Jf.nextUp(null, 20, false) }
                  row("fav", "My List", RowStyle.Poster, browseRoute("My List", "fav", "_", "Movie,Series,Episode")) {
                      Jf.query(card + mapOf("IncludeItemTypes" to types, "Filters" to "IsFavorite", "SortBy" to "DateCreated", "SortOrder" to "Descending", "Limit" to 30), count = false).first
                  }
                  row("top", "Top 10 on Your Server", RowStyle.Top10) {
                      Jf.query(card + mapOf("IncludeItemTypes" to types, "SortBy" to "CommunityRating,SortName", "SortOrder" to "Descending", "Limit" to 10), count = false).first
                  }
                  launch {
                      val views = (safe { Jf.views() } ?: emptyList()).filter { v ->
                          when (filter) {
                              "Movie" -> v.collectionType == "movies"
                              "Series" -> v.collectionType == "tvshows"
                              else -> v.collectionType in setOf("movies", "tvshows", "homevideos", "mixed", null)
                          }
                      }
                      latestKeys = views.map { "latest:${it.id}" }
                      views.forEach { v ->
                          row("latest:${v.id}", "New in ${v.name}", RowStyle.Poster, browseRoute(v.name, "lib", v.id, libTypes(v))) { Jf.latest(v.id) }
                      }
                  }
                  launch {
                      if (genres.isEmpty()) genres = safe { Jf.genres(types).distinct().shuffled().take(6) } ?: emptyList()
                      genreKeys = genres.map { "genre:$it" }
                      genres.forEach { g ->
                          row("genre:$g", g, RowStyle.Poster, browseRoute(g, "genre", g, types)) {
                              Jf.query(card + mapOf("Genres" to g, "IncludeItemTypes" to types, "SortBy" to "Random", "Limit" to 20), count = false).first
                          }
                      }
                  }
              }

              if (ok == 0 && failed > 0) throw IOException("Couldn't reach your Jellyfin server")
              emit(HomeData(hero, ordered(), genres, loading = false))
          }

          @Composable
          fun HomeSkeleton() {
              val w = LocalConfiguration.current.screenWidthDp
              Column(Modifier.fillMaxSize()) {
                  Box(Modifier.fillMaxWidth().height(if (w >= 600) 380.dp else (w * 1.4f).dp).background(Surf.copy(alpha = 0.5f)))
                  repeat(3) {
                      Box(Modifier.padding(16.dp, 22.dp, 16.dp, 8.dp).width(140.dp).height(16.dp).clip(RoundedCornerShape(4.dp)).background(Surf))
                      Row(Modifier.padding(horizontal = 16.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          repeat(5) { Box(Modifier.width(112.dp).height(168.dp).clip(RoundedCornerShape(6.dp)).background(Surf)) }
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen() {
              var filter by rememberSaveable { mutableStateOf<String?>(null) }
              var cats by remember { mutableStateOf(false) }
              val acc = Session.account?.key ?: ""
              var data by remember(filter, acc) { mutableStateOf(HomeCache.memory(acc, filter)) }
              var error by remember(filter, acc) { mutableStateOf<String?>(null) }
              var refreshing by remember { mutableStateOf(false) }
              var pulls by remember { mutableIntStateOf(0) }
              val tick = Session.tick

              LaunchedEffect(filter, acc, tick, pulls) {
                  if (data == null) data = HomeCache.disk(acc, filter)
                  try {
                      loadHome(filter, data, reshuffle = refreshing) { data = it }
                      data?.let { HomeCache.put(acc, filter, it) }
                      error = null
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      if (data == null) error = e.message ?: "Couldn't load"
                  }
                  refreshing = false
              }

              val listState = rememberLazyListState()
              val solid by remember { derivedStateOf { listState.firstVisibleItemIndex > 0 || listState.firstVisibleItemScrollOffset > 300 } }

              Box(Modifier.fillMaxSize().background(Bg)) {
                  PullToRefreshBox(
                      isRefreshing = refreshing,
                      onRefresh = {
                          refreshing = true
                          pulls++
                      },
                      modifier = Modifier.fillMaxSize()
                  ) {
                      val d = data
                      when {
                          d != null -> LazyColumn(state = listState, modifier = Modifier.fillMaxSize()) {
                              item(key = "hero") {
                                  val hero = d.hero
                                  when {
                                      hero != null -> Hero(hero)
                                      d.loading -> Box(
                                          Modifier.fillMaxWidth()
                                              .height(if (LocalConfiguration.current.screenWidthDp >= 600) 380.dp else (LocalConfiguration.current.screenWidthDp * 1.4f).dp)
                                              .background(Surf.copy(alpha = 0.5f))
                                      )
                                      else -> Spacer(Modifier.statusBarsPadding().height(110.dp))
                                  }
                              }
                              items(d.rows, key = { it.key }) { RowSection(it) }
                              item(key = "end") { Spacer(Modifier.height(24.dp)) }
                          }
                          error != null -> ErrorBox(error ?: "")
                          else -> HomeSkeleton()
                      }
                  }
                  HomeTopBar(filter, solid, onFilter = { filter = it }, onCats = { cats = true })
              }
              if (cats) CategoriesDialog(filter ?: "Movie,Series") { cats = false }
          }
          FEYNOS_EOF

      - name: Write Jellyfin.kt
        run: |
          set -e
          mkdir -p flix/app/src/main/java/com/feynos/flix
          cat > 'flix/app/src/main/java/com/feynos/flix/Jellyfin.kt' <<'FEYNOS_EOF'
          package com.feynos.flix

          import android.media.MediaCodecList
          import android.os.Build
          import androidx.media3.common.MimeTypes
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.concurrent.TimeUnit

          fun JSONObject.s(k: String): String? =
              if (!has(k) || isNull(k)) null else optString(k).takeIf { it.isNotEmpty() }

          fun JSONArray?.objs(): List<JSONObject> =
              if (this == null) emptyList() else (0 until length()).mapNotNull { optJSONObject(it) }

          fun JSONArray?.strs(): List<String> =
              if (this == null) emptyList() else (0 until length()).map { optString(it) }

          class Person(val id: String, val name: String, val role: String?, val type: String?, val tag: String?)

          class Segment(val type: String, val startMs: Long, val endMs: Long)

          class ExtSub(val url: String, val mime: String, val lang: String?, val label: String)

          class StreamPlan(
              val url: String,
              val method: String,
              val mediaSourceId: String,
              val playSessionId: String?,
              val source: JSONObject,
              val subs: List<ExtSub>
          )

          class ApiException(val code: Int, msg: String) : IOException(msg)

          class Item(val j: JSONObject) {
              val id: String = j.optString("Id")
              val name: String = j.s("Name") ?: ""
              val type: String = j.s("Type") ?: ""
              val overview: String? = j.s("Overview")
              val year: Int? = j.optInt("ProductionYear", 0).takeIf { it > 0 }
              val runTicks: Long = j.optLong("RunTimeTicks", 0L)
              val rating: Double? = j.optDouble("CommunityRating", Double.NaN).takeUnless { it.isNaN() }
              val officialRating: String? = j.s("OfficialRating")
              val seriesId: String? = j.s("SeriesId")
              val seriesName: String? = j.s("SeriesName")
              val seasonId: String? = j.s("SeasonId")
              val index: Int? = if (j.has("IndexNumber") && !j.isNull("IndexNumber")) j.optInt("IndexNumber") else null
              val parentIndex: Int? = if (j.has("ParentIndexNumber") && !j.isNull("ParentIndexNumber")) j.optInt("ParentIndexNumber") else null
              val imageTags: JSONObject? = j.optJSONObject("ImageTags")
              val primaryTag: String? = imageTags?.s("Primary")
              val backdropTags: List<String> = j.optJSONArray("BackdropImageTags").strs()
              private val ud: JSONObject? = j.optJSONObject("UserData")
              val positionTicks: Long = ud?.optLong("PlaybackPositionTicks", 0L) ?: 0L
              val played: Boolean = ud?.optBoolean("Played") ?: false
              val favorite: Boolean = ud?.optBoolean("IsFavorite") ?: false
              val playedPct: Double = ud?.optDouble("PlayedPercentage", 0.0)?.takeUnless { it.isNaN() } ?: 0.0
              val unplayed: Int = ud?.optInt("UnplayedItemCount", 0) ?: 0
              val genres: List<String> = j.optJSONArray("Genres").strs()
              val people: List<Person> = j.optJSONArray("People").objs().map {
                  Person(it.optString("Id"), it.optString("Name"), it.s("Role"), it.s("Type"), it.s("PrimaryImageTag"))
              }
              val collectionType: String? = j.s("CollectionType")
              val mediaType: String? = j.s("MediaType")
              val trailers: List<String> = j.optJSONArray("RemoteTrailers").objs().mapNotNull { it.s("Url") }
              val dateCreated: String? = j.s("DateCreated")
              val videoHeight: Int = (j.optJSONArray("MediaStreams").objs() +
                  j.optJSONArray("MediaSources").objs().flatMap { it.optJSONArray("MediaStreams").objs() })
                  .firstOrNull { it.optString("Type") == "Video" }?.optInt("Height", 0) ?: 0

              val isPlayable: Boolean
                  get() = type in setOf("Movie", "Episode", "Video", "MusicVideo", "Trailer") ||
                      (mediaType == "Video" && !j.optBoolean("IsFolder"))

              val progress: Float
                  get() = if (runTicks > 0 && positionTicks > 0) (positionTicks.toDouble() / runTicks).toFloat().coerceIn(0f, 1f)
                  else (playedPct / 100.0).toFloat().coerceIn(0f, 1f)

              val episodeLabel: String?
                  get() = if (type != "Episode") null else buildString {
                      if (parentIndex != null) append("S").append(parentIndex)
                      if (index != null) append(if (parentIndex != null) ":E" else "E").append(index)
                  }.ifEmpty { null }
          }

          object Jf {
              private const val LIGHT = "Overview,Genres,PrimaryImageAspectRatio,SeriesPrimaryImageTag,ChildCount,DateCreated"
              /** Just enough for a poster or thumbnail card — keeps list responses small and fast. */
              const val CARD = "PrimaryImageAspectRatio"
              private val JSON_TYPE = "application/json".toMediaType()

              private val http = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .build()

              val acc: Account get() = Session.account ?: throw IOException("Not signed in")
              val server: String get() = acc.server
              val uid: String get() = acc.userId
              val token: String get() = acc.token

              fun authHeader(token: String?): String {
                  val dev = Build.MODEL.replace("\"", "").ifBlank { "Android" }
                  val base = "MediaBrowser Client=\"Feynos Flix\", Device=\"$dev\", DeviceId=\"${Prefs.deviceId}\", Version=\"${BuildConfig.VERSION_NAME}\""
                  return if (token != null) "$base, Token=\"$token\"" else base
              }

              fun buildUrl(base: String, path: String, q: Map<String, Any?> = emptyMap()): String {
                  val b = (base.trimEnd('/') + path).toHttpUrl().newBuilder()
                  q.forEach { (k, v) -> if (v != null) b.addQueryParameter(k, v.toString()) }
                  return b.build().toString()
              }

              fun url(path: String, q: Map<String, Any?> = emptyMap()): String = buildUrl(server, path, q)

              suspend fun raw(method: String, url: String, body: Any? = null, token: String? = Session.account?.token): String =
                  withContext(Dispatchers.IO) {
                      val rb: RequestBody? = when {
                          body != null -> body.toString().toRequestBody(JSON_TYPE)
                          method == "POST" -> "".toRequestBody(JSON_TYPE)
                          else -> null
                      }
                      val req = Request.Builder()
                          .url(url)
                          .header("Authorization", authHeader(token))
                          .header("Accept", "application/json")
                          .method(method, rb)
                          .build()
                      http.newCall(req).execute().use { r ->
                          val text = r.body?.string() ?: ""
                          if (!r.isSuccessful) throw ApiException(r.code, "Server returned ${r.code}")
                          text
                      }
                  }

              suspend fun get(path: String, q: Map<String, Any?> = emptyMap()): JSONObject =
                  JSONObject(raw("GET", url(path, q)).ifBlank { "{}" })

              suspend fun getArr(path: String, q: Map<String, Any?> = emptyMap()): JSONArray =
                  JSONArray(raw("GET", url(path, q)).ifBlank { "[]" })

              suspend fun post(path: String, q: Map<String, Any?> = emptyMap(), body: Any? = null): String =
                  raw("POST", url(path, q), body)

              suspend fun delete(path: String, q: Map<String, Any?> = emptyMap()): String = raw("DELETE", url(path, q))

              private fun items(o: JSONObject): List<Item> = o.optJSONArray("Items").objs().map { Item(it) }

              // ---------- Server & sign in ----------

              suspend fun findServer(input: String): Pair<String, JSONObject> {
                  val t = input.trim().trimEnd('/')
                  val candidates = if (t.startsWith("http://") || t.startsWith("https://")) listOf(t)
                  else listOf("https://$t", "http://$t", "http://$t:8096")
                  var last: Exception? = null
                  for (c in candidates) {
                      try {
                          val info = JSONObject(raw("GET", buildUrl(c, "/System/Info/Public"), token = null))
                          if (info.has("Id") || info.has("ServerName")) return c to info
                      } catch (e: Exception) {
                          last = e
                      }
                  }
                  throw IOException("Couldn't reach a Jellyfin server at \"$input\"", last)
              }

              suspend fun publicUsers(server: String): List<JSONObject> = try {
                  JSONArray(raw("GET", buildUrl(server, "/Users/Public"), token = null)).objs()
              } catch (e: Exception) {
                  emptyList()
              }

              private fun toAccount(server: String, serverName: String, o: JSONObject): Account {
                  val u = o.getJSONObject("User")
                  return Account(server, u.getString("Id"), u.optString("Name"), o.getString("AccessToken"), serverName, u.s("PrimaryImageTag"))
              }

              suspend fun login(server: String, serverName: String, user: String, pw: String): Account {
                  val body = JSONObject().put("Username", user).put("Pw", pw)
                  return toAccount(server, serverName, JSONObject(raw("POST", buildUrl(server, "/Users/AuthenticateByName"), body, token = null)))
              }

              suspend fun qcInitiate(server: String): JSONObject = try {
                  JSONObject(raw("POST", buildUrl(server, "/QuickConnect/Initiate"), token = null))
              } catch (e: ApiException) {
                  JSONObject(raw("GET", buildUrl(server, "/QuickConnect/Initiate"), token = null))
              }

              suspend fun qcCheck(server: String, secret: String): Boolean =
                  JSONObject(raw("GET", buildUrl(server, "/QuickConnect/Connect", mapOf("secret" to secret)), token = null))
                      .optBoolean("Authenticated")

              suspend fun qcAuth(server: String, serverName: String, secret: String): Account {
                  val body = JSONObject().put("Secret", secret)
                  return toAccount(server, serverName, JSONObject(raw("POST", buildUrl(server, "/Users/AuthenticateWithQuickConnect"), body, token = null)))
              }

              suspend fun logoutAccount(a: Account) {
                  try {
                      raw("POST", buildUrl(a.server, "/Sessions/Logout"), token = a.token)
                  } catch (e: Exception) {
                  }
              }

              // ---------- Library ----------

              suspend fun views(): List<Item> = items(get("/UserViews", mapOf("userId" to uid)))

              suspend fun query(params: Map<String, Any?>, count: Boolean = true): Pair<List<Item>, Int> {
                  val base = mapOf<String, Any?>(
                      "userId" to uid, "Recursive" to true, "Fields" to LIGHT, "EnableTotalRecordCount" to count,
                      "ImageTypeLimit" to 1, "EnableImageTypes" to "Primary,Backdrop,Thumb,Logo"
                  )
                  val o = get("/Items", base + params)
                  return items(o) to o.optInt("TotalRecordCount")
              }

              suspend fun latest(parentId: String?, limit: Int = 24): List<Item> =
                  getArr("/Items/Latest", mapOf("userId" to uid, "ParentId" to parentId, "Limit" to limit, "Fields" to CARD, "GroupItems" to true, "ImageTypeLimit" to 1))
                      .objs().map { Item(it) }

              suspend fun resume(limit: Int = 20): List<Item> = items(
                  get("/UserItems/Resume", mapOf("userId" to uid, "Limit" to limit, "MediaTypes" to "Video", "Fields" to CARD, "ImageTypeLimit" to 1, "EnableImageTypes" to "Primary,Backdrop,Thumb"))
              )

              suspend fun nextUp(seriesId: String?, limit: Int, resumable: Boolean): List<Item> = items(
                  get("/Shows/NextUp", mapOf("userId" to uid, "SeriesId" to seriesId, "Limit" to limit, "Fields" to CARD, "ImageTypeLimit" to 1, "EnableResumable" to resumable))
              )

              suspend fun item(id: String): Item = Item(get("/Items/$id", mapOf("userId" to uid)))

              suspend fun similar(id: String): List<Item> = items(get("/Items/$id/Similar", mapOf("userId" to uid, "Limit" to 24, "Fields" to LIGHT)))

              suspend fun seasons(seriesId: String): List<Item> = items(get("/Shows/$seriesId/Seasons", mapOf("userId" to uid, "Fields" to LIGHT)))

              suspend fun episodes(seriesId: String, seasonId: String?): List<Item> = items(
                  get("/Shows/$seriesId/Episodes", mapOf("userId" to uid, "SeasonId" to seasonId, "Fields" to "Overview,PrimaryImageAspectRatio,MediaSources"))
              )

              suspend fun firstEpisode(seriesId: String): Item? {
                  val all = episodes(seriesId, null)
                  return all.firstOrNull { (it.parentIndex ?: 1) > 0 } ?: all.firstOrNull()
              }

              suspend fun nextEpisode(ep: Item): Item? {
                  val sid = ep.seriesId ?: return null
                  val list = items(get("/Shows/$sid/Episodes", mapOf("userId" to uid, "StartItemId" to ep.id, "Limit" to 2, "Fields" to "Overview")))
                  return list.getOrNull(1)?.takeIf { it.id != ep.id }
              }

              suspend fun setFavorite(id: String, fav: Boolean) {
                  if (fav) post("/UserFavoriteItems/$id", mapOf("userId" to uid)) else delete("/UserFavoriteItems/$id", mapOf("userId" to uid))
              }

              suspend fun setPlayed(id: String, played: Boolean) {
                  if (played) post("/UserPlayedItems/$id", mapOf("userId" to uid)) else delete("/UserPlayedItems/$id", mapOf("userId" to uid))
              }

              suspend fun genres(types: String?, parentId: String? = null): List<String> =
                  items(get("/Genres", mapOf("userId" to uid, "IncludeItemTypes" to types, "ParentId" to parentId, "SortBy" to "SortName")))
                      .map { it.name }.filter { it.isNotBlank() }

              suspend fun search(term: String): List<Item> =
                  query(mapOf("SearchTerm" to term, "IncludeItemTypes" to "Movie,Series,Episode,BoxSet", "Limit" to 60)).first

              suspend fun segments(id: String): List<Segment> {
                  val list = mutableListOf<Segment>()
                  try {
                      get("/MediaSegments/$id").optJSONArray("Items").objs().forEach { s ->
                          list.add(Segment(s.optString("Type"), s.optLong("StartTicks") / 10_000, s.optLong("EndTicks") / 10_000))
                      }
                  } catch (e: Exception) {
                  }
                  if (list.isEmpty()) {
                      try {
                          val o = get("/Episode/$id/IntroSkipperSegments")
                          fun add(key: String, type: String) {
                              val x = o.optJSONObject(key) ?: return
                              val start = x.optDouble("IntroStart", x.optDouble("Start", 0.0))
                              val end = x.optDouble("IntroEnd", x.optDouble("End", 0.0))
                              if (x.optBoolean("Valid", true) && end > start) list.add(Segment(type, (start * 1000).toLong(), (end * 1000).toLong()))
                          }
                          add("Introduction", "Intro")
                          add("Credits", "Outro")
                      } catch (e: Exception) {
                      }
                  }
                  return list
              }

              // ---------- Images ----------

              fun img(id: String, type: String, tag: String?, w: Int, idx: Int? = null): String = buildString {
                  append(server.trimEnd('/')).append("/Items/").append(id).append("/Images/").append(type)
                  if (idx != null) append("/").append(idx)
                  append("?fillWidth=").append(w).append("&quality=85")
                  if (tag != null) append("&tag=").append(tag)
              }

              fun poster(i: Item, w: Int = 360): String? {
                  val seriesTag = i.j.s("SeriesPrimaryImageTag")
                  if (i.type == "Episode" && seriesTag != null && i.seriesId != null) return img(i.seriesId, "Primary", seriesTag, w)
                  i.primaryTag?.let { return img(i.id, "Primary", it, w) }
                  if (seriesTag != null && i.seriesId != null) return img(i.seriesId, "Primary", seriesTag, w)
                  return null
              }

              fun backdrop(i: Item, w: Int = 1280): String? {
                  i.backdropTags.firstOrNull()?.let { return img(i.id, "Backdrop", it, w, 0) }
                  val pid = i.j.s("ParentBackdropItemId")
                  val pt = i.j.optJSONArray("ParentBackdropImageTags").strs().firstOrNull()
                  if (pid != null && pt != null) return img(pid, "Backdrop", pt, w, 0)
                  if (i.type == "Episode") i.primaryTag?.let { return img(i.id, "Primary", it, w) }
                  return null
              }

              fun thumb(i: Item, w: Int = 640): String? {
                  if (i.type == "Episode") i.primaryTag?.let { return img(i.id, "Primary", it, w) }
                  i.imageTags?.s("Thumb")?.let { return img(i.id, "Thumb", it, w) }
                  val ptid = i.j.s("ParentThumbItemId")
                  val ptt = i.j.s("ParentThumbImageTag")
                  if (ptid != null && ptt != null) return img(ptid, "Thumb", ptt, w)
                  return backdrop(i, w)
              }

              fun logo(i: Item, w: Int = 600): String? {
                  i.imageTags?.s("Logo")?.let { return img(i.id, "Logo", it, w) }
                  val pid = i.j.s("ParentLogoItemId")
                  val pt = i.j.s("ParentLogoImageTag")
                  return if (pid != null && pt != null) img(pid, "Logo", pt, w) else null
              }

              fun userImg(a: Account): String? = a.imageTag?.let {
                  buildUrl(a.server, "/Users/${a.userId}/Images/Primary", mapOf("tag" to it, "fillWidth" to 240))
              }

              fun personImg(p: Person): String? = p.tag?.let { img(p.id, "Primary", it, 300) }

              fun downloadUrl(id: String): String = url("/Items/$id/Download", mapOf("api_key" to token))

              // ---------- Playback ----------

              private fun supports(mime: String): Boolean = try {
                  MediaCodecList(MediaCodecList.REGULAR_CODECS).codecInfos.any { info ->
                      !info.isEncoder && info.supportedTypes.any { it.equals(mime, ignoreCase = true) }
                  }
              } catch (e: Exception) {
                  false
              }

              private val videoCodecs: String by lazy {
                  buildList {
                      add("h264")
                      if (supports("video/hevc")) add("hevc")
                      if (supports("video/x-vnd.on2.vp9")) add("vp9")
                      if (supports("video/av01")) add("av1")
                      if (supports("video/x-vnd.on2.vp8")) add("vp8")
                      add("mpeg4")
                  }.joinToString(",")
              }

              private val audioCodecs: String by lazy {
                  buildList {
                      addAll(listOf("aac", "mp3", "flac", "opus", "vorbis", "pcm_s16le", "pcm_s24le"))
                      if (supports("audio/ac3")) add("ac3")
                      if (supports("audio/eac3")) add("eac3")
                      if (supports("audio/vnd.dts")) add("dts")
                      if (supports("audio/true-hd")) add("truehd")
                  }.joinToString(",")
              }

              private fun deviceProfile(maxBitrate: Int): JSONObject {
                  val transcodeAudio = if (audioCodecs.contains("ac3")) "aac,mp3,ac3" else "aac,mp3"
                  val subs = JSONArray()
                  listOf("srt", "subrip", "ass", "ssa", "pgssub", "pgs", "dvdsub", "vtt", "webvtt", "mov_text").forEach {
                      subs.put(JSONObject().put("Format", it).put("Method", "Embed"))
                  }
                  listOf("srt", "subrip", "vtt", "webvtt", "ass", "ssa").forEach {
                      subs.put(JSONObject().put("Format", it).put("Method", "External"))
                  }
                  subs.put(JSONObject().put("Format", "vtt").put("Method", "Hls"))
                  return JSONObject()
                      .put("Name", "Feynos Flix")
                      .put("MaxStreamingBitrate", maxBitrate)
                      .put("MaxStaticBitrate", 400_000_000)
                      .put("DirectPlayProfiles", JSONArray().put(
                          JSONObject().put("Container", "mp4,m4v,mkv,webm,mov,ts,mpegts,3gp").put("Type", "Video")
                              .put("VideoCodec", videoCodecs).put("AudioCodec", audioCodecs)
                      ))
                      .put("TranscodingProfiles", JSONArray().put(
                          JSONObject().put("Container", "ts").put("Type", "Video").put("VideoCodec", "h264")
                              .put("AudioCodec", transcodeAudio).put("Protocol", "hls").put("Context", "Streaming")
                              .put("MaxAudioChannels", "6").put("MinSegments", 1).put("BreakOnNonKeyFrames", true)
                      ))
                      .put("ContainerProfiles", JSONArray())
                      .put("CodecProfiles", JSONArray())
                      .put("SubtitleProfiles", subs)
              }

              suspend fun plan(
                  id: String, startTicks: Long, audioIndex: Int?, subIndex: Int?, mediaSourceId: String?,
                  maxBitrate: Int, forceTranscode: Boolean
              ): StreamPlan {
                  val body = JSONObject()
                      .put("UserId", uid)
                      .put("DeviceProfile", deviceProfile(maxBitrate))
                      .put("MaxStreamingBitrate", maxBitrate)
                      .put("StartTimeTicks", startTicks)
                      .put("AutoOpenLiveStream", true)
                      .put("EnableDirectPlay", !forceTranscode)
                      .put("EnableDirectStream", !forceTranscode)
                      .put("EnableTranscoding", true)
                      .put("AllowVideoStreamCopy", true)
                      .put("AllowAudioStreamCopy", true)
                  if (audioIndex != null) body.put("AudioStreamIndex", audioIndex)
                  if (subIndex != null) body.put("SubtitleStreamIndex", subIndex)
                  if (mediaSourceId != null) body.put("MediaSourceId", mediaSourceId)
                  val pi = JSONObject(post("/Items/$id/PlaybackInfo", mapOf("userId" to uid), body))
                  val src = pi.optJSONArray("MediaSources").objs().firstOrNull()
                      ?: throw IOException(pi.s("ErrorCode") ?: "No playable media found")
                  val psid = pi.s("PlaySessionId")
                  val msid = src.optString("Id")
                  val direct = !forceTranscode && src.optBoolean("SupportsDirectPlay")
                  val streamUrl: String
                  val method: String
                  if (direct) {
                      streamUrl = url("/Videos/$id/stream", mapOf("static" to true, "mediaSourceId" to msid, "api_key" to token, "PlaySessionId" to psid, "DeviceId" to Prefs.deviceId))
                      method = "DirectPlay"
                  } else {
                      val t = src.s("TranscodingUrl") ?: throw IOException(pi.s("ErrorCode") ?: "The server can't stream this item to this device")
                      streamUrl = server.trimEnd('/') + t
                      method = "Transcode"
                  }
                  val subs = src.optJSONArray("MediaStreams").objs()
                      .filter { it.optString("Type") == "Subtitle" && it.s("DeliveryMethod") == "External" }
                      .map { s ->
                          val idx = s.optInt("Index")
                          val delivery = s.s("DeliveryUrl")
                          val u = if (delivery != null) server.trimEnd('/') + delivery
                          else url("/Videos/$id/$msid/Subtitles/$idx/0/Stream.vtt", mapOf("api_key" to token))
                          val lower = u.lowercase()
                          val mime = when {
                              lower.contains(".srt") -> MimeTypes.APPLICATION_SUBRIP
                              lower.contains(".ass") || lower.contains(".ssa") -> MimeTypes.TEXT_SSA
                              else -> MimeTypes.TEXT_VTT
                          }
                          ExtSub(u, mime, s.s("Language"), s.s("DisplayTitle") ?: s.s("Title") ?: "Subtitle $idx")
                      }
                  return StreamPlan(streamUrl, method, msid, psid, src, subs)
              }

              suspend fun report(kind: String, itemId: String, msId: String, psid: String?, posMs: Long, paused: Boolean, method: String) {
                  val b = JSONObject()
                      .put("ItemId", itemId)
                      .put("MediaSourceId", msId)
                      .put("PlaySessionId", psid ?: JSONObject.NULL)
                      .put("PositionTicks", posMs * 10_000)
                      .put("IsPaused", paused)
                      .put("CanSeek", true)
                      .put("PlayMethod", method)
                  val path = when (kind) {
                      "start" -> "/Sessions/Playing"
                      "progress" -> "/Sessions/Playing/Progress"
                      else -> "/Sessions/Playing/Stopped"
                  }
                  try {
                      post(path, body = b)
                  } catch (e: Exception) {
                  }
              }

              suspend fun stopEncoding(psid: String?) {
                  if (psid == null) return
                  try {
                      delete("/Videos/ActiveEncodings", mapOf("deviceId" to Prefs.deviceId, "playSessionId" to psid))
                  } catch (e: Exception) {
                  }
              }
          }
          FEYNOS_EOF

