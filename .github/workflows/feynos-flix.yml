          object UpdateUi {
              var release by mutableStateOf<Release?>(null)
              var checked = false
          }

          @Composable
          fun AppRoot() {
              var adding by remember { mutableStateOf(false) }
              val acc = Session.account
              Box(Modifier.fillMaxSize().background(Bg)) {
                  when {
                      Session.accounts.isEmpty() || adding -> LoginScreen(
                          onCancel = if (Session.accounts.isNotEmpty()) ({ adding = false }) else null,
                          onDone = { adding = false }
                      )
                      acc == null || Session.showProfiles -> ProfilePicker(onAdd = { adding = true })
                      else -> key(acc.key) { MainScaffold() }
                  }
              }
              LaunchedEffect(Unit) {
                  if (!UpdateUi.checked && Prefs.checkUpdates) {
                      UpdateUi.checked = true
                      val r = runCatching { Updater.latest() }.getOrNull()
                      if (r != null && Updater.isNewer(r)) UpdateUi.release = r
                  }
              }
              UpdateUi.release?.let { UpdateDialog(it) }
          }

          @Composable
          fun UpdateDialog(r: Release) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var progress by remember { mutableStateOf<Float?>(null) }
              AlertDialog(
                  onDismissRequest = { if (progress == null) UpdateUi.release = null },
                  title = { Text("Update available — ${r.tag}") },
                  text = {
                      Column {
                          Text("What's new", fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(6.dp))
                          Text(
                              r.notes.ifBlank { "Fixes and improvements." },
                              modifier = Modifier.heightIn(max = 280.dp).verticalScroll(rememberScrollState())
                          )
                          progress?.let {
                              Spacer(Modifier.height(12.dp))
                              ProgressLine(it)
                              Text("Downloading ${(it * 100).toInt()}%", fontSize = 12.sp, color = Muted)
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(enabled = progress == null, onClick = {
                          progress = 0f
                          scope.launch {
                              try {
                                  Updater.downloadAndInstall(ctx, r) { p -> progress = p }
                              } catch (e: Exception) {
                                  toast(ctx, "Update failed: ${e.message}")
                              }
                              progress = null
                          }
                      }) { Text("Update") }
                  },
                  dismissButton = { TextButton(onClick = { UpdateUi.release = null }) { Text("Later") } }
              )
          }

